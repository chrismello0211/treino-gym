# Testa o app a cada envio e so publica o site se tudo passar.
# Requer: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes (validador + navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validador (travas do codigo)
        run: node verify.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Instalar o Playwright e o Chromium
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testes de navegador
        run: python tests/rodar.py

  publicar:
    name: Publicar o site
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      # O pacote do site e grande (~250 MB, quase tudo as animacoes): as vezes o GitHub demora alguns
      # segundos para "ver" o pacote e a publicacao responde "No artifacts named github-pages".
      # Por isso: tenta, espera e tenta de novo, ate 3 vezes.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - name: Esperar 1 minuto antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - name: Esperar 2 minutos antes da ultima tentativa
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
