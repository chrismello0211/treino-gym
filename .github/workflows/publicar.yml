# Testa o app a cada envio e so publica se tudo passar.
#   ramo main  -> site de verdade (GitHub Pages)
#   ramo teste -> copia de teste (Firebase Hosting, canal "teste"), pra validar no celular antes de ir pra todos
# Requer: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Testar e publicar

on:
  push:
    branches: [main, teste]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes (validador + navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validador (travas do codigo)
        run: node verify.mjs

      - name: Calculo do placar do servidor igual ao do app
        run: node scripts/extrai-duelo.mjs --conferir

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Instalar o Playwright e o Chromium
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testes de navegador
        run: python tests/rodar.py

  publicar:
    name: Publicar o site
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      # O pacote do site e grande (~250 MB, quase tudo as animacoes): as vezes o GitHub demora alguns
      # segundos para "ver" o pacote e a publicacao responde "No artifacts named github-pages".
      # Por isso: tenta, espera e tenta de novo, ate 3 vezes.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - name: Esperar 1 minuto antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - name: Esperar 2 minutos antes da ultima tentativa
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

  copia-teste:
    name: Publicar a copia de teste
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/teste'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # o GitHub se identifica no Google Cloud sem chave guardada (federacao de identidade);
      # a conta de servico so pode publicar no Firebase Hosting e so aceita este repositorio
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/614727735456/locations/global/workloadIdentityPools/github/providers/treino-gym
          service_account: forgex-github-hosting@iron-gym-aa932.iam.gserviceaccount.com
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Publicar no endereco de teste (canal "teste", vale 30 dias)
        run: npx --yes firebase-tools@15 hosting:channel:deploy teste --project iron-gym-aa932 --expires 30d
