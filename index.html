/* ===== SUGESTÃO DE PROGRESSÃO ===== */
const PROGSUG={
  analisa(){
    const px=proximaRotina(); if(!px||!px.pasta) return null;
    const pid=px.pasta;
    const rids=new Set(Object.values(S.rotinas).filter(r=>r.pasta===pid).map(r=>r.id)); if(!rids.size) return null;
    const ts=Object.values(S.treinos).filter(t=>!t.apagado&&rids.has(t.rid));
    if(ts.length<8) return null;
    const primeiro=Math.min.apply(null, ts.map(t=>t.inicio));
    const semanas=Math.floor((agora()-primeiro)/(7*864e5));
    if(semanas<4) return null;
    const sn=(S.cfg.progSnooze||{})[pid]; if(sn && (agora()-sn)<14*864e5) return null;
    const nomePasta=(S.pastas[pid]&&S.pastas[pid].nome)||'sua ficha';
    return {pid, semanas, execs:ts.length, nomePasta};
  },
  snooze(pid){ S.cfg.progSnooze=S.cfg.progSnooze||{}; S.cfg.progSnooze[pid]=agora(); S.cfg.atualizado=agora(); salva('cfg'); NET.agenda('app/cfg',S.cfg); },
  banner(){
    const a=PROGSUG.analisa(); if(!a) return null;
    const ban=h('div',{class:'card',style:'border-color:var(--brand)'});
    ban.append(h('div',{class:'linha'},
      h('div',{class:'esp'},
        h('div',{class:'b800',style:'font-size:15.5px'},'Hora de evoluir? 📈'),
        h('div',{class:'f13 mut',style:'margin-top:3px;line-height:1.5'},'Você roda "'+a.nomePasta+'" há '+a.semanas+' semanas ('+a.execs+' treinos). Seu corpo se adapta, bora subir o estímulo.')),
      h('button',{class:'sug-x',style:'position:static;padding:6px',onclick:ev=>{ ev.stopPropagation(); PROGSUG.snooze(a.pid); ban.remove(); }},'✕')),
      h('button',{class:'btn btn-p',style:'margin-top:10px',onclick:()=>PROGSUG.folha(a)},'Ver opções'));
    return ban;
  },
  folha(a){
    const ar=S.cfg.assistResp;
    UI.folha('Evoluir a ficha',[
      h('div',{class:'f13 mut',style:'margin-bottom:12px;line-height:1.6'},'Progresso vem de aumentar o estímulo aos poucos. Escolhe como:'),
      h('button',{class:'menu-op',onclick:()=>PROGSUG.aplica(a.pid)},
        h('div',{style:'text-align:left'},h('div',{class:'b700'},'＋1 série no exercício principal'),h('div',{class:'f12 mut',style:'margin-top:2px'},'De cada treino da ficha. Simples e eficaz.'))),
      h('button',{class:'menu-op',onclick:()=>{
        UI.fechaFolha(); PROGSUG.snooze(a.pid);
        if(ar && ar.objetivo){ const up={iniciante:'intermediario',intermediario:'avancado',avancado:'avancado'};
          ASSIST.reset(); Object.assign(ASSIST.resp, ar, {nivel:up[ar.nivel||'iniciante']||'intermediario'});
          UI.vai('assistente'); ASSIST.iniciarGeracao(); }
        else ASSIST.abre();
      }}, h('div',{style:'text-align:left'},h('div',{class:'b700'},'Gerar ficha nova no assistente'),h('div',{class:'f12 mut',style:'margin-top:2px'}, ar? 'Com suas respostas, um nível acima.':'Monta do zero com o assistente.'))),
      h('button',{class:'menu-op',onclick:()=>{ UI.fechaFolha(); PROGSUG.snooze(a.pid); UI.toast('Beleza, te lembro daqui a umas semanas'); }},'Agora não')]);
  },
  aplica(pid){
    let n=0;
    Object.values(S.rotinas).filter(r=>r.pasta===pid).forEach(r=>{
      const e0=r.ex&&r.ex[0]; if(!e0||!e0.series||!e0.series.length) return;
      const ult=e0.series[e0.series.length-1];
      e0.series.push({tipo:'N', kg:ult.kg||'', reps:ult.reps||''});
      r.atualizado=agora(); NET.agenda('rotinas/'+r.id, r); if(typeof ROTPUB!=='undefined') ROTPUB.envia(r); n++;
    });
    salva('rotinas'); PROGSUG.snooze(pid);
    UI.fechaFolha(); UI.refaz(); UI.toast('+1 série no principal de '+n+' treino'+(n>1?'s':'')+' 💪', true);
  }
};

/* ---------- DETALHE DO TREINO ---------- */
function editaTempoTreino(t){
  const pad=n=>String(n).padStart(2,'0');
  const di=new Date(t.inicio), df=new Date(t.fim);
  const iniH=h('input',{type:'time',value:pad(di.getHours())+':'+pad(di.getMinutes())});
  const durMin=Math.max(0, Math.round((t.fim-t.inicio)/60000));
  const inpDur=h('input',{type:'number',inputmode:'numeric',value:String(durMin)});
  UI.folha('Ajustar tempo do treino',[
    h('div',{class:'f13 mut',style:'margin-bottom:12px;line-height:1.6'},'Corrija o horário de início e a duração deste treino.'),
    h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Horário de início'), iniH,
    h('div',{style:'height:12px'}),
    h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Duração (minutos)'), inpDur,
    h('div',{style:'height:14px'}),
    h('button',{class:'btn btn-p',onclick:()=>{
      const hhmm=(iniH.value||'').split(':');
      let ini=t.inicio;
      if(hhmm.length===2){ const c=new Date(t.inicio); c.setHours(+hhmm[0],+hhmm[1],0,0); ini=c.getTime(); }
      let dur=parseInt(inpDur.value,10); if(isNaN(dur)||dur<0) dur=durMin;
      t.inicio=ini; t.fim=ini+dur*60000; t.atualizado=agora();
      salva('treinos'); NET.agenda('treinos/'+t.id, t);
      if(S.perfil?.user && S.cfg.feedPub) NET.agenda('/feed/'+S.auth.uid+'/'+t.id, resumoTreino(t));
      UI.fechaFolha(); UI.refaz(); UI.toast('Tempo ajustado');
    }},'Salvar')]);
}
TELAS.concluido = function({id}){
  const t=S.treinos[id]; if(!t){ UI.vai('inicio',null,false); return; }
  UI.topo(h('div',{class:'topo-tit'},'Treino concluído'));
  const m=$('#main'); m.innerHTML='';
  const cv=h('canvas',{style:'position:fixed;inset:0;pointer-events:none;z-index:80'});
  document.body.appendChild(cv);
  try{
    const ctx=cv.getContext('2d'); const W=cv.width=window.innerWidth, H=cv.height=window.innerHeight;
    const cores=['#FF5A00','#FF7A2E','#FFD166','#4CC3FF','#7BE495'];
    const P=Array.from({length:46},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.5,v:2.4+Math.random()*3.4,w:5+Math.random()*6,a:Math.random()*Math.PI,va:(Math.random()-.5)*.25,c:cores[Math.floor(Math.random()*cores.length)]}));
    const t0=performance.now();
    (function tick(now){ if(!cv.isConnected) return; ctx.clearRect(0,0,W,H);
      P.forEach(p=>{ p.y+=p.v; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w*0.62); ctx.restore(); });
      if(now-t0<1900) requestAnimationFrame(tick); else cv.remove(); })(t0);
  }catch(e){ cv.remove(); }
  const durS=Math.round((t.fim-t.inicio)/1000);
  m.append(
    h('div',{style:'text-align:center;padding:18px 0 6px'},
      h('div',{style:'font-size:52px'},'🎉'),
      h('div',{class:'b800',style:'font-size:24px;margin-top:6px'},'Mandou bem!'),
      h('div',{class:'f13 mut',style:'margin-top:4px'}, t.titulo)),
    h('div',{class:'card'}, h('div',{class:'stats3'},
      h('div',{},h('div',{class:'k'},'Duração'),h('div',{class:'v'},CORE.fmtDur(durS))),
      h('div',{},h('div',{class:'k'},'Volume'),h('div',{class:'v'},CORE.fmtKg(t.volume||0)+' kg')),
      h('div',{},h('div',{class:'k'},'Séries'),h('div',{class:'v'},String(t.series||0))))));
  const prs=[]; (t.ex||[]).forEach(e=>{ (e.series||[]).forEach(s=>{ if(s.pr&&s.pr.length) prs.push({e,s}); }); });
  if(prs.length){
    const c=h('div',{class:'card',style:'border-color:var(--brand)'},
      h('div',{class:'secao',style:'margin:0 0 8px'},'🏅 Recordes de hoje ('+prs.length+')'));
    prs.slice(0,8).forEach(pp=>{ const x=BIB.ex(pp.e.exId);
      c.append(h('div',{class:'linha',style:'padding:6px 0'}, thumbEl(pp.e.exId),
        h('div',{class:'esp'}, h('div',{style:'font-size:14px'},x.n),
          h('div',{class:'f12 mut'}, (pp.s.kg?CORE.fmtKg(pp.s.kg)+' kg × ':'')+(x.t==='tempo'? fmtTempoEx(pp.s.reps) : pp.s.reps+' reps'))))); });
    m.append(c);
  }
  const meta=S.cfg.metaSem||0;
  if(meta){ const n=treinosNaSemana(inicioSemana(agora()));
    const a=anelSVG(n/meta,52); a.appendChild(h('div',{style:'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px'},n+'/'+meta));
    m.append(h('div',{class:'card'}, h('div',{class:'linha',style:'gap:12px'}, a,
      h('div',{class:'esp f13'}, n>=meta? 'Meta da semana batida! 🔥' : ('Faltam '+(meta-n)+' pra bater sua meta da semana.')))));
  }
  m.append(
    h('button',{class:'btn btn-p',style:'margin-top:4px',onclick:()=>SHARE.folha(t)},'📤 Compartilhar treino'),
    h('button',{class:'btn',style:'margin-top:10px',onclick:()=>UI.vai('treinoDet',{id:t.id})},'Ver detalhes'),
    h('button',{class:'btn',style:'margin-top:10px',onclick:()=>UI.vai('inicio',null,false)},'Fechar'));
};

const EXDEL = {
  usos(id){
    let tr=0, ro=0;
    Object.values(S.treinos||{}).forEach(t=>{ if(t.apagado) return;
      if((t.ex||[]).some(e=>e.exId===id)) tr++; });
    Object.values(S.rotinas||{}).forEach(r=>{ if(r.apagada) return;
      if((r.ex||[]).some(e=>e.exId===id)) ro++; });
    return {tr, ro};
  },
  apaga(id){
    const c=S.custom[id];
    const bkEx  = c ? JSON.parse(JSON.stringify(c)) : null;
    const bkPrs = (S.prs && S.prs[id]) ? JSON.parse(JSON.stringify(S.prs[id])) : null;
    delete S.custom[id]; salva('custom'); NET.agenda('custom/'+id, null);
    try{ EXSPUB.remove(id); }catch(e){}
    if(bkPrs){ delete S.prs[id]; salva('prs'); NET.agenda('prs/'+id, null); }
    BIB.lista = BIB.lista.filter(x=>x.id!==id); BIB.indexa();
    UI.pilha=[]; UI.vai('treino',null,false);
    UI.desfazer('\u201c'+((c&&c.n)||'Exercício')+'\u201d apagado', ()=>{
      if(bkEx){ S.custom[id]=bkEx; salva('custom'); NET.agenda('custom/'+id, bkEx);
        if(!bkEx.oc && !bkEx.ocultoPub){ try{ EXSPUB.publica(bkEx); }catch(e){} }
        if(!BIB.porId[id]) BIB.lista.push(bkEx); BIB.indexa(); }
      if(bkPrs){ S.prs[id]=bkPrs; salva('prs');
        Object.keys(bkPrs).forEach(tp=>NET.agenda('prs/'+id+'/'+tp, bkPrs[tp])); }
      UI.toast('Exercício restaurado ✓', true);
    });
  },
  folha(id){
    const c=S.custom[id]; if(!c) return;
    const u=EXDEL.usos(id);
    const usado = u.tr || u.ro;
    const onde = [];
    if(u.tr) onde.push(u.tr+' treino'+(u.tr>1?'s':'')+' do histórico');
    if(u.ro) onde.push(u.ro+' ficha'+(u.ro>1?'s':''));
    UI.folha('Apagar “'+c.n+'”?', [
      h('div',{class:'f14 mut',style:'padding:2px 2px 12px;line-height:1.7'},
        usado
          ? ('Este exercício está em '+onde.join(' e ')+'. Apagar não apaga esses treinos, mas eles vão passar a mostrar “Exercício removido” no lugar do nome, e os recordes dele somem.')
          : 'Ele não está em nenhum treino nem ficha. Pode apagar sem medo.'),
      usado ? h('div',{class:'f13 mut2',style:'padding:0 2px 14px;line-height:1.6'},
        'Se você só quer tirar da busca sem mexer no histórico, arquive em vez de apagar.') : null,
      usado ? h('button',{class:'btn',style:'margin-bottom:8px',onclick:()=>{
        const cc=S.custom[id]; cc.oc=1; cc.atualizado=agora();
        salva('custom'); NET.agenda('custom/'+id, cc); BIB.indexa();
        try{ EXSPUB.remove(id); }catch(e){}
        UI.fechaFolha(); UI.refaz(); UI.toast('Arquivado: sai da busca, histórico preservado ✓', true);
      }},'Arquivar em vez de apagar') : null,
      h('button',{class:'btn btn-err',onclick:()=>{ UI.fechaFolha(); EXDEL.apaga(id); }},'Apagar para sempre')
    ]);
  }
};
const EDTREINO = {
  abre(t){
    const copia = JSON.parse(JSON.stringify(t.ex||[]));
    const num = v => (v===''||v==null) ? '' : String(v);
    const render = ()=>{
      const secoes=[];
      secoes.push(h('div',{class:'f13 mut',style:'margin-bottom:6px;line-height:1.6'},
        'Ajuste as séries que você fez. Série sem carga e sem repetição é descartada ao salvar.'));
      copia.forEach((e,ie)=>{
        const x=BIB.ex(e.exId);
        secoes.push(h('div',{class:'linha',style:'margin:16px 0 4px;gap:10px'},
          h('div',{class:'b700',style:'font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, x.n),
          h('span',{class:'esp'}),
          h('button',{class:'btn btn-mini',style:'width:auto;padding:6px 11px;flex-shrink:0',
            onclick:()=>{ copia.splice(ie,1); render(); }},'Tirar')));
        (e.series||[]).forEach((s,is)=>{
          const eT = x.t==='tempo', eC = eT && x.g==='cardio';
          const kg=h('input',{type:'number',inputmode:'decimal',value:num(s.kg),style:'text-align:center'});
          const rp=h('input',{type:'text',inputmode:'numeric',style:'text-align:center',
            value: eT ? fmtTempoCampo(s.reps) : num(s.reps)});
          kg.oninput=()=>{ s.kg = kg.value===''? '' : Number(kg.value); };
          rp.oninput=()=>{ s.reps = eT ? parseTempoCampo(rp.value, eC)
                                       : (rp.value===''? '' : Number(rp.value)); };
          secoes.push(h('div',{class:'linha',style:'gap:8px;margin-bottom:6px'},
            h('span',{class:'f12 mut2',style:'width:16px;flex-shrink:0'}, String(is+1)),
            eT? null : kg,
            eT? null : h('span',{class:'f12 mut2',style:'flex-shrink:0'},'kg'),
            rp, h('span',{class:'f12 mut2',style:'flex-shrink:0'}, eT?'min:seg':'reps'),
            h('button',{class:'btn btn-mini',style:'width:34px;padding:6px;flex-shrink:0',
              onclick:()=>{ e.series.splice(is,1); render(); }},'\u2715')));
        });
        secoes.push(h('button',{class:'menu-op',style:'margin-bottom:2px',onclick:()=>{
          const u=(e.series||[])[e.series.length-1];
          e.series.push({tipo:'N', kg:u? u.kg:'', reps:u? u.reps:'', ok:true});
          render();
        }},'+ série'));
      });
      secoes.push(h('div',{style:'height:10px'}));
      secoes.push(h('button',{class:'menu-op',onclick:()=>{
        PICKER.abre(id=>{
          copia.push({exId:id, descanso:S.cfg.descanso||90, notas:'',
            series:[{tipo:'N', kg:'', reps:'', ok:true}]});
          render();
        });
      }},'+ exercício'));
      secoes.push(h('div',{style:'height:14px'}));
      secoes.push(h('button',{class:'btn btn-p',onclick:()=>EDTREINO.salva(t, copia)},'Salvar alterações'));
      FOLHA2.abre('Editar treino', secoes);
    };
    render();
  },
  salva(t, ex){
    const limpo = ex.map(e=>({ ...e, series:(e.series||[]).filter(s=>{
        const k=Number(s.kg)||0, r=Number(s.reps)||0; return k>0 || r>0;
      }).map(s=>({ ...s, ok:true })) })).filter(e=>e.series.length);
    if(!limpo.length){ UI.toast('O treino ficaria vazio. Use Excluir do histórico.'); return; }
    t.ex=limpo;
    t.volume=CORE.volumeTreino(t);
    t.series=CORE.seriesFeitas(t);
    t.atualizado=agora();
    S.treinos[t.id]=t; salva('treinos'); NET.agenda('treinos/'+t.id, t);

    // recordes voltam a bater com o historico editado
    try{
      const lista=Object.values(S.treinos).filter(z=>!z.apagado);
      const resets={};
      Object.entries(S.prs||{}).forEach(([exId,p])=>{ if(p && p.resetEm) resets[exId]=p.resetEm; });
      const copia=JSON.parse(JSON.stringify(lista));
      const novos=CORE.recomputaPRs(copia, resets);
      Object.entries(resets).forEach(([exId,r])=>{ novos[exId]=novos[exId]||{}; novos[exId].resetEm=r; });
      S.prs=novos; salva('prs');
      Object.entries(S.prs).forEach(([exId,p])=>{ if(p) NET.agenda('prs/'+exId, p); });
      const eu=copia.find(z=>z.id===t.id);
      if(eu){ t.recordes=eu.recordes||0; t.ex=eu.ex; salva('treinos'); NET.agenda('treinos/'+t.id, t); }
    }catch(err){ if(DEBUG) console.log('edtreino prs', err); }

    if(S.perfil && S.perfil.user && S.cfg.feedPub!==false && S.auth){
      NET.agenda('/feed/'+S.auth.uid+'/'+t.id, resumoTreino(t));
    }
    FOLHA2.fecha(); UI.refaz(); UI.toast('Treino atualizado \u2713', true);
  }
};

  const tog=h('div',{class:'gtoggle'});
  let metrica='dur', semanas=13;
  const desenha=()=>{
    const dados=CORE.agregaSemanas(Object.fromEntries(ts.map(t=>[t.id,t])), semanas, agora());
    const passo=semanas>40?8:semanas>20?4:2;
    const conf={dur:{f:d=>d.dur/3600, fmt:v=>(Math.round(v*10)/10)+'h'}, vol:{f:d=>d.vol, fmt:v=>CORE.fmtKg(v)+'kg'}, ser:{f:d=>d.ser, fmt:v=>String(Math.round(v))}}[metrica];
    grafBarras(cv, dados.map((d,i)=>{ const rf=new Date(d.w).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); return {v:conf.f(d), rot:(i%passo===0)?rf:'', rotFull:'Semana de '+rf}; }), conf.fmt);
  };
  [['3 meses',13],['6 meses',26],['Ano',52]].forEach(([rot,n])=>{
    per.appendChild(h('button',{class:'chip'+(n===semanas?' on':''),onclick:function(){ semanas=n; per.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); this.classList.add('on'); desenha(); }},rot));
  });
  [['dur','Duração'],['vol','Volume'],['ser','Séries']].forEach(([v,rot])=>{
    tog.appendChild(h('button',{class:'chip'+(v===metrica?' on':''),onclick:function(){ metrica=v; tog.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); this.classList.add('on'); desenha(); }},rot));
  });
  card.append(per,cv,tog);
  m.appendChild(card);
  requestAnimationFrame(desenha);

  if(S.auth) NET.get('/seguidores/'+S.auth.uid).then(v=>{ const el=$('#pf-segrs'); if(el) el.textContent=Object.keys(v||{}).length+' seguidores'; });
  m.appendChild(h('div',{class:'secao'},'Painel'));
  m.appendChild(h('div',{class:'grade2'},
    h('button',{class:'btn',onclick:()=>UI.vai('stats')},'Estatísticas'),
    h('button',{class:'btn',onclick:()=>PICKER.abre(null,'consulta')},'Exercícios'),
    h('button',{class:'btn',onclick:()=>UI.vai('medidas')},'Medições'),
    h('button',{class:'btn',onclick:()=>UI.vai('calendario')},'Calendário')));

  m.appendChild(h('div',{class:'secao'},'Treinamentos'));
  const meus=ts.slice().sort((a,b)=>b.inicio-a.inicio);
  if(!meus.length) m.appendChild(h('div',{class:'vazio'},'Nenhum treino registrado ainda.'));
  else{
    const alvoLs=h('div',{}); m.appendChild(alvoLs);
    let mostrando=0;
    const maisBt=h('button',{class:'btn',style:'margin-top:2px'},'Mostrar mais');
    const poe=n=>{
      meus.slice(mostrando, mostrando+n).forEach(t=>alvoLs.appendChild(cartaoFeed({meu:true, dono:S.auth&&S.auth.uid, t, id:t.id, inicio:t.inicio})));
      mostrando+=n; if(mostrando>=meus.length) maisBt.remove();
    };
    maisBt.onclick=()=>poe(10);
    poe(10); if(meus.length>10) m.appendChild(maisBt);
  }
};

const IMG = {
  escolhe(){ return new Promise(res=>{
    const inp=h('input',{type:'file', accept:'image/*', style:'display:none'});
    inp.addEventListener('change',()=>{ res(inp.files[0]||null); inp.remove(); });
    document.body.appendChild(inp); inp.click();
    setTimeout(()=>{ if(document.body.contains(inp)){ inp.remove(); } }, 120000);
  }); },
  comprime(file, maxLado, q){ return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('leitura'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('imagem'));
      img.onload=()=>{
        let sw=img.width, sh=img.height, src=img;
        const esc=Math.min(1, maxLado/Math.max(sw,sh));
        const alvoW=Math.max(1,Math.round(sw*esc)), alvoH=Math.max(1,Math.round(sh*esc));
        // reduz por metades até perto do alvo: nitidez muito melhor que redução num passo só
        while(sw*0.5>alvoW && sh*0.5>alvoH){
          const c2=document.createElement('canvas');
          c2.width=Math.round(sw*0.5); c2.height=Math.round(sh*0.5);
          const g2=c2.getContext('2d'); g2.imageSmoothingEnabled=true; g2.imageSmoothingQuality='high';
          g2.drawImage(src,0,0,c2.width,c2.height);
          src=c2; sw=c2.width; sh=c2.height;
        }
        const c=document.createElement('canvas');
        c.width=alvoW; c.height=alvoH;
        const g=c.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
        g.drawImage(src,0,0,alvoW,alvoH);
        let out=c.toDataURL('image/jpeg', q);
        if(out.length>280000) out=c.toDataURL('image/jpeg', Math.max(0.5,(q||0.72)-0.16));
        res(out);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }); }
};

const FOTOVIEW={
  el:null, img:null, sc:1, tx:0, ty:0, baseW:0, baseH:0,
  pts:new Map(), g0:null, lastTap:0, swipe:null,
  abre(src){
    if(FOTOVIEW.el) FOTOVIEW.fecha();
    const ov=h('div',{style:'position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:96;display:flex;align-items:center;justify-content:center;touch-action:none;overscroll-behavior:contain'});

    const x=h('button',{style:'position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:none;font-size:18px;cursor:pointer;z-index:2',onclick:ev=>{ ev.stopPropagation(); FOTOVIEW.fecha(); }},'✕');
    ov.append(img, x);
    document.body.appendChild(ov); document.body.style.overflow='hidden';
    FOTOVIEW.el=ov; FOTOVIEW.img=img; FOTOVIEW.sc=1; FOTOVIEW.tx=0; FOTOVIEW.ty=0; FOTOVIEW.pts.clear(); FOTOVIEW.g0=null;
    const mede=()=>{ const r=img.getBoundingClientRect(); FOTOVIEW.baseW=r.width/FOTOVIEW.sc; FOTOVIEW.baseH=r.height/FOTOVIEW.sc; };
    if(img.complete) mede(); else img.onload=mede;

    ov.addEventListener('pointermove', FOTOVIEW._pm);
    ov.addEventListener('pointerup', FOTOVIEW._pu);

    ov.addEventListener('touchmove', ev=>ev.preventDefault(), {passive:false});
  },
  fecha(){ if(!FOTOVIEW.el) return; FOTOVIEW.el.remove(); FOTOVIEW.el=null; FOTOVIEW.img=null; document.body.style.overflow=''; },
  _clamp(){
    const vw=window.innerWidth, vh=window.innerHeight;
    const mw=Math.max(0,(FOTOVIEW.baseW*FOTOVIEW.sc-vw)/2)+ (FOTOVIEW.sc>1? 40:0);
    const mh=Math.max(0,(FOTOVIEW.baseH*FOTOVIEW.sc-vh)/2)+ (FOTOVIEW.sc>1? 40:0);
    FOTOVIEW.tx=Math.max(-mw, Math.min(mw, FOTOVIEW.tx));

  },
  _aplica(anim){ const i=FOTOVIEW.img; if(!i) return;
    i.style.transition=anim? 'transform .18s ease':'';
    i.style.transform='translate3d('+FOTOVIEW.tx+'px,'+FOTOVIEW.ty+'px,0) scale('+FOTOVIEW.sc+')'; },
  _zoomEm(mx,my,novoSc,anim){
    const C={x:window.innerWidth/2, y:window.innerHeight/2};
    const s0=FOTOVIEW.sc, t0={x:FOTOVIEW.tx,y:FOTOVIEW.ty};
    novoSc=Math.max(1, Math.min(4, novoSc));
    FOTOVIEW.tx = mx - C.x - (novoSc/s0)*(mx - C.x - t0.x);
    FOTOVIEW.ty = my - C.y - (novoSc/s0)*(my - C.y - t0.y);
    FOTOVIEW.sc=novoSc;
    if(FOTOVIEW.sc===1){ FOTOVIEW.tx=0; FOTOVIEW.ty=0; }
    FOTOVIEW._clamp(); FOTOVIEW._aplica(anim);
  },
  _pd(ev){
    if(ev.target && ev.target.closest && ev.target.closest('button')) return; // deixa o ✕ clicar normal
    ev.preventDefault();

    if(FOTOVIEW.pts.size===2){

    } else if(FOTOVIEW.pts.size===1){

      const novo=Math.max(1, Math.min(4, g.sc*(d/g.d)));

        FOTOVIEW._aplica(false);
      } else {
        FOTOVIEW.tx=g.t.x+dx; FOTOVIEW.ty=g.t.y+dy;
        FOTOVIEW._clamp(); FOTOVIEW._aplica(false);

    }
  },
  _pu(ev){

        else FOTOVIEW.lastTap=agr;
      }
    }
    if(FOTOVIEW.pts.size<2) FOTOVIEW.g0= FOTOVIEW.pts.size===1? (function(){ const p=[...FOTOVIEW.pts.values()][0]; return {m:{x:p.x,y:p.y}, sc:FOTOVIEW.sc, t:{x:FOTOVIEW.tx,y:FOTOVIEW.ty}}; })() : null;
  },
  _wh(ev){ ev.preventDefault(); FOTOVIEW._zoomEm(ev.clientX, ev.clientY, FOTOVIEW.sc*(ev.deltaY<0? 1.15:0.87), false); }
};

const FOTOS = {
  cache:{},
  async pega(dono, tid){
    FOTOS.cache[dono]=FOTOS.cache[dono]||{};
    if(tid in FOTOS.cache[dono]) return FOTOS.cache[dono][tid];
    const v=await NET.get('/fotos/'+dono+'/'+tid);
    FOTOS.cache[dono][tid]=v||null;
    return v||null;
  },
  obs: (typeof IntersectionObserver!=='undefined') ? new IntersectionObserver(entradas=>{
    entradas.forEach(en=>{
      if(!en.isIntersecting) return;
      FOTOS.obs.unobserve(en.target);
      const el=en.target;
      FOTOS.pega(el.dataset.dono, el.dataset.tid).then(f=>{
        if(!f){ el.remove(); return; }
        const img=h('img',{class:'foto-post', src:f, alt:'Foto do treino', loading:'lazy'});
        el.replaceWith(img);
      });
    });
  },{rootMargin:'250px'}) : null,
  lazy(dono, tid){
    const ph=h('div',{class:'foto-esq'},'Carregando foto…');
    ph.dataset.dono=dono; ph.dataset.tid=tid;
    if(FOTOS.obs) FOTOS.obs.observe(ph);
    else FOTOS.pega(dono,tid).then(f=>{ if(f){ ph.replaceWith(h('img',{class:'foto-post',src:f,loading:'lazy'})); } else ph.remove(); });
    return ph;
  }
};

/* ---------- superséries ---------- */
const SS = {
  CORES:['#FF6B2C','#00A8E1','#3ECF6E','#B07CFF','#FF5C8A'],
  cor(g){ return SS.CORES[(g-1)%SS.CORES.length]; },
  liga(list, ix){
    if(ix>=list.length-1) return false;
    const a=list[ix], b=list[ix+1];
    const g=a.ss||b.ss||(Math.max(0,...list.map(q=>q.ss||0))+1);
    a.ss=g; b.ss=g; return true;
  },
  solta(list, ix){
    const g=list[ix].ss; if(!g) return;
    delete list[ix].ss;
    const resto=list.filter(q=>q.ss===g);
    if(resto.length===1) delete resto[0].ss;
  },
  rotulo(list, e){
    const gs=[...new Set(list.filter(q=>q.ss).map(q=>q.ss))];
    const i=gs.indexOf(e.ss);
    return i<0?'':String.fromCharCode(65+i);
  },
  aplica(card, list, e){
    if(!e.ss) return null;
    const c=SS.cor(e.ss);
    card.style.borderLeft='3px solid '+c;
    return h('div',{class:'ss-tag',style:'background:'+c+'22;color:'+c},'SUPERSSÉRIE '+SS.rotulo(list,e));
  }
};

/* ---------- treino ativo entre aparelhos ---------- */
const SYNCATIVO = {
  _t:null,
  ATRASO: 10000,     // agrupa as mexidas: 1 subida a cada 10s de silencio
  // marca quem mexeu e quando. Sem isso nao da pra resolver conflito.
  carimba(){
    if(!S.ativo) return;
    S.ativo.dev = DEV;
    S.ativo.devNome = nomeAparelho();
    S.ativo.atualizado = agora();
  },
  // sobe depois de um tempinho parado (uso normal: marcar serie, digitar carga)
  agenda(){
    if(!S.auth || !S.ativo) return;
    clearTimeout(SYNCATIVO._t);
    SYNCATIVO._t=setTimeout(()=>SYNCATIVO.sobeJa(), SYNCATIVO.ATRASO);
  },
  // sobe na hora (comecar, concluir, descartar)
  sobeJa(){
    clearTimeout(SYNCATIVO._t); SYNCATIVO._t=null;
    if(!S.auth) return;
    if(!S.ativo){ NET.agenda('ativo', null); return; }
    SYNCATIVO.carimba();
    NET.agenda('ativo', S.ativo);
  },
  limpa(){
    clearTimeout(SYNCATIVO._t); SYNCATIVO._t=null;
    if(S.auth) NET.agenda('ativo', null);
  },
  // trabalho feito de verdade neste treino
  temTrabalho(t){
    return !!(t && (t.ex||[]).some(e=>(e.series||[]).some(s=>s.ok)));
  },
  // guarda um treino no historico em vez de jogar fora
  arquiva(t, aviso){
    if(!SYNCATIVO.temTrabalho(t)) return false;
    const feitos=(t.ex||[]).map(e=>Object.assign({}, e, {series:(e.series||[]).filter(s=>s.ok)}))
                           .filter(e=>e.series.length);
    if(!feitos.length) return false;
    const fim = t.atualizado || agora();
    delete t._estr; delete t._avEstr;
    const salvo={ id:t.id, rid:t.rid, titulo:t.titulo, inicio:t.inicio, fim,
      ex:feitos, volume:CORE.volumeTreino({ex:feitos}), series:CORE.seriesFeitas({ex:feitos}),
      recordes:CORE.contaRecordes({ex:feitos}), atualizado:agora() };
    S.treinos[salvo.id]=salvo; salva('treinos'); NET.agenda('treinos/'+salvo.id, salvo);
    if(aviso!==false) UI.toast('O outro treino foi guardado no seu histórico ✓', true);
    return true;
  },
  assume(t){
    S.ativo=t; SYNCATIVO.carimba(); salva('ativo'); SYNCATIVO.sobeJa();
  },
  // chamado no boot, depois que a nuvem desceu
  resolve(daNuvem){
    const local = S.ativo;
    let remoto = (daNuvem && daNuvem.id) ? daNuvem : null;

    // 1) o que esta na fila daqui e mais novo que a nuvem. Se ainda nao
    //    subiu o estado do ativo, a nuvem esta desatualizada: ignora.
    const pend = (S.fila||[]).filter(f=>f && f.path==='ativo');
    if(pend.length){
      const ult = pend[pend.length-1];
      if(!ult.val || !ult.val.id) return;                 // aqui ja foi encerrado
      if(!remoto || ult.val.id!==remoto.id) remoto=null;   // aqui e' outro/mais novo
    }
    // 2) trava dura: treino que ja esta no historico NUNCA volta a ficar ativo
    if(remoto && S.treinos[remoto.id] && !S.treinos[remoto.id].apagado){
      SYNCATIVO.limpa();
      remoto=null;
    }

    // nada na nuvem: este aparelho manda
    if(!remoto){ if(local) SYNCATIVO.sobeJa(); return; }

    // mesmo treino: fica a versao mais recente, sem incomodar ninguem
    if(local && local.id===remoto.id){
      if((remoto.atualizado||0) > (local.atualizado||0)) { S.ativo=remoto; salva('ativo'); UI.refaz(); }
      else SYNCATIVO.sobeJa();
      return;
    }

    // veio deste mesmo aparelho e aqui nao tem nada: retoma calado
    if(!local && remoto.dev===DEV){ S.ativo=remoto; salva('ativo'); return; }

    const qdo = remoto.inicio ? dataRelativa(remoto.inicio) : '';
    const ondeR = (remoto.devNome && remoto.dev!==DEV) ? remoto.devNome : 'outro aparelho';
    const resumo = t => {
      const ns=(t.ex||[]).reduce((a,e)=>a+(e.series||[]).filter(s=>s.ok).length,0);
      return (t.titulo||'Treino')+' · '+ns+' série'+(ns===1?'':'s')+' feita'+(ns===1?'':'s');
    };

    // nada aqui, tem la: oferece retomar
    if(!local){
      setTimeout(()=>{ try{
        UI.folha('Treino em andamento',[
          h('div',{class:'f14 mut',style:'padding:2px 2px 12px;line-height:1.7'},
            'Você começou um treino no '+ondeR+(qdo?' '+qdo:'')+' e não concluiu.'),
          h('div',{class:'card',style:'margin-bottom:14px'},
            h('div',{class:'b700',style:'font-size:15px'}, resumo(remoto))),
          h('button',{class:'btn btn-p',style:'margin-bottom:8px',onclick:()=>{
            UI.fechaFolha(); SYNCATIVO.assume(remoto); UI.pilha=[]; UI.vai('ativo',null,false);
          }},'Continuar de onde parei'),
          h('button',{class:'btn',onclick:()=>{
            UI.fechaFolha();
            const guardou=SYNCATIVO.arquiva(remoto, false);
            SYNCATIVO.limpa();
            UI.toast(guardou? 'Guardado no seu histórico ✓' : 'Treino descartado', true);
            UI.refaz();
          }}, SYNCATIVO.temTrabalho(remoto)? 'Encerrar e guardar no histórico' : 'Descartar')]);
      }catch(e){} }, 900);
      return;
    }

    // os dois tem treino DIFERENTE: pergunta, e o nao escolhido vai pro historico
    setTimeout(()=>{ try{
      UI.folha('Dois treinos em andamento',[
        h('div',{class:'f14 mut',style:'padding:2px 2px 12px;line-height:1.7'},
          'Tem um treino aberto aqui e outro no '+ondeR+'. Qual você quer continuar? O outro vai pro seu histórico, nada se perde.'),
        h('div',{class:'card',style:'margin-bottom:10px'},
          h('div',{class:'f12 mut2'},'Neste aparelho'),
          h('div',{class:'b700',style:'font-size:15px'}, resumo(local))),
        h('button',{class:'btn btn-p',style:'margin-bottom:14px',onclick:()=>{
          UI.fechaFolha(); SYNCATIVO.arquiva(remoto); SYNCATIVO.sobeJa(); UI.refaz();
        }},'Continuar este'),
        h('div',{class:'card',style:'margin-bottom:10px'},
          h('div',{class:'f12 mut2'}, ondeR+(qdo?' · '+qdo:'')),
          h('div',{class:'b700',style:'font-size:15px'}, resumo(remoto))),
        h('button',{class:'btn',onclick:()=>{
          UI.fechaFolha(); SYNCATIVO.arquiva(local); SYNCATIVO.assume(remoto);
          UI.pilha=[]; UI.vai('ativo',null,false);
        }}, 'Continuar o do '+ondeR)]);
    }catch(e){} }, 900);
  }
};

/* ---------- reordenar arrastando ---------- */
function dragOrdena(container, aoSoltar){
  let alvo=null, clone=null, sx=0, sy=0, timer=null, ativo=false;
  let slots=null, iOrig=0, iDest=0, altAlvo=0, lastCY=0, cy0=0, scrollY0=0;
  const cards=()=>[...container.children].filter(el=>el.dataset && el.dataset.dix!=null);
  function tmove(ev){
    if(ativo){ ev.preventDefault(); return; }
    if(timer){ const p=(ev.touches&&ev.touches[0])||ev;
      if(Math.abs(p.clientX-sx)<=12 && Math.abs(p.clientY-sy)<=12) ev.preventDefault(); }
  }
  function limpaDoc(){ document.removeEventListener('pointermove', move); document.removeEventListener('touchmove', tmove); document.removeEventListener('pointerup', solta); document.removeEventListener('pointercancel', solta); }
  function inicia(){
    if(!alvo || ativo) return;
    ativo=true; window.__tgDrag=true;
    document.removeEventListener('pointermove', move); document.addEventListener('pointermove', move, {passive:false});
    try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
    const r=alvo.getBoundingClientRect();
    clone=alvo.cloneNode(true);
    clone.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;z-index:9999;pointer-events:none;opacity:.97;margin:0;transform:translate3d(0,0,0) scale(1.02);box-shadow:0 18px 44px rgba(0,0,0,.55);will-change:transform';
    document.body.appendChild(clone);
    alvo.style.opacity='.25';
    cy0=r.top+r.height/2; scrollY0=window.scrollY;
    const ls=cards();
    iOrig=ls.indexOf(alvo); iDest=iOrig;
    altAlvo=r.height+(parseFloat(getComputedStyle(alvo).marginBottom)||0);
    slots=ls.map(c=>{ const rc=c.getBoundingClientRect(); return {el:c, cy:rc.top+rc.height/2}; }); // viewport-relativo
    slots.forEach(s=>{ if(s.el!==alvo){ s.el.style.transition='transform .16s ease'; s.el.style.willChange='transform'; } });
    lastCY=sy; requestAnimationFrame(passo);
  }
  function aplicaShifts(){
    let j=0;
    for(let q=0;q<slots.length;q++){
      if(q===iOrig) continue;
      let ty=0;
      if(iDest<iOrig && j>=iDest && j<iOrig) ty=altAlvo;
      else if(iDest>iOrig && j>=iOrig && j<iDest) ty=-altAlvo;
      slots[q].el.style.transform= ty? ('translate3d(0,'+ty+'px,0)') : '';
      j++;
    }
  }
  function passo(){
    if(!ativo || !clone) return;
    clone.style.transform='translate3d(0,'+(lastCY-sy)+'px,0) scale(1.02)';
    const py=cy0+(lastCY-sy)+(window.scrollY-scrollY0);
    let d=0;
    for(let q=0;q<slots.length;q++){ if(q===iOrig) continue; if(py>slots[q].cy) d++; }
    if(d!==iDest){ iDest=d; aplicaShifts(); }
    if(lastCY<90) scrollBy(0,-12); else if(lastCY>innerHeight-90) scrollBy(0,12);
    requestAnimationFrame(passo);
  }
  function move(ev){
    if(timer && !ativo){
      if(Math.abs(ev.clientX-sx)>12 || Math.abs(ev.clientY-sy)>12){ clearTimeout(timer); timer=null; limpaDoc(); alvo=null; document.body.style.userSelect=''; document.body.style.webkitUserSelect=''; }
      return;
    }
    if(!ativo) return;
    ev.preventDefault();
    lastCY=ev.clientY;
  }
  function solta(){
    clearTimeout(timer); timer=null; limpaDoc();
    const eraAtivo=ativo, sSlots=slots, io=iOrig, id=iDest;
    ativo=false; window.__tgDrag=false;
    if(clone){ clone.remove(); clone=null; }
    if(sSlots) sSlots.forEach(s=>{ s.el.style.transform=''; s.el.style.transition=''; s.el.style.willChange=''; if(s.el) s.el.style.opacity=''; });
    if(alvo) alvo.style.opacity='';
    alvo=null; slots=null;
    document.body.style.userSelect=''; document.body.style.webkitUserSelect='';
    if(!eraAtivo || !sSlots || id===io) return;
    const n=sSlots.length; const ordem=[]; for(let k=0;k<n;k++) ordem.push(k);
    ordem.splice(io,1); ordem.splice(id,0,io);   // dix na nova ordem; callback reordena os dados + refaz
    aoSoltar(ordem);
  }
  function onDown(ev){
    if(ativo) return;
    const cab=ev.target.closest('.drag-cab');
    if(!cab || !container.contains(cab)) return;
    if(ev.target.closest('button,input,select,textarea')) return;
    alvo=cab.closest('[data-dix]'); if(!alvo) return;
    sx=ev.clientX; sy=ev.clientY;
    document.body.style.userSelect='none'; document.body.style.webkitUserSelect='none';
    document.addEventListener('pointermove', move, {passive:true});
    document.addEventListener('touchmove', tmove, {passive:false});
    document.addEventListener('pointerup', solta);
    document.addEventListener('pointercancel', solta);
    timer=setTimeout(inicia, 300);
  }
  // CRÍTICO: um único ouvinte por container (o #main é reusado entre re-renders).
  if(container.__dragPD) container.removeEventListener('pointerdown', container.__dragPD);
  container.__dragPD=onDown;
  container.addEventListener('pointerdown', onDown);
}
function holdReordenar(container, abrir){
  function onDown(ev){
    const cab=ev.target.closest('.drag-cab');
    if(!cab || !container.contains(cab)) return;
    if(ev.target.closest('button,input,select,textarea')) return;
    const sx=ev.clientX, sy=ev.clientY;
    const limpar=()=>{ clearTimeout(t); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',limpar); document.removeEventListener('pointercancel',limpar); };
    const mv=e2=>{ if(Math.abs(e2.clientX-sx)>12 || Math.abs(e2.clientY-sy)>12) limpar(); };
    const t=setTimeout(()=>{ limpar(); try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} abrir(); }, 300);
    document.addEventListener('pointermove',mv,{passive:true});
    document.addEventListener('pointerup',limpar);
    document.addEventListener('pointercancel',limpar);
  }
  if(container.__reoPD) container.removeEventListener('pointerdown', container.__reoPD);
  container.__reoPD=onDown;
  container.addEventListener('pointerdown', onDown);
}
function reordenar(lista, aoCommit){
  const H=60;
  const wrap=h('div',{});
  let rows=[];
  function draw(){
    wrap.innerHTML=''; rows=[];
    lista.forEach((e,i)=>{
      const x=BIB.ex(e.exId);
      const row=h('div',{class:'reo-row'},
        thumbEl(e.exId),
        h('div',{class:'esp b700',style:'font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},x.n),
        h('div',{class:'reo-h'},'≡'));
      row._i=i;
      const alca=row.querySelector('.reo-h');
      alca.addEventListener('pointerdown', ev=>{
        ev.preventDefault();
        const iIni=rows.indexOf(row); let cur=iIni;
        const y0=ev.clientY;
        row.classList.add('reo-drag');
        const move=e2=>{
          const dy=e2.clientY-y0;
          row.style.transform='translateY('+dy+'px)';
          const alvo=Math.max(0, Math.min(rows.length-1, iIni+Math.round(dy/H)));
          if(alvo!==cur){
            rows.forEach((r2,j)=>{
              if(r2===row) return;
              let off=0;
              if(iIni<alvo && j>iIni && j<=alvo) off=-H;
              else if(iIni>alvo && j>=alvo && j<iIni) off=H;
              r2.style.transform=off? 'translateY('+off+'px)':'';
            });
            cur=alvo;
          }
        };
        let solto=false;
        const solta=()=>{
          if(solto) return; solto=true;
          document.removeEventListener('pointermove',move);
          document.removeEventListener('pointerup',solta);
          document.removeEventListener('pointercancel',solta);
          const movido=rows.splice(iIni,1)[0]; rows.splice(cur,0,movido);
          const novo=rows.map(r=>lista[r._i]);
          lista.length=0; novo.forEach(x2=>lista.push(x2));
          if(aoCommit) aoCommit();
          draw();
        };
        document.addEventListener('pointermove',move);
        document.addEventListener('pointerup',solta);
        document.addEventListener('pointercancel',solta);
      });
      rows.push(row); wrap.appendChild(row);
    });
  }
  draw();
  UI.folha('Reordenar exercícios',[
    h('div',{class:'f13 mut',style:'margin-bottom:10px'},'Arraste pelo ≡ para mudar a ordem. Dica: segurar um exercício no treino abre esta tela.'),
    wrap, h('div',{style:'height:8px'}),
    h('button',{class:'btn btn-p',onclick:()=>UI.fechaFolha()},'Concluir')],
    null, ()=>UI.refaz());
}

/* ===== DISTRIBUIÇÃO MUSCULAR DO TREINO ===== */
function distMuscularFolha(t){
  const mapa=gruposDoTreino(t);
  // grupos presentes no treino (mesmo com 0 séries feitas ainda)
  const presentes=new Map();
  (t.ex||[]).forEach(e=>{ const x=BIB.ex(e.exId); [x.g].concat(x.gs||[]).forEach(g=>{ if(!presentes.has(g)) presentes.set(g,0); }); });
  mapa.forEach((v,g)=>presentes.set(g,v));
  const linhas=[...presentes.entries()].sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...linhas.map(l=>l[1]));
  const corpo=h('div',{style:'display:flex;justify-content:center;margin:4px 0 16px'}, corpoSVG(mapa.size?mapa:new Map(), 300));
  const tab=h('div',{});
  tab.appendChild(h('div',{class:'linha f12 mut2',style:'margin-bottom:8px'},
    h('div',{class:'esp'},'Músculo'), h('div',{},'Séries concluídas')));
  linhas.forEach(par=>{
    const g=par[0], n=par[1];
    tab.appendChild(h('div',{class:'linha',style:'padding:7px 0;gap:10px'},
      h('div',{style:'width:118px;flex-shrink:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, GRUPOS[g]||g),
      h('div',{class:'esp',style:'height:14px;background:var(--surf3);border-radius:7px;overflow:hidden'},
        h('div',{style:'height:100%;width:'+Math.round(100*n/max)+'%;background:var(--brand);border-radius:7px;transition:width .3s'})),
      h('div',{class:'b700',style:'width:26px;text-align:right;font-size:14px'}, String(n))));
  });
  UI.folha('Distribuição muscular',[corpo, tab,
    h('div',{class:'f12 mut2',style:'margin-top:14px;line-height:1.5'},'Conta as séries válidas concluídas (aquecimento fica de fora). Os músculos acendem conforme o volume.')]);
}
function gruposDoTreino(t){
  const m=new Map();
  (t.ex||[]).forEach(e=>{
    const feitas=e.series.filter(s=>s.ok&&s.tipo!=='W').length;
    if(!feitas) return;
    const x=BIB.ex(e.exId);
    [x.g].concat(x.gs||[]).forEach(g=>m.set(g,(m.get(g)||0)+feitas));
  });
  return m;
}

function corpoSVG(pesos, larg){
  const max=Math.max(1,...pesos.values());
  const wrap=h('div',{class:'corpoIm',style:'width:'+larg+'px'});
  const cai=()=>{
    if(wrap.__caiu) return; wrap.__caiu=1;
    const alt=corpoBlocos(pesos,larg);
    if(wrap.isConnected) wrap.replaceWith(alt);
    else setTimeout(()=>{ if(wrap.isConnected) wrap.replaceWith(alt); },60);
  };
  const lado=(arq, zonas)=>{
    const cam=[];
    pesos.forEach((v,g)=>{
      (zonas[g]||[]).forEach(z=>{
        const o=Math.min(1, 0.68+0.32*(v/max));
        cam.push('radial-gradient(ellipse '+z[2]+'% '+z[3]+'% at '+z[0]+'% '+z[1]+'%,'
          +'rgba(255,90,0,'+o.toFixed(2)+') 0%,'
          +'rgba(255,90,0,'+o.toFixed(2)+') 42%,'
          +'rgba(255,90,0,'+(o*0.5).toFixed(2)+') 68%,'
          +'rgba(255,90,0,0) 92%)');
      });
    });
    const img=h('img',{src:'grupos/'+arq, alt:'', loading:'lazy'});
    img.onerror=cai;
    const box=h('div',{class:'cLado'}, img);
    if(cam.length) box.appendChild(h('div',{class:'cGlow',
      style:'background-image:'+cam.join(',')
        +';-webkit-mask-image:url(grupos/'+arq+');mask-image:url(grupos/'+arq+')'}));
    return box;
  };
  wrap.append(lado('corpo-frente.webp', ZONAS_F), lado('corpo-costas.webp', ZONAS_C));
  return wrap;
}

/* ---------- data relativa ---------- */
function horaFmt(ts){ try{ return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function dataRelativa(ts){
  const d=new Date(ts), hoje=new Date(); d.setHours(0,0,0,0);
  const h0=new Date(); h0.setHours(0,0,0,0);
  const dias=Math.round((h0-d)/864e5);
  if(dias===0) return 'Hoje';
  if(dias===1) return 'Ontem';
  if(dias<7){ const s=new Date(ts).toLocaleDateString('pt-BR',{weekday:'long'}); return s[0].toUpperCase()+s.slice(1); }
  const mes=new Date(ts).toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
  return mes + (new Date(ts).getFullYear()!==hoje.getFullYear() ? ' de '+new Date(ts).getFullYear() : '');
}

/* ===== HÁBITO: semana, meta, streak e próximo treino ===== */
function inicioSemana(ts){ const d=new Date(ts); d.setHours(0,0,0,0); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.getTime(); }
function treinosNaSemana(wIni){ const fim=wIni+7*864e5; return Object.values(S.treinos).filter(t=>!t.apagado && t.inicio>=wIni && t.inicio<fim).length; }
function calcStreak(meta){
  if(!meta) return 0;
  let streak=0; const w=inicioSemana(agora());
  if(treinosNaSemana(w)>=meta) streak++;
  for(let i=1;i<520;i++){ if(treinosNaSemana(w-i*7*864e5)>=meta) streak++; else break; }
  return streak;
}
function proximaRotina(){
  const rots=Object.values(S.rotinas||{}).filter(r=>r && !r.apagada);
  if(!rots.length) return null;
  // mesma ordem que voce ve na tela de rotinas
  const ordena = l => l.slice().sort((a,b)=>
    ((a.ordem==null?9999:a.ordem)-(b.ordem==null?9999:b.ordem)) || ((a.criado||0)-(b.criado||0)));
  const ts=Object.values(S.treinos)
    .filter(t=>!t.apagado && t.rid && S.rotinas[t.rid] && !S.rotinas[t.rid].apagada)
    .sort((a,b)=>b.inicio-a.inicio);
  if(!ts.length) return ordena(rots)[0];          // nunca treinou: a primeira
  const ultRot = S.rotinas[ts[0].rid];
  const pastaId = ultRot.pasta || '';
  let ciclo = ordena(rots.filter(r=>(r.pasta||'')===pastaId));
  if(ciclo.length<2) ciclo = ordena(rots);
  const i = ciclo.findIndex(r=>r.id===ultRot.id);
  if(i<0) return ciclo[0];
  return ciclo[(i+1) % ciclo.length];             // a proxima da lista, dando a volta
}

  return h('div',{style:'position:relative;width:'+tam+'px;height:'+tam+'px;flex-shrink:0',html:
    '<svg width="'+tam+'" height="'+tam+'"><circle cx="'+tam/2+'" cy="'+tam/2+'" r="'+r+'" fill="none" stroke="var(--surf3)" stroke-width="7"/>'+
    '<circle cx="'+tam/2+'" cy="'+tam/2+'" r="'+r+'" fill="none" stroke="var(--brand)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+tam/2+' '+tam/2+')"/></svg>'});
}

function radarSVG(eixos, A, B){
  const W=260,H=214,cx=W/2,cy=H/2+4,R=72,n=eixos.length;
  const pt=(i,f)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; };
  const poly=v=>v.map((f,i)=>pt(i,Math.max(.05,f)).join(',')).join(' ');
  const claroR=document.body.classList.contains('claro');
  const gr1=claroR?'rgba(16,24,40,.14)':'rgba(255,255,255,.10)', gr2=claroR?'rgba(16,24,40,.10)':'rgba(255,255,255,.08)';
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  [1,.66,.33].forEach(f=>{ s+='<polygon points="'+eixos.map((_,i)=>pt(i,f).join(',')).join(' ')+'" fill="none" stroke="'+gr1+'"/>'; });
  eixos.forEach((_,i)=>{ const p2=pt(i,1); s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p2[0]+'" y2="'+p2[1]+'" stroke="'+gr2+'"/>'; });
  s+='<polygon points="'+poly(B)+'" fill="rgba(76,195,255,.16)" stroke="#4CC3FF" stroke-width="2"/>';
  s+='<polygon points="'+poly(A)+'" fill="rgba(255,90,0,.20)" stroke="#FF5A00" stroke-width="2"/>';
  eixos.forEach((rot,i)=>{ const p2=pt(i,1.26);
    s+='<text x="'+p2[0]+'" y="'+p2[1]+'" font-size="10" font-weight="700" fill="#98A2B3" text-anchor="middle" dominant-baseline="middle">'+esc(rot)+'</text>'; });
  s+='</svg>';
  return h('div',{style:'display:flex;justify-content:center',html:s});
}

function abreRotinaPub(alvo, r){
  const linhas=(r.ex||[]).map(e=>h('div',{class:'med-row'},
    ((e.exId && BIB.porId[e.exId])? thumbEl(e.exId) : thumbNome(e.n||'?')),
    h('div',{class:'esp',style:'min-width:0'},
      h('div',{class:'b700',style:'font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},e.n||'Exercício'),
      h('div',{class:'f12 mut'},(e.ser||3)+' séries × '+(e.reps||'10')))));
  UI.folha(r.titulo, [].concat(linhas, [h('div',{style:'height:10px'}),
    h('button',{class:'btn btn-p',onclick:async function(){
      this.disabled=true; this.textContent='Copiando\u2026';
      // acervo do dono: e de la que vem foto e grupos secundarios do custom
      let acervo={}; try{ acervo = await NET.get('/exsPub/'+alvo) || {}; }catch(e){}
      const acervoPorNome={};
      Object.values(acervo).forEach(x=>{ if(x && x.n) acervoPorNome[BIB.norm(x.n)]=x; });
      const nova={ id:uid(), titulo:r.titulo, pasta:'', criado:agora(), atualizado:agora(),
        ex:(r.ex||[]).map(e=>{
          let exId = (e.exId && BIB.porId[e.exId])? e.exId : null;
          // exercicio criado pela pessoa: NUNCA casa por nome parecido, senao
          // o app troca em silencio por outro exercicio da biblioteca
          const ehCustom = e.cst===1 || (typeof e.exId==='string' && e.exId.indexOf('custom__')===0);
          if(!exId && !ehCustom){ const x=exPorNome(e.n); if(x) exId=x.id; }
          if(!exId && ehCustom){
            const alvo=(e.n||'').trim().toLowerCase();
            const ja=Object.values(S.custom||{}).find(c=>c && !c.oc && (c.n||'').trim().toLowerCase()===alvo);
            if(ja) exId=ja.id;                       // ja copiou antes, nao duplica
          }
          if(!exId){
            exId='custom__'+uid();
            const fonte = acervo[e.exId] || acervoPorNome[BIB.norm(e.n||'')] || null;
            const ent={id:exId, n:e.n||'Exercício', g:e.g||'corpo-inteiro', e:e.e||'outro', t:e.t||'peso_reps', custom:true, atualizado:agora()};
            if(e.exId) ent.origem=e.exId;
            if(fonte && fonte.foto) ent.foto=fonte.foto;
            if(fonte && fonte.gs) ent.gs=fonte.gs;
            S.custom[exId]=ent; salva('custom'); NET.agenda('custom/'+exId, ent);
            if(!ent.ocultoPub) EXSPUB.publica(ent);
            BIB.lista.push(ent); BIB.indexa();
          }
          const molde = Array.isArray(e.sr) && e.sr.length
            ? e.sr.map(sv=>({tipo:sv.t||'N', kg:'', reps:String(sv.r==null?(e.reps||'10'):sv.r)}))
            : Array.from({length:e.ser||3},()=>({tipo:'N',kg:'',reps:String(e.reps||'10')}));
          return { exId, descanso:e.descanso||S.cfg.descanso||90, notas:e.notas||'',
            series:molde };
        }) };
      S.rotinas[nova.id]=nova; salva('rotinas'); NET.agenda('rotinas/'+nova.id, nova); ROTPUB.envia(nova);
      UI.fechaFolha(); UI.toast('Rotina copiada para as suas ✓', true);
      UI.pilha=[]; UI.vai('treino',null,false);
    }},'Copiar para minhas rotinas')]));
}

TELAS.comparaPerfil = function({uid:alvo}){
  UI.topo(UI.btVoltar(), h('div',{class:'topo-tit',style:'font-size:19px'},'Comparação'));
  const m=$('#main'); m.innerHTML='';
  m.appendChild(h('div',{class:'periodo'}, h('span',{class:'chip on'},'Últimos 30 dias')));
  m.appendChild(vsAvatars(alvo));
  const corte=agora()-30*864e5;
  const meusT=Object.values(S.treinos).filter(t=>!t.apagado && t.inicio>=corte);
  const deleT=(FEED.amigos[alvo]||[]).filter(r=>r.inicio>=corte);
  const gm=new Map(); meusT.forEach(t=>gruposDoTreino(t).forEach((v,g)=>gm.set(g,(gm.get(g)||0)+v)));
  const gd=new Map(); deleT.forEach(r=>(r.ex||[]).forEach(e=>{
    const n=(e.sr||[]).filter(s=>s.t!=='W').length || e.s || 0;
    if(e.g && n) gd.set(e.g,(gd.get(e.g)||0)+n);
  }));
  const uniao=[...new Set([...gm.keys(),...gd.keys()])]
    .sort((a,b)=>((gm.get(b)||0)+(gd.get(b)||0))-((gm.get(a)||0)+(gd.get(a)||0))).slice(0,6);
  if(uniao.length>=3){
    const tm=[...gm.values()].reduce((a,b)=>a+b,0)||1, td=[...gd.values()].reduce((a,b)=>a+b,0)||1;
    const A=uniao.map(g=>(gm.get(g)||0)/tm), B=uniao.map(g=>(gd.get(g)||0)/td);
    const mx=Math.max.apply(null, A.concat(B,[0.01]));
    m.appendChild(h('div',{class:'card'},
      h('div',{class:'secao',style:'margin:0 0 8px'},'Divisão muscular'),
      radarSVG(uniao.map(g=>GRUPOS[g]||g), A.map(v=>v/mx), B.map(v=>v/mx)),
      h('div',{style:'display:flex;justify-content:center;gap:16px;margin-top:6px'},
        h('span',{class:'f12 b700'},h('span',{style:'display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--brand);margin-right:6px'}),'Você'),
        h('span',{class:'f12 b700'},h('span',{style:'display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--azul);margin-right:6px'}),'Amigo'))));
  }
  const soma=(l,f)=>l.reduce((a,x2)=>a+f(x2),0);
  m.appendChild(h('div',{class:'card'},
    h('div',{class:'secao',style:'margin:0 0 10px'},'Estatísticas'),
    barraCmp('Treinamentos', meusT.length, deleT.length, v=>String(v)),
    barraCmp('Tempo de treinamento', soma(meusT,t=>(t.fim-t.inicio)), soma(deleT,r=>(r.fim-r.inicio)), v=>(Math.round(v/36e5*10)/10)+'h'),
    barraCmp('Volume total', soma(meusT,t=>t.volume||0), soma(deleT,r=>r.volume||0), v=>CORE.fmtKg(v)+' kg')));
  const dele=amigoExercicios(alvo);
  const meusNomes=new Map();
  Object.values(S.treinos).forEach(t=>{ if(t.apagado) return;
    (t.ex||[]).forEach(e=>{ const x=BIB.ex(e.exId); meusNomes.set(BIB.norm(x.n), x); }); });
  const comuns=Object.keys(dele).filter(ch=>meusNomes.has(ch))
    .sort((a,b)=>dele[b].ultima-dele[a].ultima).slice(0,20);
  if(comuns.length){
    const card=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 6px'},'Exercícios em comum'));
    comuns.forEach(ch=>{ const x=meusNomes.get(ch);
      card.append(h('button',{class:'med-row',style:'width:100%;text-align:left',onclick:()=>UI.vai('comparaEx',{uid:alvo, nome:x.n})},
        thumbEl(x.id),

          h('div',{class:'b700',style:'font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},x.n),
          h('div',{class:'f12 mut'},GRUPOS[x.g]||x.g)),
        h('span',{class:'mut2',html:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'})));
    });
    m.appendChild(card);
  } else m.appendChild(h('div',{class:'vazio'},'Sem exercícios em comum ainda. Sigam treinando!'));
};

  m.appendChild(h('div',{class:'linha',style:'margin:16px 0 8px'},
    h('div',{class:'secao',style:'margin:0'},'Exercícios'), h('div',{class:'esp'}),
    h('button',{class:'btn btn-mini',onclick:()=>ROT.editor(rid)},'Editar rotina')));

    const x=BIB.ex(e.exId);

            const id='fp_'+uid();

      }},'＋ Foto')),
    h('div',{class:'f13 mut',style:'margin-bottom:10px'},'Seu antes e depois, na linha do tempo. Só você vê.'));
  const grade=h('div',{class:'fpg'});

  m.appendChild(fpgCard);
  const desenhaFotos=()=>{

  const card2=h('div',{class:'card'});
  Object.entries(MED_CAMPOS).forEach(([campo,[rot,un]])=>{

      h('div',{class:'mut2',html:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'})));

const CAL={y:new Date().getFullYear(), m:new Date().getMonth()};
TELAS.calendario = function(){
  UI.topo(UI.btVoltar(), h('div',{class:'topo-tit',style:'font-size:20px'},'Calendário'));
  const m=$('#main'); m.innerHTML='';
  const ts=Object.values(S.treinos).filter(t=>!t.apagado);
  const porDia={};
  ts.forEach(t=>{ const d=new Date(t.inicio); const k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); (porDia[k]=porDia[k]||[]).push(t); });
  const nomeMes=new Date(CAL.y,CAL.m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  m.appendChild(h('div',{class:'linha',style:'margin-bottom:10px'},
    h('button',{class:'btn btn-mini',style:'width:42px',onclick:()=>{ CAL.m--; if(CAL.m<0){CAL.m=11;CAL.y--;} UI.refaz(); }},'‹'),
    h('div',{class:'b800',style:'flex:1;text-align:center;font-size:16px'},nomeMes[0].toUpperCase()+nomeMes.slice(1)),
    h('button',{class:'btn btn-mini',style:'width:42px',onclick:()=>{ CAL.m++; if(CAL.m>11){CAL.m=0;CAL.y++;} UI.refaz(); }},'›')));
  const grid=h('div',{class:'cal-grid'});
  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(s=>grid.appendChild(h('div',{class:'cal-sem'},s)));
  const prim=new Date(CAL.y,CAL.m,1);
  const off=(prim.getDay()+6)%7;
  const nDias=new Date(CAL.y,CAL.m+1,0).getDate();
  const hj=new Date();
  for(let i=0;i<off;i++) grid.appendChild(h('div',{class:'cal-dia fora'}));
  for(let d=1;d<=nDias;d++){
    const k=CAL.y+'-'+CAL.m+'-'+d;
    const lista=porDia[k]||[];
    const el=h('div',{class:'cal-dia'+(lista.length?' tem':'')+((hj.getDate()===d&&hj.getMonth()===CAL.m&&hj.getFullYear()===CAL.y)?' hoje':'')}, String(d));
    if(lista.length){
      el.appendChild(h('div',{class:'pontos'},...lista.slice(0,3).map(()=>h('div',{class:'pt'}))));
      el.addEventListener('click',()=>{
        if(lista.length===1) UI.vai('treinoDet',{id:lista[0].id});
        else UI.folha(new Date(CAL.y,CAL.m,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long'}),
          lista.map(t=>h('button',{class:'menu-op',onclick:()=>{UI.fechaFolha();UI.vai('treinoDet',{id:t.id});}},t.titulo+' · '+CORE.fmtKg(t.volume)+' kg')));
      });
    }
    grid.appendChild(el);
  }
  m.appendChild(h('div',{class:'card'},grid));
  const noMes=ts.filter(t=>{ const d=new Date(t.inicio); return d.getFullYear()===CAL.y&&d.getMonth()===CAL.m; });
  m.appendChild(h('div',{class:'card'},h('div',{class:'stats3'},
    h('div',{},h('div',{class:'k'},'Treinos no mês'),h('div',{class:'v'},noMes.length)),
    h('div',{},h('div',{class:'k'},'Volume'),h('div',{class:'v'},CORE.fmtKg(noMes.reduce((a,t)=>a+(t.volume||0),0))+' kg')),
    h('div',{},h('div',{class:'k'},'Tempo'),h('div',{class:'v'},CORE.fmtDur(noMes.reduce((a,t)=>a+(t.fim-t.inicio)/1000,0)))))));
};

/* ---------- ESTATÍSTICAS ---------- */
TELAS.stats = function(){
  UI.topo(UI.btVoltar(), h('div',{class:'topo-tit',style:'font-size:20px'},'Estatísticas'));
  const m=$('#main'); m.innerHTML='';
  const ts=Object.values(S.treinos).filter(t=>!t.apagado);

  // mês atual vs mesmo período do mês anterior
  (function(){
    const ag=new Date(); const dia=ag.getDate();
    const iniAtu=new Date(ag.getFullYear(), ag.getMonth(), 1).getTime();
    const iniAnt=new Date(ag.getFullYear(), ag.getMonth()-1, 1).getTime();
    const fimAntPeriodo=new Date(ag.getFullYear(), ag.getMonth()-1, dia, 23,59,59).getTime();
    const atu=ts.filter(t=>t.inicio>=iniAtu);
    const ant=ts.filter(t=>t.inicio>=iniAnt && t.inicio<=Math.min(fimAntPeriodo, iniAtu-1));
    if(!atu.length && !ant.length) return;
    const soma=(arr,f)=>arr.reduce((a,t)=>a+(f(t)||0),0);
    const d=(a,b)=>{ const dd=a-b; if(!b) return a?'novo':''; const p=Math.round(100*dd/b); return (dd>=0?'▲ ':'▼ ')+Math.abs(p)+'%'; };
    const cor=(a,b)=>a>=b?'var(--ok, #7BE495)':'var(--tx3)';
    const item=(rot,va,vb,fmt)=>h('div',{},h('div',{class:'k'},rot),
      h('div',{class:'v'},fmt(va)), h('div',{class:'f11',style:'margin-top:2px;color:'+cor(va,vb)}, d(va,vb)));
    const c=h('div',{class:'card'},
      h('div',{class:'secao',style:'margin:0 0 4px'},'Este mês vs anterior'),
      h('div',{class:'f12 mut2',style:'margin-bottom:10px'},'Comparando os primeiros '+dia+' dias de cada mês.'),
      h('div',{class:'stats3'},
        item('Treinos', atu.length, ant.length, v=>String(v)),
        item('Volume', soma(atu,t=>t.volume), soma(ant,t=>t.volume), v=>CORE.fmtKg(v)+' kg'),
        item('Recordes', soma(atu,t=>t.recordes), soma(ant,t=>t.recordes), v=>String(v))));
    m.appendChild(c);
  })();

  // última semana: um marcador por dia + mapa de calor dos grupos
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const dias=[]; for(let i=6;i>=0;i--){ const d=new Date(hoje.getTime()-i*864e5); dias.push(d); }
  const semanaCard=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 10px'},'Última semana'));
  const dotsRow=h('div',{style:'display:flex;justify-content:space-between;gap:6px'});
  const g7=new Map();
  dias.forEach(d=>{
    const fim=d.getTime()+864e5;
    const doDia=ts.filter(t=>t.inicio>=d.getTime() && t.inicio<fim);
    doDia.forEach(t=>gruposDoTreino(t).forEach((v,g)=>g7.set(g,(g7.get(g)||0)+v)));
    const n=doDia.length;
    const ini=d.toLocaleDateString('pt-BR',{weekday:'short'})[0].toUpperCase();
    dotsRow.append(h('div',{style:'text-align:center;flex:1'},
      h('div',{style:'width:34px;height:34px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;'+
        (n? 'background:var(--brand);color:#fff':'background:var(--surf2);color:var(--tx3)')}, n? String(n):'·'),
      h('div',{class:'f11 mut2',style:'margin-top:4px'},ini)));
  });
  semanaCard.append(dotsRow);
  if(g7.size) semanaCard.append(h('div',{style:'display:flex;justify-content:center;margin-top:14px'}, corpoSVG(g7, 168)));
  m.appendChild(semanaCard);

  const tempoTotal=ts.reduce((a,t)=>a+(t.fim-t.inicio)/1000,0);
  m.appendChild(h('div',{class:'card'},
    h('div',{class:'stats3',style:'margin-bottom:12px'},
      h('div',{},h('div',{class:'k'},'Treinamentos'),h('div',{class:'v'},ts.length)),
      h('div',{},h('div',{class:'k'},'Tempo total'),h('div',{class:'v'},Math.round(tempoTotal/3600)+' h')),
      h('div',{},h('div',{class:'k'},'Recordes'),h('div',{class:'v'},ts.reduce((a,t)=>a+(t.recordes||0),0)))),
    h('div',{class:'stats3'},
      h('div',{},h('div',{class:'k'},'Volume total'),h('div',{class:'v'},CORE.fmtKg(ts.reduce((a,t)=>a+(t.volume||0),0))+' kg')),
      h('div',{},h('div',{class:'k'},'Séries'),h('div',{class:'v'},ts.reduce((a,t)=>a+(t.series||0),0))),
      h('div',{},h('div',{class:'k'},'Exercícios'),h('div',{class:'v'},new Set(ts.flatMap(t=>(t.ex||[]).map(e=>e.exId))).size)))));

  const corte=agora()-28*864e5;
  const porGrupo={};
  ts.filter(t=>t.inicio>=corte).forEach(t=>(t.ex||[]).forEach(e=>{
    const feitas=e.series.filter(s=>s.ok&&s.tipo!=='W').length; if(!feitas) return;
    const g=BIB.ex(e.exId).g;
    porGrupo[g]=(porGrupo[g]||0)+feitas;
  }));
  const ordenado=Object.entries(porGrupo).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const card=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 10px'},'Séries por grupo · últimas 4 semanas'));
  if(ordenado.length){
    const max=ordenado[0][1];
    ordenado.forEach(([g,n])=>card.append(h('div',{class:'hbar'},
      h('div',{class:'rot'},GRUPOS[g]||g),
      h('div',{class:'trilho'},h('div',{class:'fill',style:'width:'+Math.round(100*n/max)+'%'})),
      h('div',{class:'val'},n))));
  } else card.append(h('div',{class:'f13 mut'},'Sem séries nas últimas 4 semanas.'));
  m.appendChild(card);

  const card2=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 8px'},'Frequência · 12 semanas'));
  const cv=h('canvas',{class:'graf'}); card2.append(cv); m.appendChild(card2);
  const dados=CORE.agregaSemanas(Object.fromEntries(ts.map(t=>[t.id,t])), 12, agora());
  requestAnimationFrame(()=>grafBarras(cv,dados.map((d,i)=>({v:d.qtd, rot:(i%2===0)?new Date(d.w).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''})),v=>v+'x'));

  const chev='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';
  m.appendChild(h('div',{class:'card'},
    h('div',{class:'secao',style:'margin:0 0 4px'},'Estatísticas avançadas'),
    h('button',{class:'menu-op',onclick:()=>UI.vai('mapaSemanal')},'Mapa de calor semanal',h('span',{class:'esp'}),h('span',{class:'mut2',html:chev})),
    h('button',{class:'menu-op',onclick:()=>UI.vai('topExercicios')},'Exercícios principais',h('span',{class:'esp'}),h('span',{class:'mut2',html:chev})),
    h('button',{class:'menu-op',onclick:()=>UI.vai('relatorioMensal')},'Relatório mensal',h('span',{class:'esp'}),h('span',{class:'mut2',html:chev}))));
};

/* ---------- exercícios principais ---------- */
TELAS.topExercicios = function(){
  UI.topo(UI.btVoltar(), h('div',{class:'topo-tit',style:'font-size:19px'},'Exercícios principais'));
  const m=$('#main'); m.innerHTML='';
  let periodo=92;
  const per=h('div',{class:'periodo'});
  const lista=h('div',{});
  const desenha=()=>{
    lista.innerHTML='';
    const corte=periodo? agora()-periodo*864e5 : 0;
    const ts=Object.values(S.treinos).filter(t=>!t.apagado && t.inicio>=corte);
    const cont={};
    ts.forEach(t=>(t.ex||[]).forEach(e=>{
      const c=cont[e.exId]=cont[e.exId]||{t:0,s:0};
      c.t++; c.s+=e.series.filter(s=>s.ok&&s.tipo!=='W').length;
    }));
    const ord=Object.entries(cont).sort((a,b)=>b[1].t-a[1].t || b[1].s-a[1].s).slice(0,15);
    if(!ord.length){ lista.append(h('div',{class:'vazio'},'Sem treinos no período.')); return; }
    const card=h('div',{class:'card'});
    ord.forEach(([id,c],i)=>{
      const x=BIB.ex(id);
      card.append(h('button',{class:'med-row',style:'width:100%;text-align:left',onclick:()=>UI.vai('exercicio',{id})},
        h('div',{class:'b800 mut2',style:'width:22px;font-size:13px;flex-shrink:0'},String(i+1)),
        thumbEl(id),
        h('div',{class:'esp',style:'min-width:0'},
          h('div',{class:'b700',style:'font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},x.n),
          h('div',{class:'f12 mut'},c.t+' '+(c.t>1?'vezes':'vez')+' · '+c.s+' séries'))));
    });
    lista.append(card);

/* ===================================================================
   MODERACAO, TERMOS E CONTA (v11.4)
   Exigencias de loja: filtro de conteudo, denuncia, bloqueio,
   termos com aceite e exclusao de conta pelo proprio app.
   =================================================================== */
const TERMOS_V = 1;

/* --- filtro de linguagem: barra o comentario ANTES de publicar --- */
const FILTRO = {
  termos:['viado','viadinho','bicha','traveco','macaco','macaca','preto imundo','nazi',
          'puta','putinha','vagabunda','vadia','piranha','corno','arrombado','fdp',
          'buceta','xoxota','pentelho','caralho','porra','punheta','pau no cu','cu de',
          'retardado','mongoloide','aleijado','gordo nojento','gorda nojenta',
          'se mata','vai morrer','te mato','morre logo','suicida'],
  normaliza(t){
    return String(t||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[0@]/g,'o').replace(/[1!|]/g,'i').replace(/[3]/g,'e')
      .replace(/[4]/g,'a').replace(/[5$]/g,'s').replace(/[7]/g,'t')
      .replace(/(.)\1+/g,'$1')
      .replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim();
  },
  passa(txt){
    const n=FILTRO.normaliza(txt);
    const colado=n.replace(/ /g,'');
    return !FILTRO.termos.some(t=>{
      const tn=FILTRO.normaliza(t);
      return tn.indexOf(' ')>=0 ? n.indexOf(tn)>=0 : colado.indexOf(tn)>=0;
    });
  }
};

/* --- atualizar a ficha com o que foi feito hoje (estilo Hevy) --- */
const ROTFIM = {
  diff(rot, t){
    const antes=(rot.ex||[]).map(e=>({id:e.exId, n:(e.series||[]).length}));
    const dep=(t.ex||[]).map(e=>({id:e.exId, n:(e.series||[]).length}));
    const idsA=antes.map(x=>x.id), idsD=dep.map(x=>x.id);
    const novos=dep.filter(x=>idsA.indexOf(x.id)<0);
    const fora=antes.filter(x=>idsD.indexOf(x.id)<0);
    const series=dep.filter(d=>{ const a=antes.find(x=>x.id===d.id); return a && a.n!==d.n; });
    const ordem = idsA.length===idsD.length && idsA.some((v,i)=>v!==idsD[i]);
    return {novos, fora, series, ordem, mudou:!!(novos.length||fora.length||series.length||ordem)};
  },
  aplica(rot, t){
    rot.ex=(t.ex||[]).map(e=>{
      const velho=(rot.ex||[]).find(x=>x.exId===e.exId)||{};
      return { exId:e.exId, descanso:e.descanso||velho.descanso||S.cfg.descanso||90,
        notas:e.notas||velho.notas||'', ss:e.ss||null,
        series:(e.series||[]).map(s=>({tipo:s.tipo||'N', kg:(s.kg==null?'':s.kg), reps:(s.reps==null?'':String(s.reps))})) };
    });
    rot.atualizado=agora();
    S.rotinas[rot.id]=rot; salva('rotinas'); NET.agenda('rotinas/'+rot.id, rot);
    try{ ROTPUB.envia(rot); }catch(e){}
  },
  oferece(t){
    const rot = t.rid && S.rotinas[t.rid];
    if(!rot) return;
    const d=ROTFIM.diff(rot, t);
    if(!d.mudou) return;
    const nome=x=>BIB.ex(x.id).n;
    const linhas=[];
    d.novos.forEach(x=>linhas.push(h('div',{class:'f13',style:'color:var(--ok);padding:3px 0'},'+ '+nome(x)+' (novo)')));
    d.fora.forEach(x=>linhas.push(h('div',{class:'f13',style:'color:var(--tx3);padding:3px 0'},'\u2212 '+nome(x)+' (n\u00e3o fez)')));
    d.series.forEach(x=>{ const a=(rot.ex||[]).find(e=>e.exId===x.id);
      linhas.push(h('div',{class:'f13 mut',style:'padding:3px 0'},'\u00b7 '+nome(x)+': '+((a.series||[]).length)+' \u2192 '+x.n+' s\u00e9ries')); });
    if(d.ordem && !linhas.length) linhas.push(h('div',{class:'f13 mut',style:'padding:3px 0'},'\u00b7 Ordem dos exerc\u00edcios mudou'));
    UI.folha('Atualizar a ficha?',[
      h('div',{class:'f14 mut',style:'padding:2px 2px 12px;line-height:1.7'},
        'Voc\u00ea fez o treino diferente da ficha "'+rot.titulo+'". Quer salvar essas mudan\u00e7as nela?'),
      h('div',{style:'max-height:34vh;overflow-y:auto;margin-bottom:14px'}, ...linhas),
      h('button',{class:'btn btn-p',style:'margin-bottom:8px',onclick:()=>{
        ROTFIM.aplica(rot, t); UI.fechaFolha(); UI.toast('Ficha atualizada \u2713', true); }},'Atualizar ficha'),
      h('button',{class:'btn',onclick:()=>UI.fechaFolha()},'Manter como estava')]);
  }
};

const PUSH = {
  _m:null,
  suportado(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  instalado(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; },
  iphone(){ return /iPhone|iPad|iPod/.test(navigator.userAgent); },
  async sdk(){
    if(PUSH._m) return PUSH._m;
    await carregaScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await carregaScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(FB.cfg);
    PUSH._m = firebase.messaging();
    return PUSH._m;
  },
  async ativa(){
    if(!S.auth || !S.perfil?.user){ UI.toast('Crie sua conta com e-mail primeiro'); return; }
    if(!PUSH.suportado()){ UI.toast(PUSH.iphone()? 'Atualize o iOS (16.4+) e abra pelo app instalado' : 'Este navegador não suporta notificações'); return; }
    if(PUSH.iphone() && !PUSH.instalado()){
      UI.folha('Quase lá',[h('div',{class:'f14 mut',style:'padding:4px 2px 14px;line-height:1.7'},
        'No iPhone, as notificações só funcionam pelo app instalado. Toque em Compartilhar no Safari → "Adicionar à Tela de Início", abra o ForgeX por lá e ative nas configurações.')]);
      return;
    }
    try{
      const perm = await Notification.requestPermission();
      if(perm!=='granted'){ UI.toast('Permissão de notificação negada'); return; }
      const m = await PUSH.sdk();
      const reg = await navigator.serviceWorker.ready;
      const tok = await m.getToken({vapidKey:FB.vapid, serviceWorkerRegistration:reg});
      if(!tok){ UI.toast('Não consegui registrar. Tenta de novo em instantes.'); return; }
      S.cfg.push=1; S.cfg.pushTok=tok; salva('cfg');
      await NET.putD('/usuarios/'+S.auth.uid+'/fcm/'+tok, {ts:agora(), ua:(navigator.userAgent||'').slice(0,80)});
      UI.toast('Notificações ativadas ✓', true); UI.refaz();
    }catch(e){ if(DEBUG)console.log('push', e); UI.toast('Falhou ao ativar. Tenta de novo.'); }
  },
  async desativa(){
    const tok=S.cfg.pushTok;
    try{ if(tok && S.auth) await NET.putD('/usuarios/'+S.auth.uid+'/fcm/'+tok, null); }catch(e){}
    try{ const m=await PUSH.sdk(); await m.deleteToken(); }catch(e){}
    S.cfg.push=0; delete S.cfg.pushTok; salva('cfg');
    UI.toast('Notificações desativadas', true); UI.refaz();
  },
  async renova(){
    if(!S.cfg.push || !S.auth || !PUSH.suportado()) return;
    if(Notification.permission!=='granted'){ S.cfg.push=0; delete S.cfg.pushTok; salva('cfg'); return; }
    try{
      const m=await PUSH.sdk();
      const reg=await navigator.serviceWorker.ready;
      const tok=await m.getToken({vapidKey:FB.vapid, serviceWorkerRegistration:reg});
      if(tok && tok!==S.cfg.pushTok){
        if(S.cfg.pushTok) NET.putD('/usuarios/'+S.auth.uid+'/fcm/'+S.cfg.pushTok, null).catch(()=>{});
        S.cfg.pushTok=tok; salva('cfg');
        NET.putD('/usuarios/'+S.auth.uid+'/fcm/'+tok, {ts:agora(), ua:(navigator.userAgent||'').slice(0,80)});
      }
    }catch(e){}
  }
};
async function autocuraNuvem(){
  // roda em silêncio no boot: detecta perda de dados públicos e republica sem pedir nada ao usuário
  if(!S.auth || !S.perfil?.user) return;
  const meusTreinos = Object.values(S.treinos||{}).filter(t=>!t.apagado);
  if(!meusTreinos.length) return;                 // nada local pra republicar
  if(S.cfg.autocuraTs && (agora()-S.cfg.autocuraTs) < 6*3600e3) return;  // no máx. 1x a cada 6h
  try{
    // checagens baratas na nuvem
    const [perfilPub, feedPub, unamePub] = await Promise.all([
      NET.get('/perfis/'+S.auth.uid).catch(()=>null),
      NET.get('/feed/'+S.auth.uid).catch(()=>null),
      NET.get('/usernames/'+S.perfil.user).catch(()=>null)
    ]);
    const feedVazio = !feedPub || Object.keys(feedPub).length===0;
    const perfilVazio = !perfilPub || !perfilPub.user;
    const unameVazio = !unamePub;
    // se qualquer pilar público sumiu enquanto tenho dados locais -> autocura
    if(feedVazio || perfilVazio || unameVazio){
      const n = await RESTAURA.tudo(null, {silencioso:true});
      S.cfg.autocuraTs = agora(); salva('cfg');
      if(n>0 && typeof UI!=='undefined' && UI.toast) {
        // aviso discreto e não-intrusivo (o usuário não precisou fazer nada)
        setTimeout(()=>UI.toast('Dados sincronizados com a nuvem', true), 400);
      }
    }
  }catch(e){}
}

// "custom__hv-remada-halter" -> "Remada halter"
function recuperaExsOrfaos(){
  if(S.cfg.exOrfaos1) return 0;
  try{
    const meus=new Set();
    Object.entries(S.custom||{}).forEach(function(par){
      meus.add(par[0]); if(par[1] && par[1].id) meus.add(par[1].id);
    });
    const falta={};
    Object.values(S.treinos||{}).forEach(tr=>{
      if(!tr || tr.apagado) return;
      (tr.ex||[]).forEach(e=>{
        const i=e && e.exId;
        if(i && !BIB.porId[i] && !meus.has(i)) falta[i]=(falta[i]||0)+1;
      });
    });
    const ids=Object.keys(falta);
    if(!ids.length){ S.cfg.exOrfaos1=1; salva('cfg'); return 0; }

    const GRP=[[/panturrilh/,'panturrilha'],[/gluteo|coice|pelvica/,'gluteos'],
      [/abdomin|abdome|prancha|obliquo|tocar nos pes/,'abdomen'],[/lombar/,'lombar'],
      [/triceps|tricipes/,'triceps'],[/rosca|biceps|curl/,'biceps'],
      [/antebraco|punho/,'antebraco'],[/encolhimento|trapezio/,'trapezio'],
      [/remada|puxada|pulldown|barra fixa|pullover|tracao|dorsal|graviton/,'costas'],
      [/supino|crucifixo|voador|peitoral|crossover|cross over|peck/,'peito'],
      [/elevacao lateral|elevacao frontal|desenvolvimento|ombro|abertura|deltoid/,'ombros'],
      [/agachamento|leg press|extensora|flexora|afundo|stiff|terra|avanco|bulgaro|step up|adutora|abdutora/,'pernas'],
      [/corrida|esteira|bike|ciclismo|eliptico|escada|remo|pular corda/,'cardio']];
    const EQP=[[/halter/,'halteres'],[/barra w|barra ez/,'barra-w'],[/barra|smith/,'barra'],
      [/corda|cabo|polia|cross/,'cabo'],[/maquina|articulad|alavanca|multiflight|graviton/,'maquina'],
      [/elastic/,'elastico'],[/kettlebell/,'kettlebell'],[/anilha/,'anilha']];

    let n=0; const nomes=[];
    ids.forEach(id=>{
      const cru=String(id).replace(/^custom__(hv-)?/,'').replace(/-/g,' ').trim();
      if(!cru) return;
      const nome=cru.charAt(0).toUpperCase()+cru.slice(1);
      const bn=BIB.norm(nome);
      let g='corpo-inteiro', eq='outro';
      for(const par of GRP){ if(par[0].test(bn)){ g=par[1]; break; } }
      for(const par of EQP){ if(par[0].test(bn)){ eq=par[1]; break; } }
      const ent={id:id, n:nome, g:g, e:eq, t:(g==='cardio'?'tempo':'peso_reps'),
                 custom:true, recuperado:1, atualizado:agora()};
      S.custom[id]=ent; NET.agenda('custom/'+id, ent);
      BIB.lista.push(ent); nomes.push(nome); n++;
    });
    if(!n){ S.cfg.exOrfaos1=1; salva('cfg'); return 0; }
    salva('custom'); BIB.indexa();
    S.cfg.exOrfaos1=1; salva('cfg'); NET.agenda('app/cfg', S.cfg);

    setTimeout(function(){ try{
      UI.folha('Exerc\u00edcios recuperados',[
        h('div',{class:'f14 mut',style:'padding:2px 2px 12px;line-height:1.7'},
          n+' exerc\u00edcio'+(n>1?'s':'')+' do seu hist\u00f3rico apareciam como \u201cExerc\u00edcio removido\u201d. Recuperamos '+(n>1?'os nomes deles':'o nome dele')+' e '+(n>1?'eles voltaram':'ele voltou')+' pro seu acervo.'),
        h('div',{class:'f13 mut2',style:'padding:0 2px 12px;line-height:1.6'},
          nomes.slice(0,10).join(', ')+(nomes.length>10? ' e mais '+(nomes.length-10) : '')),
        h('div',{class:'f13 mut2',style:'padding:0 2px 14px;line-height:1.6'},
          'O grupo muscular foi deduzido do nome. Confira no seletor de exerc\u00edcios, filtro Meus, e ajuste o que estiver errado.'),
        h('button',{class:'btn btn-p',onclick:function(){ UI.fechaFolha(); }},'Entendi')]);
    }catch(e){} }, 1800);
    return n;
  }catch(e){ if(DEBUG) console.log('orfaos', e); return 0; }
}

    Object.keys(S.prs||{}).forEach(ex=>{
      const velho=S.prs[ex]||{};
      if(!vistos.has(ex)){ final[ex]=velho; return; }   // sem historico: nao toca
      const novo=Object.assign({}, reais[ex]||{});
      ['kg','vol','rm','reps'].forEach(tp=>{
        const a = velho[tp] ? velho[tp].v : 0;
        const b = novo[tp]  ? novo[tp].v  : 0;
        if(a > b){ corrigidas++; if(tocados.indexOf(ex)<0) tocados.push(ex); }
        else if(velho[tp] && !novo[tp]) novo[tp]=velho[tp];
      });
      final[ex]=novo;
    });
    Object.keys(reais).forEach(ex=>{ if(!final[ex]) final[ex]=reais[ex]; });
    if(!corrigidas){ S.cfg.prFantasma2=1; salva('cfg'); NET.agenda('app/cfg', S.cfg); return 0; }

    Object.entries(resets).forEach(([ex,r])=>{ final[ex]=final[ex]||{}; final[ex].resetEm=r; });
    S.prs = final; salva('prs');
    // 1 escrita por exercicio, nao 4: o no inteiro de uma vez
    tocados.forEach(ex=>NET.agenda('prs/'+ex, S.prs[ex]||null));
    S.cfg.prFantasma2=1; salva('cfg'); NET.agenda('app/cfg', S.cfg);

    setTimeout(()=>{ try{
      UI.folha('Recordes corrigidos',[
        h('div',{class:'f14 mut',style:'padding:2px 2px 12px;line-height:1.7'},
          'Uma falha antiga deixava marca de recorde gravada quando um exerc\u00edcio era removido do treino ou o treino era descartado. Isso travava recordes novos.'),
        h('div',{class:'f14',style:'padding:2px 2px 12px;line-height:1.7'},
          corrigidas+' marca'+(corrigidas>1?'s':'')+' foi ajustada em '+tocados.length+' exerc\u00edcio'+(tocados.length>1?'s':'')+
          ', com base nos treinos que voc\u00ea realmente salvou. Seu hist\u00f3rico n\u00e3o mudou.'),
        h('div',{class:'f13 mut2',style:'padding:0 2px 14px;line-height:1.6'},
          tocados.slice(0,8).map(ex=>BIB.ex(ex).n).join(', ')+(tocados.length>8?'\u2026':'')),
        h('button',{class:'btn btn-p',onclick:()=>UI.fechaFolha()},'Entendi')]);
    }catch(e){} }, 1400);
    return corrigidas;
  }catch(e){ if(DEBUG) console.log('reparaPRs', e); return 0; }
}
function reconciliaRecordes(){
  // corrige treinos gravados com a contagem antiga (1 por exercício) -> conta cada PR
  if(S.cfg.recRecalc3) return;
  try{
    const lista = Object.values(S.treinos||{}).filter(t=>!t.apagado);
    if(!lista.length){ S.cfg.recRecalc3=1; salva('cfg'); return; }
    const resets={};
    Object.entries(S.prs||{}).forEach(([ex,p])=>{ if(p && p.resetEm) resets[ex]=p.resetEm; });
    const novos = CORE.recomputaPRs(lista, resets);
    S.prs = novos; salva('prs'); salva('treinos');
    // republicar o feed com os recordes corrigidos (se tenho perfil público)
    if(S.auth && S.perfil?.user && S.cfg.feedPub!==false){
      lista.sort((a,b)=>b.inicio-a.inicio).slice(0,60).forEach(t=>{
        NET.agenda('/feed/'+S.auth.uid+'/'+t.id, resumoTreino(t));
      });
    }
    // sincronizar meus PRs pro banco
    Object.entries(S.prs).forEach(([ex,p])=>{ if(p) Object.keys(p).forEach(t=>{ if(t!=='resetEm'&&t!=='_pos') NET.agenda('prs/'+ex+'/'+t, p[t]); }); });
    S.cfg.recRecalc3=1; salva('cfg'); NET.agenda('app/cfg', S.cfg);
  }catch(e){ if(DEBUG) console.log('reconcilia', e); }
}
