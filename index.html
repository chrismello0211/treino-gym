<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ForgeX — Gym Workout Tracker</title>
<meta name="description" content="Registre seus treinos de academia: rotinas, séries, cargas, recordes e evolução. Rápido, offline e sem enrolação.">
<meta name="theme-color" content="#0D0D0F">
<link rel="icon" type="image/png" href="favicon-64.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ForgeX">
<meta property="og:title" content="ForgeX — Gym Workout Tracker">
<meta property="og:description" content="Registre séries, cargas e recordes em segundos. Feed com amigos, comparações e evolução. Funciona offline, direto da academia.">
<meta property="og:url" content="https://chrismello0211.github.io/treino-gym/">
<meta property="og:image" content="https://chrismello0211.github.io/treino-gym/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://chrismello0211.github.io/treino-gym/og-card.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForgeX">
<style>
:root{
  --bg:#0D0D0F; --surf:#161619; --surf2:#1F1F24; --surf3:#2A2A31; --line:#2C2C33;
  --tx:#ECECEE; --tx2:#9A9AA3; --tx3:#66666E;
  --brand:#FF5A00; --brand2:#FF7A2E; --brand-dim:#3A1E08;
  --ok:#2ECC71; --okbg:#12351F; --warn:#F5B70A; --warnbg:#3A2E08; --err:#F05545;
  --azul:#4CC3FF; --roxo:#A78BFA;
  --r:16px; --r2:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px; overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--tx);background:var(--surf2);
  border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--brand)}
input[type=number]{-moz-appearance:textfield;text-align:center;font-weight:700;font-size:17px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
::placeholder{color:var(--tx3)}
h1,h2,h3{margin:0}
.hide{display:none!important}

/* ---------- casca ---------- */
#topo{position:fixed;top:0;left:0;right:0;z-index:40;background:linear-gradient(var(--bg) 75%,transparent);
  padding:calc(var(--sat) + 10px) 16px 14px}
.topo-in{display:flex;align-items:center;gap:10px;min-height:40px}
.topo-tit{font-size:24px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-tit small{font-size:13px;font-weight:600;color:var(--tx2);display:block;margin-top:1px}
main{padding:calc(var(--sat) + 66px) 16px calc(var(--sab) + 92px);max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 10px);z-index:45;
  display:flex;gap:4px;background:rgba(20,23,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 20px;border-radius:20px;color:var(--tx2);font-size:11.5px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--brand);background:var(--brand-dim)}
.fantasma{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.fantasma img{width:96px;height:96px;border-radius:24px}

/* ---------- componentes ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surf2);border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;font-weight:700;font-size:15.5px;width:100%}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#14100C}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#0A2413}
.btn-err{background:transparent;border-color:#4A2320;color:var(--err)}
.btn-mini{width:auto;padding:8px 14px;font-size:13.5px;border-radius:11px}
.linha{display:flex;gap:10px;align-items:center}
.esp{flex:1}
.mut{color:var(--tx2)} .mut2{color:var(--tx3)}
.f13{font-size:13px}.f12{font-size:12px}.f14{font-size:14px}.f20{font-size:20px}.b800{font-weight:800}.b700{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--brand-dim);border-color:var(--brand);color:var(--brand2)}
.secao{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:20px 2px 10px}
.thumb{width:52px;height:52px;border-radius:50%;background:#fff;flex-shrink:0;object-fit:cover;border:2px solid var(--line)}
.thumb-ini{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;background:var(--surf3);border:2px solid var(--line);color:var(--brand2)}
.item{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--surf2)}
.item:last-child{border-bottom:none}
.stats3{display:flex;gap:6px;margin:4px 0 2px}
.stats3>*{flex:1;min-width:0;background:none;border:none;text-align:left;padding:0}
.stats3>*:first-child{flex:1.3}
.stats3 .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats3 .k{font-size:12.5px;color:var(--tx2);font-weight:600}
.stats3 .v{font-size:17px;font-weight:800;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.badge.rec{color:var(--warn)}

/* séries */
.gtab{display:grid;grid-template-columns:44px 1fr 74px 74px 46px;gap:6px;align-items:center}
.gtab.cab{color:var(--tx3);font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 0 6px}
.srow{border-radius:11px;padding:5px 4px;margin:2px -4px}
.srow.feita{background:var(--okbg)}
.srow input{padding:9px 4px;background:var(--surf2)}
.srow input.sugerido{color:var(--tx3);opacity:.55;font-weight:600}
.srow .cron{font-size:15px;line-height:1;color:var(--brand2);border-color:var(--brand-dim)}
.srow .cron.on{background:var(--brand);color:#fff;border-color:transparent}
.srow.feita input{background:rgba(255,255,255,.06);border-color:transparent}
.srow.feita input,.srow.feita input.sugerido{color:var(--tx)!important;opacity:1!important;font-weight:700!important;-webkit-text-fill-color:var(--tx)}
.stipo{font-weight:800;font-size:15px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surf2)}
.stipo.W{color:var(--warn)} .stipo.D{color:var(--azul)} .stipo.F{color:var(--err)} .stipo.N{color:var(--tx)}
.scheck{width:38px;height:38px;border-radius:11px;background:var(--surf2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.srow.feita .scheck{background:var(--ok);border-color:var(--ok);color:#0A2413}
.anterior{font-size:13px;color:var(--tx3);font-weight:600;text-align:center;overflow:hidden;white-space:nowrap}
.anterior.tem{color:var(--tx2)}

/* folha (bottom sheet) */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surf);border-radius:22px 22px 0 0;
  border:1px solid var(--line);border-bottom:none;max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.3,.9,.3,1);padding-bottom:var(--sab);
  pointer-events:none;visibility:hidden}
.folha.on{transform:translateY(0);pointer-events:auto;visibility:visible}
.folha-cab{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--surf2)}
.folha-corpo{overflow-y:auto;padding:12px 16px;flex:1;-webkit-overflow-scrolling:touch}
.alca{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}

/* picker */
#pk-lista .item{cursor:pointer}
.pk-filtros{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.pk-filtros .chip{white-space:nowrap;flex-shrink:0}

/* timer de descanso */
#timerbar{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 78px);z-index:50;background:var(--surf3);
  border:1px solid var(--brand);border-radius:18px;padding:10px 14px;display:none;align-items:center;gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timerbar.on{display:flex}
body.tela-ativo #timerbar{bottom:calc(var(--sab) + 12px)}
#tb-tempo{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:86px}
.tb-btn{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-weight:800;font-size:14px}
.tb-pular{background:var(--brand);border-color:var(--brand);color:#14100C}
#tb-barra{position:absolute;left:14px;right:14px;bottom:4px;height:3px;border-radius:3px;background:var(--surf2);overflow:hidden}
#tb-fill{height:100%;background:var(--brand);width:0%}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--sab) + 150px);z-index:80;
  background:var(--surf3);border:1px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:700;font-size:14.5px;
  opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.rec{border-color:var(--warn);color:var(--warn)}
#syncbar{display:none;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--tx3);
  padding:4px 16px 0;text-align:center;line-height:1.3}
#syncbar.on{display:block}
#syncbar.erro{color:var(--warn)}
body.com-sync main{padding-top:calc(var(--sat) + 84px)}
#toast.com-bt{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left}
#toast .bt-desf{background:none;border:none;color:var(--brand2);font-weight:800;font-size:14px;padding:4px 2px;cursor:pointer;flex-shrink:0}

/* gráfico */
canvas.graf{width:100%;height:170px;display:block}
.gtoggle{display:flex;gap:8px;margin:10px 0 2px}

/* cronômetro topo do treino */
.cron{font-variant-numeric:tabular-nums}
#ta-progresso{position:fixed;top:0;left:0;height:3px;background:var(--brand);z-index:46;width:0%;transition:width .3s}

/* detalhe exercício */
.ex-hero{width:100%;max-width:340px;aspect-ratio:1;border-radius:20px;background:#fff;display:block;margin:0 auto 12px;object-fit:cover}

/* utilidades */
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numstep{display:flex;align-items:center;gap:8px}
.numstep button{width:40px;height:40px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);font-size:19px;font-weight:800}
details.pasta{margin-bottom:10px}
details.pasta summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:6px 2px;cursor:pointer;color:var(--tx2)}
details.pasta summary::-webkit-details-marker{display:none}
details.pasta summary .seta{transition:transform .15s}
details.pasta[open] summary .seta{transform:rotate(90deg)}
.menu-op{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--surf2);font-weight:600;width:100%;text-align:left}
.menu-op:last-child{border-bottom:none}
.menu-op.perigo{color:var(--err)}
.vazio{ text-align:center;color:var(--tx3);padding:34px 20px;font-size:14.5px;line-height:1.55}
.vazio .emo{font-size:38px;display:block;margin-bottom:8px}

/* v2: feed */
.feed-cab{display:flex;gap:11px;align-items:center;margin-bottom:12px}
.feed-mais{background:none;border:none;color:var(--tx3);font-size:20px;font-weight:800;line-height:1;padding:0 4px;flex-shrink:0}
.feed-tit{display:flex;align-items:center;font-weight:800;font-size:18px;letter-spacing:-.2px;margin:0 0 13px;position:relative;padding-left:12px}
.feed-bar{position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:3px;background:var(--brand)}
.fstats{display:flex;gap:8px;margin-bottom:4px}
.fstat{flex:1;min-width:0;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:11px 10px}
.fstat-ico{display:flex;width:20px;height:20px;color:var(--tx3);margin-bottom:7px}
.fstat-ico svg{width:20px;height:20px}
.fstat.rec .fstat-ico{color:var(--brand2)}
.fstat-v{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstat-k{font-size:11.5px;color:var(--tx3);font-weight:600;margin-top:1px}
.feed-exs{margin-top:14px}
.feed-resto{color:var(--tx2);font-size:13px;font-weight:700;text-align:center;padding:12px 0 2px;border-top:1px dashed var(--line);margin-top:2px}
.feed-abrir{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:13px;border-radius:14px;border:1px solid var(--brand);background:none;color:var(--brand2);font-weight:800;font-size:14.5px}
.feed-abrir:active{background:var(--brand-dim)}
.feed-seta{display:flex;width:17px;height:17px}
.feed-seta svg{width:17px;height:17px}
.feed-acoes{display:flex;gap:26px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surf3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand2);flex-shrink:0}
.feed-ex{display:flex;gap:12px;align-items:center;padding:9px 0}
.feed-ex+.feed-ex{border-top:1px solid var(--line)}
.feed-ex .thumb{width:44px;height:44px}
.vermais{color:var(--tx2);font-size:13.5px;font-weight:700;padding:10px 0 2px;width:100%;text-align:center}

/* v2: mapa muscular */
.musc .m{fill:#2A323D}
.musc .on{fill:var(--brand)}
body.claro .musc .m{fill:#D9DEE5}

/* v2: calendário */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem{font-size:11px;font-weight:800;color:var(--tx3);text-align:center;padding:6px 0;text-transform:uppercase}
.cal-dia{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--tx2);position:relative}
.cal-dia.fora{opacity:.28}
.cal-dia.hoje{border:1px solid var(--brand);color:var(--tx)}
.cal-dia.tem{background:var(--brand-dim);color:var(--brand2);font-weight:800}
.cal-dia .pontos{display:flex;gap:2px;position:absolute;bottom:5px}
.cal-dia .pt{width:4px;height:4px;border-radius:50%;background:var(--brand)}

/* v2: medições / estatísticas */
.med-row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--surf2)}
.med-row:last-child{border-bottom:none}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0}
.hbar .rot{width:104px;font-size:13px;font-weight:700;color:var(--tx2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trilho{flex:1;height:14px;border-radius:7px;background:var(--surf2);overflow:hidden}
.hbar .fill{height:100%;background:var(--brand);border-radius:7px}
.hbar .val{width:34px;font-size:12.5px;font-weight:800;color:var(--tx2)}
.periodo{display:flex;gap:8px;margin:0 0 6px}

/* v3: superssérie, rpe, social */
.ss-tag{font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:6px;margin-bottom:6px;display:inline-block}
.stipo{position:relative}
.stipo .rpe{position:absolute;top:-5px;right:-7px;font-size:9px;font-weight:800;color:var(--brand2);background:var(--surf);padding:0 2px;border-radius:4px}
.stipo .prm{position:absolute;top:-7px;left:-7px;font-size:11px;line-height:1}
.pr-base{font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.3;font-weight:600}
.corpoIm{display:flex;justify-content:center;align-items:flex-start;isolation:isolate;line-height:0}
.corpoIm .cLado{position:relative;width:54%;margin:0 -4%;aspect-ratio:1/1;flex-shrink:0}
.corpoIm .cLado img{width:100%;height:100%;display:block}
.corpoIm .cGlow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%}
.srow.feita .stipo{background:rgba(255,255,255,.10)}
.rpe-tag{font-size:11px;font-weight:800;color:var(--brand2);margin-left:6px}
.heart{display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--tx3);font-size:14px;font-weight:800;padding:0}
.heart svg{width:21px;height:21px}
.heart.on{color:var(--brand2)}
.zeb{background:rgba(255,255,255,.035);border-radius:8px}
.sug-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.sug-card{min-width:132px;max-width:132px;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:14px 10px 12px;position:relative;flex-shrink:0}
.sug-card .btn{width:100%}
.sug-x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--tx3);font-size:13px;padding:4px}
.reo-row{display:flex;align-items:center;gap:12px;height:52px;margin-bottom:8px;background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;user-select:none;transition:transform .15s}
.reo-row .thumb{width:38px;height:38px}
.reo-h{font-size:22px;color:var(--tx3);padding:10px 12px;touch-action:none;cursor:grab;flex-shrink:0}
.reo-drag{transition:none;position:relative;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.55);background:var(--surf3)}
.ntf-dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--brand);display:none}
img.avatar{object-fit:cover}
.foto-post{width:100%;max-height:340px;object-fit:cover;border-radius:14px;display:block;margin:2px 0 10px;background:var(--surf2)}
.foto-esq{width:100%;height:180px;border-radius:14px;background:var(--surf2);margin:2px 0 10px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px}
.foto-mini{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.vsav{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 14px}
.vsav .an{border:3px solid var(--brand);border-radius:50%;padding:2px;display:inline-block}
.vsav .an.b{border-color:var(--azul)}
.vsav .vs{font-weight:900;color:var(--tx3);font-size:13px}
.cmp-rot{font-size:13px;color:var(--tx2);font-weight:700;display:flex;justify-content:space-between;margin:12px 0 4px}
.cmp-bar{height:16px;border-radius:8px;background:var(--surf2);overflow:hidden}
.cmp-bar>div{height:100%;border-radius:8px}
.cmp-val{font-size:12px;font-weight:800;margin-left:8px;min-width:64px;text-align:right}
.rotpub{min-width:150px;max-width:150px;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:12px;flex-shrink:0;text-align:left}
/* glass iOS */
@supports (backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px)){

<script>
/* ============================================================
   TREINO GYM — núcleo

'use strict';

/* ---- detector de erros visível (diagnóstico) ---- */
(function(){
  // Barra visível desativada para o público. Ative com localStorage.setItem('tg_debug','1') para diagnóstico.
  var DEBUG = false; try{ DEBUG = localStorage.getItem('tg_debug')==='1'; }catch(e){}
  function mostra(msg){
    try{ console.warn('[TreinoGym]', msg); }catch(e){}
    if(!DEBUG) return;
    try{
      var b=document.getElementById('errbar');
      if(!b){ b=document.createElement('div'); b.id='errbar';
        b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#B3261E;color:#fff;font:600 12px/1.4 system-ui,sans-serif;padding:10px 40px 10px 12px;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto;box-shadow:0 -4px 20px rgba(0,0,0,.5)';
        var x=document.createElement('button'); x.textContent='✕';
        x.style.cssText='position:absolute;top:6px;right:8px;background:none;border:none;color:#fff;font-size:16px;font-weight:800';
        x.onclick=function(){ b.remove(); };
        b.appendChild(x);
        (document.body||document.documentElement).appendChild(b);
      }
      var p=document.createElement('div'); p.textContent='⚠ '+msg; b.appendChild(p);
    }catch(e){}
  }
  window.addEventListener('error', function(ev){
    mostra((ev.message||'erro')+(ev.filename?(' · linha '+ev.lineno):''));
  });
  window.addEventListener('unhandledrejection', function(ev){
    var r=ev.reason; mostra('promessa: '+((r&&(r.message||r))||'erro'));
  });
  window.__errbar_mostra=mostra;
})();

const APP_VER='11.12';
(function(){ function reg(m,s){ try{ const k='tg_errlog'; const l=JSON.parse(localStorage.getItem(k)||'[]'); l.push({t:new Date().toISOString().slice(5,19), m:String(m).slice(0,180), s:String(s||'').slice(0,60)}); while(l.length>20) l.shift(); localStorage.setItem(k, JSON.stringify(l)); }catch(e){} }
  window.addEventListener('error', ev=>reg(ev.message, (ev.filename||'').split('/').pop()+':'+ev.lineno));
  window.addEventListener('unhandledrejection', ev=>reg('promise: '+(ev.reason&&ev.reason.message||ev.reason), '')); })();

/*CORE-START*/
const CORE = {
  est1RM(kg, reps){ if(!kg||!reps) return 0; if(reps===1) return kg; return Math.round(kg*(1+reps/30)*10)/10; },
  metricasSr(sets){
    let kg=null, rm=null, vol=null, reps=null;
    (sets||[]).forEach(s=>{
      const k=Number(s.k!=null?s.k:s.kg)||0, r=Number(s.r!=null?s.r:s.reps)||0;
      if(!k && !r) return;
      if(k && (!kg || k>kg.k)) kg={k, r};
      const e1=CORE.est1RM(k, r); if(e1 && (!rm || e1>rm.v)) rm={v:e1, k, r};
      const v=k*r; if(v && (!vol || v>vol.v)) vol={v, k, r};
      if(r && (!reps || r>reps.r)) reps={r, k};
    });
    return {kg, rm, vol, reps};
  },
  volumeSerie(s){ return ((Number(s.kg)||0)+(Number(s.pc)||0)) * (Number(s.reps)||0); },
  volumeTreino(t){ let v=0; (t.ex||[]).forEach(e=>(e.series||[]).forEach(s=>{ if(s.ok) v+=CORE.volumeSerie(s); })); return Math.round(v*10)/10; },
  seriesFeitas(t){ let n=0; (t.ex||[]).forEach(e=>(e.series||[]).forEach(s=>{ if(s.ok) n++; })); return n; },
  melhorSerieKg(series){ let m=null; (series||[]).forEach(s=>{ if(s.ok && s.tipo!=='W' && Number(s.kg)>0){ if(!m || Number(s.kg)>Number(m.kg) || (Number(s.kg)===Number(m.kg)&&Number(s.reps)>Number(m.reps))) m=s; } }); return m; },
  // detecta PRs de uma série concluída contra o placar atual → lista de tipos batidos
  detectaPR(prs, exId, s){
    if(!s.ok) return [];
    const kg=Number(s.kg)||0, reps=Number(s.reps)||0, vol=CORE.volumeSerie(s), rm=CORE.est1RM(kg,reps);
    const p = prs[exId]||{};
    const bate=[];
    if(kg>0 && kg > (p.kg?p.kg.v:0)) bate.push(['kg',kg]);
    if(vol>0 && vol > (p.vol?p.vol.v:0)) bate.push(['vol',vol]);
    if(rm>0 && rm > (p.rm?p.rm.v:0)) bate.push(['rm',rm]);
    if(kg===0 && reps>0 && reps > (p.reps?p.reps.v:0)) bate.push(['reps',reps]);
    return bate;
  },
  // conta recorde: tipos UNICOS por exercicio (carga, volume, 1RM e reps
  // contam separado, mas a mesma marca batida em 2 series conta 1 vez so)
  contaRecordes(t){
    let n=0;
    ((t && t.ex) || []).forEach(e=>{
      const tipos=new Set();
      (e.series||[]).forEach(s=>{ if(s.ok && Array.isArray(s.pr)) s.pr.forEach(tp=>tipos.add(tp)); });
      n += tipos.size;
    });
    return n;
  },
  // marcas reais de um exercicio (ignora resetEm e controle interno)
  marcasDe(reg){
    if(!reg) return [];
    return ['kg','vol','rm','reps'].map(tp=>reg[tp]).filter(Boolean);
  },
  aplicaPR(prs, exId, tipos, tid, data){
    const p = prs[exId] = prs[exId]||{};
    tipos.forEach(([t,v])=>{ p[t]={v, tid, data}; });
    return prs;
  },
  fmtDur(seg){ seg=Math.max(0,Math.round(seg)); const h=Math.floor(seg/3600), m=Math.floor(seg%3600/60), s=seg%60;
    if(h>0) return h+'h '+String(m).padStart(2,'0')+'min'; if(m>0) return m+'min '+String(s).padStart(2,'0')+'s'; return s+'s'; },
  fmtRelogio(seg){ seg=Math.max(0,Math.round(seg)); const hh=Math.floor(seg/3600), m=Math.floor(seg%3600/60), s=seg%60;
    if(hh>0) return hh+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); },
  fmtKg(v){ v=Math.round((Number(v)||0)*10)/10; return v.toLocaleString('pt-BR',{maximumFractionDigits:1}); },
  fmtKgCurto(v){ v=Number(v)||0; if(v>=10000) return Math.round(v/1000)+'k'; if(v>=1000) return (Math.round(v/100)/10).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k'; return CORE.fmtKg(v); },
  semanaKey(ts){ const d=new Date(ts); const dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); d.setHours(0,0,0,0); return d.getTime(); },
  ultimasSemanas(n, agora){ const base=CORE.semanaKey(agora||Date.now()); const out=[]; for(let i=n-1;i>=0;i--) out.push(base - i*7*864e5); return out; },
  agregaSemanas(treinos, n, agora){
    const semanas=CORE.ultimasSemanas(n, agora);
    const mapa={}; semanas.forEach(w=>mapa[w]={dur:0,vol:0,ser:0,qtd:0});
    Object.values(treinos||{}).forEach(t=>{ const w=CORE.semanaKey(t.inicio); if(mapa[w]){ mapa[w].dur+=(t.fim-t.inicio)/1000; mapa[w].vol+=t.volume||0; mapa[w].ser+=t.series||0; mapa[w].qtd++; } });
    return semanas.map(w=>({w, ...mapa[w]}));
  }
};
CORE.descansaApos = function(exList, ix){
  const ss=exList[ix] && exList[ix].ss;
  if(!ss) return true;
  return !exList.slice(ix+1).some(q=>q.ss===ss);
};
// desfaz as marcas que estas series haviam gravado em S.prs
CORE.reverteSeries = function(exId, series){
  let n=0;
  // DE TRAS PRA FRENTE: cada serie guardou o estado de ANTES dela, entao a
  // 1a serie tem o valor original. Revertendo na ordem direta, a ultima
  // sobrescreveria as anteriores e a marca ficaria inflada do mesmo jeito.
  (series||[]).slice().reverse().forEach(s=>{
    if(!s || !s._prBackup) return;
    s._prBackup.forEach(([tp, valAntigo])=>{
      if(!S.prs[exId]) return;
      if(valAntigo) S.prs[exId][tp]=valAntigo; else delete S.prs[exId][tp];
      NET.agenda('prs/'+exId+'/'+tp, valAntigo||null);
      n++;
    });
    delete s._prBackup; delete s.pr;
  });
  return n;
};
CORE.reverteExercicio = function(e){
  return e ? CORE.reverteSeries(e.exId, e.series) : 0;
};
CORE.reverteTreino = function(t){
  let n=0; ((t&&t.ex)||[]).forEach(e=>{ n+=CORE.reverteExercicio(e); });
  return n;
};
CORE.recomputaPRs = function(lista, resets){
  resets = resets || {};
  const prs={};
  lista.slice().sort((a,b)=>a.inicio-b.inicio).forEach(t=>{
    t.recordes=0;
    (t.ex||[]).forEach(e=>{
      const rE=resets[e.exId];
      if(rE && t.inicio>=rE && (!prs[e.exId] || !prs[e.exId]._pos)) prs[e.exId]={resetEm:rE,_pos:true};
      // marca de referência ANTES deste treino (pra saber o que é PR de verdade hoje)
      const base = Object.assign({}, prs[e.exId]);
      // 1) achar a melhor série de cada tipo DENTRO deste treino
      const melhor={};   // tipo -> {v, s}
      (e.series||[]).forEach(s=>{
        delete s.pr;
        if(!s.ok || s.tipo==='W' && false) {}          // (W conta; placeholder p/ clareza)
        if(!s.ok) return;
        const kg=Number(s.kg)||0, reps=Number(s.reps)||0, vol=CORE.volumeSerie(s), rm=CORE.est1RM(kg,reps);
        const cand = kg>0 ? {kg, vol, rm} : {reps};
        Object.entries(cand).forEach(([tp,v])=>{
          if(v>0 && (!melhor[tp] || v>melhor[tp].v)) melhor[tp]={v, s};
        });
      });
      // 2) para cada tipo, conta PR só se a melhor série do treino superar a marca anterior — UMA vez
      //    ESTREIA: se nao havia marca anterior nenhuma (exercicio novo ou recem-zerado),
      //    este treino so DEFINE a marca. Medalha vale a partir do proximo.
      const estreiaEx = !CORE.marcasDe(base).length;
      Object.entries(melhor).forEach(([tp,info])=>{
        const marcaAnt = base[tp] ? base[tp].v : 0;
        if(info.v > marcaAnt){
          prs[e.exId]=prs[e.exId]||{};
          prs[e.exId][tp]={v:info.v, tid:t.id, data:t.inicio};
          if(!estreiaEx){
            (info.s.pr = info.s.pr || []).push(tp);
            t.recordes += 1;                            // 1 recorde por tipo, por treino
          }
        }
      });
    });
    t.volume=CORE.volumeTreino(t);
    t.series=CORE.seriesFeitas(t);
  });
  Object.entries(resets).forEach(([ex,rE])=>{
    const p=prs[ex];
    if(!p || !p._pos) prs[ex]={resetEm:rE};
    else { delete p._pos; p.resetEm=rE; }
  });
  return prs;
};
const IMP = {
  parseCSV(texto){
    const linhas=[]; let campo='', linha=[], dentro=false;
    for(let i=0;i<texto.length;i++){
      const c=texto[i];
      if(dentro){
        if(c==='"'){ if(texto[i+1]==='"'){ campo+='"'; i++; } else dentro=false; }
        else campo+=c;
      } else {
        if(c==='"') dentro=true;
        else if(c===','){ linha.push(campo); campo=''; }
        else if(c==='\n'){ linha.push(campo); campo=''; if(linha.some(x=>x!=='')) linhas.push(linha); linha=[]; }
        else if(c!=='\r') campo+=c;
      }
    }
    if(campo!==''||linha.length){ linha.push(campo); if(linha.some(x=>x!=='')) linhas.push(linha); }
    if(!linhas.length) return [];
    const cab=linhas[0];
    return linhas.slice(1).map(l=>{ const o={}; cab.forEach((k,ix)=>o[k]=l[ix]??''); return o; });
  },
  MESES:{jan:0,fev:1,feb:1,mar:2,abr:3,apr:3,mai:4,may:4,jun:5,jul:6,ago:7,aug:7,set:8,sep:8,out:9,oct:9,nov:10,dez:11,dec:11},
  parseData(s){
    const m=/^(\d{1,2})\s+([A-Za-z\u00e7\u00c7]{3,4})\s+(\d{4})(?:,\s*(\d{1,2}):(\d{2}))?/.exec((s||'').trim());
    if(!m) return null;
    const mes=IMP.MESES[m[2].slice(0,3).toLowerCase()];
    if(mes==null) return null;
    return new Date(+m[3], mes, +m[1], +(m[4]||0), +(m[5]||0)).getTime();
  },
  hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); },
  TIPOS:{normal:'N', warmup:'W', dropset:'D', failure:'F'},
  montaTreinos(rows, resolveEx){
    const grupos=new Map();
    rows.forEach(r=>{
      const k=r.title+'\u0001'+r.start_time;
      if(!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(r);
    });
    const treinos=[];
    grupos.forEach((rs, k)=>{
      const r0=rs[0];
      const inicio=IMP.parseData(r0.start_time), fim=IMP.parseData(r0.end_time)||inicio;
      if(!inicio) return;
      const exMap=new Map();
      rs.forEach(r=>{
        const tt=(r.exercise_title||'').trim();
        if(!exMap.has(tt)) exMap.set(tt, {titulo:tt, notas:(r.exercise_notes||'').trim(), series:[]});
        const dur=Number(r.duration_seconds)||0;
        const kg=r.weight_kg===''?'':Number(r.weight_kg);
        const reps=dur>0? dur : (r.reps===''?'':Number(r.reps));
        exMap.get(tt).series.push({ix:Number(r.set_index)||0, tipo:IMP.TIPOS[r.set_type]||'N', kg:kg===''?'':kg, reps:reps===''?'':reps, ok:true});
      });
      const ex=[];
      exMap.forEach(e=>{
        e.series.sort((a,b)=>a.ix-b.ix);
        e.series.forEach(s=>delete s.ix);
        ex.push({exId:resolveEx(e.titulo), notas:e.notas, descanso:90, series:e.series});
      });
      treinos.push({ id:'hv_'+IMP.hash(k), titulo:r0.title, inicio, fim, ex, origem:'hevy' });
    });
    treinos.sort((a,b)=>a.inicio-b.inicio);
    return treinos;
  },
  montaMedidas(rows){
    const CAMPOS={weight_kg:'peso',fat_percent:'gordura',neck_cm:'pescoco',shoulder_cm:'ombros',chest_cm:'peito',
      left_bicep_cm:'bracoE',right_bicep_cm:'bracoD',left_forearm_cm:'antebracoE',right_forearm_cm:'antebracoD',
      abdomen_cm:'abdomen',waist_cm:'cintura',hips_cm:'quadril',left_thigh_cm:'coxaE',right_thigh_cm:'coxaD',
      left_calf_cm:'pantE',right_calf_cm:'pantD'};
    const out=[];
    rows.forEach(r=>{
      const data=IMP.parseData(r.date); if(!data) return;
      const m={id:'hv_'+IMP.hash(r.date), data, origem:'hevy'};
      let tem=false;
      Object.entries(CAMPOS).forEach(([col,campo])=>{ if(r[col]!==''&&r[col]!=null){ m[campo]=Number(r[col]); tem=true; } });
      if(tem) out.push(m);
    });
    return out.sort((a,b)=>a.data-b.data);
  }
};
/*CORE-END*/

/* ---------- auth anônima + sync (REST) ---------- */
const NET = {
  online: navigator.onLine,
  sincronizando:false,
  async signup(){
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.key,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok) throw new Error('signup');
    const d = await r.json();
    S.auth = {uid:d.localId, refreshToken:d.refreshToken, idToken:d.idToken, exp:Date.now()+(d.expiresIn-300)*1000};
    salva('auth'); return S.auth;
  },
  async token(){
    if(!S.auth) return null;
    if(S.auth.idToken && Date.now() < S.auth.exp) return S.auth.idToken;
    try{
      const r = await NET.fetchT('https://securetoken.googleapis.com/v1/token?key='+FB.key,{
        method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.auth.refreshToken)}, 15000);
      if(!r.ok) throw 0;
      const d = await r.json();
      S.auth.idToken=d.id_token; S.auth.refreshToken=d.refresh_token;
      S.auth.exp=Date.now()+(d.expires_in-300)*1000; salva('auth');
      return S.auth.idToken;
    }catch(e){ return null; }
  },
  caminho(p){ return p[0]==='/' ? FB.db+p+'.json' : FB.db+'/usuarios/'+S.auth.uid+'/'+p+'.json'; },
  async get(p){
    try{
      const tk=await NET.token(); if(!tk) return null;
      const [base, qs]=p.split('?');
      const r=await fetch(NET.caminho(base)+'?'+(qs? qs+'&':'')+'auth='+tk);
      if(!r.ok) return null;
      return await r.json();
    }catch(e){ return null; }
  },
  async criarConta(email, senha){
    if(!S.auth){ try{ await NET.signup(); }catch(e){ throw new Error('Sem conexão'); } }
    const tk=await NET.token(); if(!tk) throw new Error('Sem conexão');
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:update?key='+FB.key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({idToken:tk, email, password:senha, returnSecureToken:true})});
    const d=await r.json();
    if(!r.ok){ const c=d.error?.message||''; throw new Error(
      c.includes('EMAIL_EXISTS')?'Esse e-mail já tem conta. Use Entrar.':
      c.includes('WEAK_PASSWORD')?'Senha fraca: mínimo 6 caracteres.':
      c.includes('INVALID_EMAIL')?'E-mail inválido.':
      c.includes('OPERATION_NOT_ALLOWED')?'Ative o provedor E-mail/senha no Firebase: Authentication ▸ Sign-in method ▸ Email/Password ▸ Enable ▸ Salvar.':
      c.includes('ADMIN_ONLY_OPERATION')?'A criação de contas está desativada no Firebase: Authentication ▸ Settings ▸ ative o cadastro de usuários.':
      (c.includes('TOKEN_EXPIRED')||c.includes('INVALID_ID_TOKEN')||c.includes('CREDENTIAL_TOO_OLD'))?'Sessão expirada. Feche e reabra o app e tente de novo.':
      ('Firebase: '+(c||'erro desconhecido'))); }
    S.auth={uid:d.localId, refreshToken:d.refreshToken||S.auth.refreshToken, idToken:d.idToken, exp:Date.now()+((+d.expiresIn||3600)-300)*1000};
    salva('auth');
  },
  async entrar(email, senha){
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email, password:senha, returnSecureToken:true})});
    const d=await r.json();
    if(!r.ok){ const c=d.error?.message||''; throw new Error(
      c.includes('INVALID_LOGIN')||c.includes('INVALID_PASSWORD')||c.includes('EMAIL_NOT_FOUND')?'E-mail ou senha incorretos.':
      c.includes('TOO_MANY')?'Muitas tentativas. Aguarde um pouco.':
      c.includes('OPERATION_NOT_ALLOWED')?'Ative o provedor E-mail/senha no Firebase: Authentication ▸ Sign-in method.':
      ('Firebase: '+(c||'erro desconhecido'))); }
    return {uid:d.localId, refreshToken:d.refreshToken, idToken:d.idToken, exp:Date.now()+((+d.expiresIn||3600)-300)*1000, email};
  },
  async resetSenha(email){
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+FB.key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({requestType:'PASSWORD_RESET', email})});
    if(!r.ok) throw new Error('Não achei conta com esse e-mail.');
  },
  async putD(p, val){
    const tk=await NET.token(); if(!tk) throw new Error('offline');
    const r=await fetch(NET.caminho(p)+'?auth='+tk,{method:'PUT',body:JSON.stringify(val===undefined?null:val)});
    if(!r.ok) throw new Error('put');
    return true;
  },
  // toda escrita e um PUT no caminho: se o mesmo caminho ja esta na fila,
  // a versao antiga virou lixo. Guarda so a ultima.
  agenda(path, val){
    const i=S.fila.findIndex(f=>f && f.path===path);
    if(i>=0) S.fila[i]={path, val, ts:Date.now(), tent:S.fila[i].tent};
    else {
      S.fila.push({path, val, ts:Date.now()});
      if(S.fila.length>400) S.fila.splice(0, S.fila.length-400);
    }
    salva('fila'); try{ UI.pintaSync(); }catch(e){} NET.despacha();
  },
  _retryT:null,
  _desde:0,
  reagenda(ms){
    clearTimeout(NET._retryT);
    NET._retryT=setTimeout(()=>{ NET._retryT=null; NET.despacha(); }, ms||1500);
  },
  // fetch que NUNCA fica pendurado. Sem isso, um envio que nao volta
  // (rede ruim, app em segundo plano) travava a fila inteira pra sempre.
  async fetchT(url, opts, ms){
    const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const t = setTimeout(()=>{ try{ ctrl && ctrl.abort(); }catch(e){} }, ms||25000);
    try{
      return await fetch(url, Object.assign({}, opts||{}, {signal:ctrl?ctrl.signal:undefined}));
    } finally { clearTimeout(t); }
  },
  async envia(url, corpo, ms){ return NET.fetchT(url, {method:'PUT', body:corpo}, ms); },
  _gen:0,
  async despacha(){
    // trava presa alem do razoavel: o proximo despacho TOMA a fila pra si.
    // A geracao garante que o loop antigo, se ainda existir, desista.
    if(NET.sincronizando && NET._desde && Date.now()-NET._desde > 120000){
      NET._gen++; NET.sincronizando=false;
    }
    if(NET.sincronizando || !S.fila.length || !S.auth || !navigator.onLine) return;
    NET.sincronizando = true; NET._desde = Date.now();
    const gen = NET._gen;
    // limpeza: a corrida antiga pode ter deixado o mesmo caminho 2x na fila
    (function(){
      const vistos={};
      for(let i=S.fila.length-1;i>=0;i--){
        const p=S.fila[i] && S.fila[i].path;
        if(!p) continue;
        if(vistos[p]) S.fila.splice(i,1); else vistos[p]=1;
      }
    })();
    let parouPorErro=false;
    try{
      const tk = await NET.token();
      if(gen!==NET._gen) return;                    // outro loop assumiu
      if(!tk) throw 0;
      let passos = 60, seguidas = 0;
      while(S.fila.length && passos-- > 0){
        const it = S.fila[0];
        // item adiado por falha de rede: deixa passar a vez sem tentar
        if(it.adiado && Date.now() < it.adiado){
          if(S.fila.every(f=>f.adiado && Date.now()<f.adiado)) { break; }
          S.fila.shift(); S.fila.push(it); continue;
        }
        const corpo = JSON.stringify(it.val);
        let r=null, caiu=false;
        // payload grande merece mais tempo, mas nunca infinito
        try{ r = await NET.envia(NET.caminho(it.path)+'?auth='+tk, corpo, corpo.length>60000?40000:15000); }
        catch(e){ caiu=true; }
        if(gen!==NET._gen) return;                  // outro loop assumiu no meio do envio

        if(r && r.ok){ S.fila.shift(); seguidas=0; salva('fila'); continue; }

        // 401 no meio de envio longo: token venceu. Forca renovar no proximo ciclo.
        if(r && r.status===401){ try{ S.auth.exp=0; }catch(e){} }

        // falhou: conta a tentativa
        const permanente = !!(r && r.status>=400 && r.status<500 && r.status!==401);
        it.tent = (it.tent||0)+1;
        const limite = permanente ? 3 : 8;          // erro de regra desiste antes
        S.fila.shift();
        if(permanente && it.tent>=limite){
          // erro de regra/payload nao passa nunca: sai da fila, fica no log
          const errs = LS.get('filaErr', []);
          errs.push({path:it.path, st:r.status, tent:it.tent, ts:Date.now()});
          LS.set('filaErr', errs.slice(-30));
        } else {
          // problema de rede: NAO descarta (seria perder foto/treino).
          // Adia e deixa os outros passarem; volta a tentar mais tarde.
          if(it.tent>=limite){
            it.adiado = Date.now() + Math.min(10*60000, 30000*Math.pow(2, it.tent-limite));
            const errs = LS.get('filaErr', []);
            errs.push({path:it.path, st:(caiu?'timeout':(r? r.status : 'rede')), tent:it.tent, adiado:1, ts:Date.now()});
            LS.set('filaErr', errs.slice(-30));
          }
          S.fila.push(it);                          // pro fim, os outros passam
        }
        salva('fila');
        parouPorErro=true;
        if(++seguidas>=3) break;                    // 3 falhas seguidas: rede ruim, espera
      }
      if(!S.fila.length) UI._syncDesde=0;
      UI.pingSync(!S.fila.length);
    }catch(e){ parouPorErro=true; UI.pingSync(false); }
    if(gen!==NET._gen) return;                      // perdeu a vez: nao mexe em nada
    NET.sincronizando = false; NET._desde = 0;
    try{ UI.pintaSync(); }catch(e){}
    if(S.fila.length && navigator.onLine){
      NET._falhas = parouPorErro ? Math.min((NET._falhas||0)+1, 6) : 0;
      NET.reagenda(parouPorErro ? Math.min(2000*Math.pow(2,NET._falhas), 60000) : 400);
    } else NET._falhas=0;
  },
  async puxa(){
    if(!S.auth || !navigator.onLine) return;
    try{
      const tk = await NET.token(); if(!tk) return;
      const r = await fetch(FB.db+'/usuarios/'+S.auth.uid+'.json?auth='+tk);
      if(!r.ok) return;
      const nuvem = await r.json(); if(!nuvem) return;
      // fusão por entidade: mais novo vence
      const fun = (localMap, remotoMap, campo)=>{
        let mudou=false;
        Object.entries(remotoMap||{}).forEach(([id,rv])=>{
          const lv = localMap[id];
          if(!lv || (rv.atualizado||0) > (lv.atualizado||0)){ localMap[id]=rv; mudou=true; }
        });
        if(mudou) salva(campo);
        return mudou;
      };
      let m = false;
      m = fun(S.rotinas, nuvem.rotinas, 'rotinas') || m;
      m = fun(S.pastas, nuvem.pastas, 'pastas') || m;
      m = fun(S.treinos, nuvem.treinos, 'treinos') || m;
      m = fun(S.custom, nuvem.custom, 'custom') || m;
      m = fun(S.medidas, nuvem.medidas, 'medidas') || m;
      m = fun(S.exNotas, nuvem.exNotas, 'exNotas') || m;
      if(nuvem.app && nuvem.app.trocas){
        const _num=v=> typeof v==='number'? {n:v,ts:0} : (v||{n:0,ts:0});
        Object.entries(nuvem.app.trocas).forEach(([de,mp])=>{
          S.trocas[de]=S.trocas[de]||{};
          Object.entries(mp||{}).forEach(([para,v])=>{
            const a=_num(S.trocas[de][para]), b=_num(v);
            S.trocas[de][para]={n:Math.max(a.n,b.n), ts:Math.max(a.ts,b.ts)};
          });
        });
        salva('trocas');
      }
      m = fun(S.fotosProg, nuvem.fotosProg, 'fotosProg') || m;
      if(nuvem.bloq){ S.social.bloq=Object.assign(S.social.bloq||{}, nuvem.bloq); salva('social'); }
      try{ SYNCATIVO.resolve(nuvem.ativo||null); }catch(e){ if(DEBUG) console.log('syncativo',e); }
      if(nuvem.app){
        if(nuvem.app.perfil && (!S.perfil || (nuvem.app.perfil.atualizado||0)>(S.perfil.atualizado||0))){ S.perfil=nuvem.app.perfil; salva('perfil'); m=true; }
        if(S.perfil && !S.perfil.user && S.auth){ try{ const pub=await NET.get('/perfis/'+S.auth.uid); if(pub && pub.user){ S.perfil.user=pub.user; if(pub.foto && !S.perfil.foto) S.perfil.foto=pub.foto; salva('perfil'); m=true; } }catch(e){} }
        if(nuvem.app.cfg && (nuvem.app.cfg.atualizado||0)>(S.cfg.atualizado||0)){ S.cfg=nuvem.app.cfg; salva('cfg'); m=true; }
      }
      if(nuvem.prs){
        Object.entries(nuvem.prs).forEach(([ex,p])=>{
          const l=S.prs[ex]||{};
          const rE=Math.max(l.resetEm||0, p.resetEm||0);
          const n={}; if(rE) n.resetEm=rE;
          ['kg','vol','rm','reps'].forEach(t=>{
            const cand=[l[t],p[t]].filter(r=>r && (!rE || (r.data||0)>=rE));
            if(cand.length) n[t]=cand.sort((a,b)=>b.v-a.v)[0];
          });
          S.prs[ex]=n;
        });
        salva('prs'); 
      }
      if(m && UI.telaAtual) UI.refaz();
    }catch(e){}
  }
};

function variantesConsulta(nq){
  const out=new Set([nq]);
  CONSULTA_VAR.forEach(([a,b])=>{
    if(nq.includes(a)) out.add(nq.split(a).join(b));
    if(nq.includes(b)) out.add(nq.split(b).join(a));
  });
  return [...out].slice(0,6);
}

function pontuaBusca(nn, nq, usos){
  let s;
  if(nn === nq) s = 100;
  else if(nn.startsWith(nq)) s = 82;
  else {
    const palavras = nn.split(' ');
    const termos = nq.split(' ').filter(Boolean);
    const todasNoNome = termos.length && termos.every(t=>nn.includes(t));
    const iniciaPalavra = termos.length && palavras.some(p=>p.startsWith(termos[0]));
    if(todasNoNome && iniciaPalavra) s = 64;
    else if(todasNoNome) s = 52;
    else s = 28; // casou só por sinônimo/grupo/equipamento
  }
  s += Math.min(18, (usos||0)*3);
  s -= Math.min(10, nn.length*0.08);
  return s;
}

      const r = await fetch('exercicios.json'+(dados?'?v='+versao:''));
      if(r.ok){ dados = await r.json(); LS.set('bib', dados); LS.set('bibv', Date.now()); }
    }catch(e){}
    BIB.lista = (dados||[]).concat(Object.values(S.custom));
    BIB.indexa();
  },
  indexa(){
    BIB.porId = {};
    BIB.lista.forEach(x=>{
      const nn = BIB.norm(x.n);
      x._nn = nn;
      x._busca = nn + ' ' + (x.g||'') + ' ' + BIB.norm(GRUPOS[x.g]||'') + ' ' + String(x.e||'').replace(/-/g,' ') + tagsExtras(nn);
      BIB.porId[x.id]=x;
    });
    BIB.pronta = true; BIB._usos = null;
  },
  norm(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); },
  ex(id){ return BIB.porId[id] || {id, n:'Exercício removido', g:'corpo-inteiro', e:'outro', t:'peso_reps', semGif:true}; },
  gif(id){ const x=BIB.porId[id]; return (x && !x.custom) ? 'g/'+id+'.webp' : null; },
  contaUsos(){
    const u={};
    Object.values(S.treinos).forEach(t=>{ if(t.apagado) return; (t.ex||[]).forEach(e=>{ u[e.exId]=(u[e.exId]||0)+1; }); });
    return u;
  },
  temGifOuFoto(x){
    if(!x.custom) return true;                 // biblioteca sempre tem gif
    if(x.foto) return true;                    // custom com foto própria
    if(!x.hevy) return true;                   // criado à mão ou copiado de amigo: sempre aparece
    // só o resto da importação do Hevy precisa casar com a biblioteca pra não virar lixo
    const nn = x._nn || BIB.norm(x.n);
    return BIB.lista.some(q=>!q.custom && !q.oc && (q._nn===nn || (q._nn && q._nn.indexOf(nn+' (')===0)));
  },
  busca(q, filtros){
    const nq = BIB.norm(q||'');
    const variantes = variantesConsulta(nq).map(v=>v.split(/\s+/).filter(Boolean));
    const usos = BIB._usos || (BIB._usos = BIB.contaUsos());
    const out=[];
    BIB.lista.forEach(x=>{
      if(filtros.meus){
        if(!x.custom) return;                   // só o que EU criei (arquivado inclusive)
      } else {
        if(x.oc) return;
        if(!BIB.temGifOuFoto(x)) return;        // customs órfãos da importação não poluem a busca
      }
      if(filtros.g && x.g!==filtros.g && !(x.gs||[]).includes(filtros.g)) return;
      if(filtros.e && x.e!==filtros.e) return;
      if(!nq){ out.push([0,x]); return; }
      let casa=false;
      for(const termos of variantes){ if(termos.length && termos.every(t=>x._busca.includes(t))){ casa=true; break; } }
      if(!casa) return;
      out.push([pontuaBusca(x._nn||'', nq, usos[x.id]||0), x]);
    });
    if(nq) out.sort((a,b)=>b[0]-a[0]);
    else out.sort((a,b)=> (a[1]._nn||'') < (b[1]._nn||'') ? -1 : 1);
    return out.map(p=>p[1]);
  }
};

// serie que produziu o recorde, curtinha: "95 kg x 6"
function serieDoPR(exId, tipo){
  const p=(S.prs[exId]||{})[tipo]; if(!p) return '';
  const tr=S.treinos[p.tid]; if(!tr) return '';
  const ex=(tr.ex||[]).find(q=>q.exId===exId); if(!ex) return '';
  const x=BIB.ex(exId);
  const rp=s=> x.t==='tempo' ? fmtTempoCampo(s.reps) : (s.reps+' reps');
  if(tipo==='kg'){
    const s=(ex.series||[]).find(s=>s.ok && Number(s.kg)===Number(p.v));
    return s? (CORE.fmtKg(s.kg)+' kg × '+rp(s)) : '';
  }
  if(tipo==='vol'){
    const s=(ex.series||[]).find(s=>s.ok && Math.abs(CORE.volumeSerie(s)-p.v)<0.01);
    return s? (CORE.fmtKg(s.kg)+' kg × '+rp(s)) : '';
  }
  if(tipo==='rm'){
    let best=null;
    (ex.series||[]).forEach(s=>{ if(!s.ok) return;
      const r=CORE.est1RM(Number(s.kg)||0, Number(s.reps)||0);
      if(!best || r>best.r) best={r,s}; });
    return best? (CORE.fmtKg(best.s.kg)+' kg × '+rp(best.s)) : '';
  }
  return '';
}
function prDetalhe(exId, tipo){
  const p=(S.prs[exId]||{})[tipo]; if(!p) return;
  const NOM={kg:'Maior carga', vol:'Melhor série', rm:'1RM estimado', reps:'Mais repetições'};
  const base=serieDoPR(exId, tipo);
  const extra = base? (tipo==='rm' ? ' (base '+base+')' : ' ('+base+')') : '';
  const data=p.data? ' · '+new Date(p.data).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
  const _x=BIB.ex(exId);
  const _rot=(tipo==='reps'&&_x.t==='tempo')?'Mais tempo':NOM[tipo];
  const _val=(tipo==='reps')? (_x.t==='tempo'? fmtTempoEx(p.v) : Math.round(p.v)+' reps') : CORE.fmtKg(p.v)+' kg';
  UI.toast(_rot+': '+_val+extra+data, true);
}

function fmtTempoCampo(seg){
  seg=Math.round(Number(seg)||0); if(!seg) return '';
  return Math.floor(seg/60)+':'+String(seg%60).padStart(2,'0');
}
// numero sozinho: em cardio a pessoa pensa em MINUTOS, em prancha pensa em SEGUNDOS
function parseTempoCampo(v, ehCardio){
  v=String(v==null?'':v).trim().replace(',',':');
  if(!v) return '';
  if(v.indexOf(':')>=0){ const p=v.split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }
  const n=parseFloat(v)||0;
  return Math.round(ehCardio ? n*60 : n);
}

function parseMin(v){ v=String(v||'').trim().replace(',',':'); if(!v) return ''; if(v.includes(':')){ const [m,s]=v.split(':'); return (parseInt(m,10)||0)*60+(parseInt(s,10)||0); } return (parseFloat(v)||0)*60; }

  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth||320, H=canvas.clientHeight||170;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const c=canvas.getContext('2d'); const T=temaCanvas(); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  const max=Math.max(1,...dados.map(d=>d.v));
  const n=dados.length, gap=n>20?2:6, bw=Math.min(34,(W-40-gap*(n-1))/n);
  const x0=(W-(bw*n+gap*(n-1)))/2, base=H-24, alt=base-16;
  c.font='10.5px -apple-system,Segoe UI,Roboto,sans-serif';
  dados.forEach((d,i)=>{
    const x=x0+i*(bw+gap), bh=Math.max(2, alt*d.v/max);
    c.fillStyle = d.v>0 ? '#FF5A00' : T.vazio;
    c.beginPath(); c.roundRect(x, base-bh, bw, bh, 5); c.fill();
    c.fillStyle=T.rot; c.textAlign='center';
    if(d.rot) c.fillText(d.rot, x+bw/2, H-8);
  });
  c.fillStyle=T.txt; c.textAlign='left'; c.font='600 11px -apple-system,Segoe UI,Roboto,sans-serif';
  c.fillText(formata?formata(max):String(max), 4, 14);
  canvas._g={x0,bw,gap,dados,formata};
  canvas.style.cursor='pointer';
  canvas.onclick=ev=>{
    const g=canvas._g; if(!g) return;
    const r=canvas.getBoundingClientRect();
    const i=Math.floor(((ev.clientX-r.left)-g.x0)/(g.bw+g.gap));
    const d=g.dados[i]; if(i<0||!d) return;
    const lbl=d.rotFull||d.rot||'';
    UI.toast((lbl?lbl+': ':'')+(g.formata?g.formata(d.v):String(d.v)), true);
  };
}
function grafLinhaClicavel(cv, pontos, formata){
  grafLinhaClicavel(cv, pontos, formata);
  const W=cv.clientWidth||320, pad=18;
  cv.style.cursor='pointer';
  cv.onclick=ev=>{
    if(!pontos.length) return;
    const r=cv.getBoundingClientRect();
    const x=ev.clientX-r.left;
    const X=i=>pad+(W-pad*2)*(pontos.length===1?0.5:i/(pontos.length-1));
    let bi=-1, bd=1e9;
    pontos.forEach((p,i)=>{ const d=Math.abs(X(i)-x); if(d<bd){bd=d; bi=i;} });
    if(bi<0||bd>28) return;
    const p=pontos[bi];
    UI.toast((p.rot?p.rot+': ':'')+(formata?formata(p.v):String(p.v)), true);
  };
}
function grafLinha(canvas, pontos, formata){
  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth||320, H=canvas.clientHeight||170;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const c=canvas.getContext('2d'); const T=temaCanvas(); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  if(!pontos.length) return;
  const vs=pontos.map(p=>p.v), max=Math.max(...vs), min=Math.min(...vs);
  const pad=18, base=H-26, topo=14, span=(max-min)||1;
  const X=i=>pad+ (W-pad*2)*(pontos.length===1?0.5:i/(pontos.length-1));
  const Y=v=>base-(base-topo)*(v-min)/span;
  c.strokeStyle=T.vazio; c.lineWidth=1;
  [0,.5,1].forEach(f=>{ const y=topo+(base-topo)*f; c.beginPath(); c.moveTo(pad,y); c.lineTo(W-pad,y); c.stroke(); });
  c.strokeStyle='#FF5A00'; c.lineWidth=2.4; c.lineJoin='round'; c.beginPath();
  pontos.forEach((p,i)=>{ const x=X(i),y=Y(p.v); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  c.fillStyle='#FF7A2E';
  pontos.forEach((p,i)=>{ c.beginPath(); c.arc(X(i),Y(p.v),3.4,0,7); c.fill(); });
  c.fillStyle=T.txt; c.font='600 11px -apple-system,Segoe UI,Roboto,sans-serif'; c.textAlign='left';
  c.fillText(formata?formata(max):String(max), 4, 12);
  c.fillText(formata?formata(min):String(min), 4, base+4);
  c.fillStyle=T.rot; c.font='10.5px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign='center';
  if(pontos[0].rot) c.fillText(pontos[0].rot, X(0)+10, H-8);
  const u=pontos.length-1;
  if(u>0 && pontos[u].rot) c.fillText(pontos[u].rot, X(u)-10, H-8);
}

  const rotinas=Object.values(S.rotinas).filter(r=>!r.apagada);
  if(!rotinas.length){
    m.appendChild(h('div',{class:'vazio'},
      'Nenhuma rotina ainda. Crie a primeira, defina exercícios e séries, e comece a registrar.'));
  }
  const pastas=Object.values(S.pastas).filter(p=>!p.apagada).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  // uma rotina pode apontar pra pasta apagada (ou que nunca existiu nesta conta,
  // caso de rotina copiada de amigo). Sem isso ela some da tela e ninguem acha.
  const idsPasta=new Set(pastas.map(p=>p.id));
  const porPasta={}; rotinas.forEach(r=>{
    const k=(r.pasta && idsPasta.has(r.pasta)) ? r.pasta : '';
    (porPasta[k]=porPasta[k]||[]).push(r);
  });
  Object.values(porPasta).forEach(l=>l.sort((a,b)=>(a.ordem||0)-(b.ordem||0)));

  const desenhaRotina=(r,dix)=>{
    const nomes=(r.ex||[]).map(e=>BIB.ex(e.exId).n);
    return h('div',{class:'card drag-cab','data-dix':dix,'data-rid':r.id},
      h('div',{class:'linha',onclick:()=>UI.vai('rotinaVer',{rid:r.id})},
        h('div',{class:'b800',style:'font-size:16.5px;flex:1'}, r.titulo),
        h('button',{class:'btn btn-mini',style:'width:38px',onclick:e=>{e.stopPropagation();ROT.menu(r);}},'⋯')),
      h('div',{class:'f13 mut',style:'margin:6px 0 12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden',onclick:()=>UI.vai('rotinaVer',{rid:r.id})},
        nomes.join(', ')||'Sem exercícios'),
      h('button',{class:'btn btn-p',onclick:()=>ATIVO.comeca(r.id)},'Iniciar rotina'));
  };

  const solta=(lista)=>ordem=>{
    ordem.forEach((idx,pos)=>{ const r=lista[idx]; if(r){ r.ordem=pos; NET.agenda('rotinas/'+r.id, r); } });
    salva('rotinas'); UI.refaz();
  };

  const semPasta=(porPasta['']||[]);
  const boxSoltas=h('div',{}); m.appendChild(boxSoltas);
  semPasta.forEach((r,i)=>boxSoltas.appendChild(desenhaRotina(r,i)));
  if(semPasta.length>1) dragOrdena(boxSoltas, solta(semPasta));

  pastas.forEach(p=>{
    const rs=porPasta[p.id]||[];
    const box=h('div',{}); rs.forEach((r,i)=>box.appendChild(desenhaRotina(r,i)));
    const det=h('details',{class:'pasta',open:true},
      h('summary',{},
        h('span',{class:'seta',html:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'}),
        p.nome+' ('+rs.length+')', h('span',{class:'esp'}),
        h('button',{class:'btn btn-mini',style:'width:34px;padding:5px',onclick:e=>{e.preventDefault();e.stopPropagation();ROT.menuPasta(p);}},'⋯')),
      box);
    m.appendChild(det);
    if(rs.length>1) dragOrdena(box, solta(rs));
  });
};

/* ---------- TREINO ATIVO ---------- */
const ATIVO = {
  cronI:null,
  comeca(rid){ VIB.v(30);
    if(S.ativo){ UI.vai('ativo'); return; }
    const r = rid ? S.rotinas[rid] : null;
    S.ativo = {
      id:uid(), rid:rid||null,
      titulo: r ? r.titulo : 'Treino de '+new Date().toLocaleDateString('pt-BR',{weekday:'long'}).replace('-feira',''),
      inicio: agora(),
      ex: r ? r.ex.map(e=>({ exId:e.exId, descanso:e.descanso, notas:e.notas||'', ss:e.ss||null,
        series: e.series.map(s=>({tipo:s.tipo, kg:'', reps:'', ok:false, _planKg:(s.kg!==''&&s.kg!=null?s.kg:null), _planReps:(s.reps!==''&&s.reps!=null?s.reps:null)})) })) : []
    };
    salva('ativo'); UI.pilha=[]; UI.vai('ativo',null,false);
  },
  serieAnterior(exId, si){
    const ts=Object.values(S.treinos).sort((a,b)=>b.inicio-a.inicio);
    for(const t of ts){
      const e=(t.ex||[]).find(q=>q.exId===exId);
      if(e){ const feitas=e.series.filter(s=>s.ok); return feitas[si]||null; }
    }
    return null;
  },
  marca(e, s, row){
    const x=BIB.ex(e.exId);
    const pcEx = x.e==='peso-corporal' && x.t==='peso_reps';
    if(!s.ok){
      // se o campo está vazio mas há referência (o placeholder do anterior/planejado), assume ela ao dar check
      const si0 = e.series.indexOf(s);
      const ant0 = ATIVO.serieAnterior(e.exId, si0);
      const refKg0 = (ant0 && ant0.kg!=null && ant0.kg!=='') ? ant0.kg : (s._planKg!=null? s._planKg : null);
      const refReps0 = (ant0 && ant0.reps!=null && ant0.reps!=='') ? ant0.reps : (s._planReps!=null? s._planReps : null);
      if((s.kg===''||s.kg==null) && refKg0!=null && !pcEx) s.kg=refKg0;
      if((s.reps===''||s.reps==null) && refReps0!=null) s.reps=refReps0;
      if(x.t==='peso_reps' && !pcEx && (!s.kg||!s.reps)){ UI.toast('Preencha kg e reps antes de concluir'); return; }
      if(x.t==='peso_reps' && pcEx && !s.reps){ UI.toast('Preencha as repetições antes de concluir'); return; }
      if(x.t!=='peso_reps' && !s.reps){ UI.toast('Preencha o valor antes de concluir'); return; }
      if(pcEx){ const pc=pesoCorporalAtual(); if(pc>0) s.pc=pc; if(!s.kg) s.kg=''; }
      delete s._sugKg; delete s._sugReps;
      s.ok=true; SOM.check(); VIB.v(12);
      // decidido no primeiro toque deste exercício NESTE treino e congelado.
      // Recalcular a cada série fazia a 2ª série virar "estreia" sozinha.
      if(!S.ativo._estr) S.ativo._estr={};
      if(S.ativo._estr[e.exId]===undefined){
        const _marcas=CORE.marcasDe(S.prs[e.exId]);
        S.ativo._estr[e.exId] = !_marcas.length || _marcas.every(p=> p && p.tid===S.ativo.id);
      }
      const estreia = S.ativo._estr[e.exId]; // 1ª sessão (ou 1ª depois de zerar) sem medalha
      const prs=CORE.detectaPR(S.prs, e.exId, {...s});
      if(prs.length && estreia){
        s._prBackup=JSON.parse(JSON.stringify(prs.map(([t])=>[t, (S.prs[e.exId]||{})[t]])));
        CORE.aplicaPR(S.prs, e.exId, prs, S.ativo.id, S.ativo.inicio); salva('prs');
        prs.forEach(([t])=>NET.agenda('prs/'+e.exId+'/'+t, S.prs[e.exId][t]));
        // avisa UMA vez por exercício, senão vira spam a cada série
        if(!S.ativo._avEstr) S.ativo._avEstr={};
        if(!S.ativo._avEstr[e.exId]){
          S.ativo._avEstr[e.exId]=1; salva('ativo');
          UI.toast('Primeira vez em ' + x.n + ': marca registrada. A partir do próximo treino vale medalha 🏅', true);
        }
      } else if(prs.length){
        s.pr=prs.map(p=>p[0]);
        s._prBackup=JSON.parse(JSON.stringify(prs.map(([t])=>[t, (S.prs[e.exId]||{})[t]])));  // pra reverter se cancelar
        CORE.aplicaPR(S.prs, e.exId, prs, S.ativo.id, S.ativo.inicio); salva('prs');
        prs.forEach(([t])=>NET.agenda('prs/'+e.exId+'/'+t, S.prs[e.exId][t]));
        const NOM={kg:'Maior carga', vol:'Melhor série', rm:'1RM estimado', reps:'Mais repetições'};
        // uma notificação por tipo de PR (não um textão)
        prs.forEach(([t,v],i)=>{
          const rotPr=(t==='reps'&&x.t==='tempo')?'Mais tempo':NOM[t];
          const valPr=(t==='reps')? (x.t==='tempo'? fmtTempoEx(v) : Math.round(v)+' reps') : CORE.fmtKg(v)+' kg';
          const txt='Recorde · '+x.n+': '+rotPr+' '+valPr+' 🏅';
          setTimeout(()=>UI.toast(txt, true), i*1400);
        });
        SOM.pr(); VIB.v([40,60,40]);
      }
      const ixE=S.ativo.ex.indexOf(e);
      if(e.descanso>0 && CORE.descansaApos(S.ativo.ex, ixE)) DESC.inicia(e.descanso, x.n);
      else if(e.ss && !CORE.descansaApos(S.ativo.ex, ixE)) UI.toast('Superssérie: próximo exercício');
    } else {
      s.ok=false;
      // reverter PRs que esta série havia gravado (senão o recorde some ao remarcar)
      if(s._prBackup){
        s._prBackup.forEach(([t,valAntigo])=>{
          if(!S.prs[e.exId]) return;
          if(valAntigo) S.prs[e.exId][t]=valAntigo;
          else delete S.prs[e.exId][t];
          NET.agenda('prs/'+e.exId+'/'+t, valAntigo||null);
        });
        salva('prs'); delete s._prBackup;
      }
      delete s.pr;
    }
    salva('ativo');
    if(row){ row.classList.toggle('feita', !!(s.ok||s.pr));
      const chk=row.querySelector('.scheck'); if(chk) chk.textContent = s.ok?'✓':'○';
      const stp=row.querySelector('.stipo');
      if(stp){ const tem=stp.querySelector('.prm');
        if(s.pr && s.pr.length && !tem) stp.appendChild(h('sup',{class:'prm'},MEDALHA));
        else if((!s.pr || !s.pr.length) && tem) tem.remove(); }
      row.querySelectorAll('input').forEach(inp=>{ inp.disabled=!!s.ok; if(s.ok) inp.classList.remove('sugerido'); }); }
    ATIVO.pinta();
  },
  pinta(){ // atualiza stats + progresso sem redesenhar tudo
    if(!S.ativo) return;
    const vol=CORE.volumeTreino(S.ativo), ser=CORE.seriesFeitas(S.ativo);
    const tot=(S.ativo.ex||[]).reduce((a,e)=>a+e.series.length,0);
    const el=$('#ta-vol'); if(el){
      // resumido por padrao (polui menos); toque mostra o numero cheio
      el.textContent=(S.cfg.volExato ? CORE.fmtKg(vol) : CORE.fmtKgCurto(vol))+' kg';
      el.style.fontSize = (S.cfg.volExato && vol>=10000) ? '17px' : '';
      $('#ta-ser').textContent=ser+(tot?'/'+tot:'');
      const pct = tot? Math.round(100*ser/tot) : 0;
      const sk=$('#ta-serk'); if(sk) sk.textContent = tot? ('Séries · '+pct+'%') : 'Séries';
      const rc=$('#ta-rec'); if(rc){
        const n=CORE.contaRecordes(S.ativo);
        rc.textContent = n? n+' 🏅' : '0';
      }
    }

    const d=new Date(t.inicio);

        if(foto && S.auth){ NET.agenda('/fotos/'+S.auth.uid+'/'+salvo.id, foto);
          FOTOS.cache[S.auth.uid]=FOTOS.cache[S.auth.uid]||{}; FOTOS.cache[S.auth.uid][salvo.id]=foto; }
        if(S.perfil?.user && pubAgora) NET.agenda('/feed/'+S.auth.uid+'/'+salvo.id, resumoTreino(salvo));

const PLACAS={
  disponiveis:[25,20,15,10,5,2.5,1.25],
  calc(alvo, barra){ const porLado=(alvo-barra)/2; if(porLado<-1e-9) return null;
    const out=[]; let resto=Math.max(0,porLado);
    PLACAS.disponiveis.forEach(p=>{ while(resto>=p-1e-9){ out.push(p); resto-=p; } });
    return {placas:out, sobra:Math.round(resto*200)/200, total:barra+2*(Math.max(0,porLado)-resto)};
  },
  folha(kgSug){
    const inp=h('input',{type:'text',inputmode:'decimal',value:kgSug?String(kgSug):'',placeholder:'Peso alvo (kg)'});
    const selBarra=h('div',{style:'display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap'});
    const res=h('div',{style:'margin-top:14px'});
    const pinta=()=>{
      const b=S.cfg.barraKg||20;
      selBarra.innerHTML=''; [20,15,10].forEach(bb=>selBarra.append(h('button',{class:'chip'+(b===bb?' on':''),onclick:()=>{S.cfg.barraKg=bb;salva('cfg');pinta();}},'Barra '+bb+' kg')));
      res.innerHTML='';
      const alvo=Number(String(inp.value).replace(',','.'))||0;
      if(!alvo){ res.append(h('div',{class:'f13 mut'},'Digite o peso alvo pra eu montar as anilhas.')); return; }
      const r=PLACAS.calc(alvo,b);
      if(!r){ res.append(h('div',{class:'f13 mut'},'O alvo é menor que o peso da barra ('+b+' kg).')); return; }
      const cont={}; r.placas.forEach(p=>cont[p]=(cont[p]||0)+1);
      const linha=h('div',{style:'display:flex;flex-wrap:wrap;gap:8px'});
      Object.keys(cont).map(Number).sort((a,c)=>c-a).forEach(p=>linha.append(h('div',{style:'background:var(--surf3);border-radius:10px;padding:9px 13px;font-weight:700;font-size:14px'}, cont[p]+'× '+p+' kg')));
      res.append(h('div',{class:'f13 mut',style:'margin-bottom:8px'},'Anilhas por lado:'),
        r.placas.length? linha : h('div',{class:'f13'},'Só a barra, sem anilhas.'),
        h('div',{class:'f13',style:'margin-top:12px'}, 'Total montado: '+CORE.fmtKg(r.total)+' kg'+(r.sobra>0.01? ' · faltam '+r.sobra+' kg (não fecha com as anilhas padrão)':'')));
    };
    inp.oninput=pinta;
    UI.folha('Calculadora de anilhas',[inp, selBarra, res]); pinta();
  }
};
function addAquecimento(e){
  const x=BIB.ex(e.exId);
  if(x.t!=='peso_reps'){ UI.toast('Aquecimento automático é só pra exercícios com carga'); return; }
  if(e.series.some(s=>s.tipo==='W')){ UI.toast('Esse exercício já tem séries de aquecimento'); return; }
  let base=0;
  const alvo=e.series.find(s=>s.tipo!=='W' && (s._planKg||s.kg));
  if(alvo) base=Number(alvo._planKg||alvo.kg)||0;
  if(!base && S.prs[e.exId] && S.prs[e.exId].kg) base=Number(S.prs[e.exId].kg.v)||0;
  if(!base){ UI.toast('Preencha a carga da primeira série pra eu calcular o aquecimento'); return; }
  const arr=v=>Math.max(0,Math.round(v/2.5)*2.5);
  e.series.unshift({tipo:'W', kg:String(arr(base*0.7)), reps:'4', ok:false});
  e.series.unshift({tipo:'W', kg:String(arr(base*0.5)), reps:'8', ok:false});
  salva('ativo'); UI.refaz(); UI.toast('Aquecimento: '+arr(base*0.5)+' kg × 8 e '+arr(base*0.7)+' kg × 4', true);
}
function trocaRapida(e){
  const x=BIB.ex(e.exId);
  const noTreino=new Set((S.ativo?S.ativo.ex:[]).map(q=>q.exId));
  const cls=new Set(); if(typeof ASSIST_POOLS!=='undefined') Object.values(ASSIST_POOLS).forEach(tier=>{ (tier[x.g]||[]).forEach(id=>cls.add(id)); });
  const cand=BIB.lista.filter(q=>q.g===x.g && q.t===x.t && q.id!==e.exId && !noTreino.has(q.id) && !q.oc);
  cand.sort((a,b)=>{
    const ca=cls.has(a.id)?0:1, cb=cls.has(b.id)?0:1; if(ca!==cb) return ca-cb;
    const ea=a.e===x.e?0:1, eb=b.e===x.e?0:1; if(ea!==eb) return ea-eb;
    return a.n.length-b.n.length;
  });
  const corpo=[h('div',{class:'f13 mut',style:'margin-bottom:8px'},'Alternativas rápidas de '+(GRUPOS[x.g]||x.g)+', mais parecidas primeiro:')];
  cand.slice(0,8).forEach(q=>corpo.push(h('button',{class:'menu-op',style:'gap:10px',onclick:()=>{
    e.exId=q.id; e.series.forEach(s=>{ if(!s.ok){ s.kg=''; delete s.pr; delete s._auto; delete s._sugKg; delete s._sugReps; } });
    salva('ativo'); UI.fechaFolha(); UI.refaz(); UI.toast('Trocado: '+q.n, true);
  }}, thumbEl(q.id), h('div',{class:'esp',style:'text-align:left;min-width:0'},
      h('div',{style:'font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},q.n),
      h('div',{class:'f12 mut'},String(q.e||'').replace(/-/g,' '))))));
  if(!cand.length) corpo.push(h('div',{class:'vazio'},'Sem alternativa direta desse grupo. Use "Substituir exercício".'));
  UI.folha('Aparelho ocupado?', corpo);
}

/* ===== PROJEÇÃO: "e se eu subir o peso?" (Epley invertida) ===== */
const PROJ={
  base(exId){
    const ts=Object.values(S.treinos).filter(t=>!t.apagado).sort((a,b)=>b.inicio-a.inicio);
    for(const t of ts){
      const e=(t.ex||[]).find(q=>q.exId===exId); if(!e) continue;
      let best=null;
      (e.series||[]).forEach(s=>{ if(s.tipo==='W') return;
        const kg=Number(s.kg)||0, reps=Number(s.reps)||0;
        const rm=CORE.est1RM(kg,reps); if(rm && (!best||rm>best.rm)) best={kg,reps,rm,quando:t.inicio}; });
      if(best) return best;
    }
    const p=S.prs[exId];
    if(p && p.rm && Number(p.rm.v)) return {kg:0, reps:0, rm:Number(p.rm.v), quando:null, soPR:true};
    return null;
  },
  repsCom(rm, alvo){
    if(!rm || !alvo || alvo<=0) return null;
    if(alvo>rm*1.02) return {acima:true};
    if(alvo>=rm*0.985) return {min:1, max:1, est:1, limite:true};
    const r=30*(rm/alvo-1); const c=Math.round(r);
    return {min:Math.max(1,c-1), max:c+1, est:Math.max(1,c)};
  },
  frase(r){
    if(!r) return '';
    if(r.acima) return 'Esse tá acima do seu máximo estimado hoje. Sobe degrau por degrau que você chega lá.';
    if(r.limite) return 'É praticamente o seu máximo. Se for tentar, tenta com apoio de alguém.';
    if(r.est<=2) return 'Vai ser pesado de verdade. Vale a tentativa com um parceiro por perto.';
    if(r.est<=5) return 'Vai sair! Se for exercício com barra, chama alguém pra dar segurança.';
    if(r.est<=9) return 'Dá pra encarar numa boa. Bora?';
    return 'Esse peso tá tranquilo pra você. Pode subir sem medo.';
  },
  folha(exId){
    const b=PROJ.base(exId);
    if(!b){ UI.toast('Treine esse exercício pelo menos uma vez pra eu ter base de cálculo'); return; }
    const x=BIB.ex(exId);
    const baseKg = b.kg || Math.round((b.rm/(1+8/30))*2)/2;
    const inp=h('input',{type:'text',inputmode:'decimal',placeholder:'Peso que você quer testar (kg)'});
    const chips=h('div',{style:'display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap'});
    const res=h('div',{style:'margin-top:14px'});
    const pinta=()=>{
      res.innerHTML='';
      const alvo=Number(String(inp.value).replace(',','.'))||0;
      if(!alvo){ res.append(h('div',{class:'f13 mut'},'Digite um peso ou toque num atalho aí em cima.')); return; }
      const r=PROJ.repsCom(b.rm, alvo);
      if(r.acima){ res.append(h('div',{class:'b700',style:'font-size:17px'},CORE.fmtKg(alvo)+' kg: acima do seu 1RM estimado'),
        h('div',{class:'f13 mut',style:'margin-top:6px;line-height:1.55'},PROJ.frase(r))); return; }
      res.append(
        h('div',{class:'b800',style:'font-size:22px'},CORE.fmtKg(alvo)+' kg → '+(r.limite? '1 rep (máximo)': r.min+' a '+r.max+' reps')),
        h('div',{class:'f13',style:'margin-top:8px;line-height:1.55;color:var(--tx2)'},PROJ.frase(r)));
    };
    inp.oninput=pinta;
    [2.5,5,7.5].forEach(inc=>{ const alvo=Math.round((baseKg+inc)*2)/2;
      chips.append(h('button',{class:'chip',onclick:()=>{ inp.value=String(alvo); pinta(); }},'+'+inc+' → '+alvo+' kg')); });
    UI.folha('E se eu subir o peso?',[
      h('div',{class:'f13 mut',style:'line-height:1.6;margin-bottom:4px'},
        'Sua base no '+x.n+': '+(b.soPR? ('1RM estimado de '+CORE.fmtKg(b.rm)+' kg (recorde)') :
          (CORE.fmtKg(b.kg)+' kg × '+b.reps+' reps'+(b.quando? ' ('+new Date(b.quando).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+')':'')+' · 1RM estimado ~'+CORE.fmtKg(b.rm)+' kg'))),
      inp, chips, res,
      h('div',{class:'f12 mut2',style:'margin-top:16px;line-height:1.5'},'Estimativa pela fórmula de Epley com base no seu último desempenho. Funciona melhor entre 2 e 12 repetições. Escuta teu corpo sempre.')]);
    pinta();
  }
};
const EXPORTA={
  async arquivo(nome, conteudo, mime){
    try{
      const file=new File([conteudo], nome, {type:mime});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    const url=URL.createObjectURL(new Blob([conteudo],{type:mime}));
    const a=h('a',{href:url, download:nome, style:'display:none'}); document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
  },
  csv(){
    const linhas=['data;treino;exercicio;serie;tipo;kg;reps;recorde'];
    Object.values(S.treinos).filter(t=>!t.apagado).sort((a,b)=>a.inicio-b.inicio).forEach(t=>{
      const d=new Date(t.inicio).toLocaleDateString('pt-BR');

        (e.series||[]).forEach((s,i)=>{ linhas.push([d, '"'+String(t.titulo||'').replace(/"/g,"'")+'"', '"'+String(x.n||'').replace(/"/g,"'")+'"', i+1, s.tipo||'N', String(s.kg||'').replace('.',','), s.reps||'', (s.pr&&s.pr.length)?'sim':''].join(';')); });
      });
    });
    EXPORTA.arquivo('forgex-treinos.csv', '\uFEFF'+linhas.join('\n'), 'text/csv');
  },
  json(){
    const cfg={...S.cfg}; delete cfg.pushTok;
    const dump={app:'ForgeX', versao:APP_VER, exportado:new Date().toISOString(),
      perfil:S.perfil?{nome:S.perfil.nome,user:S.perfil.user,bio:S.perfil.bio}:null,
      cfg, pastas:S.pastas, rotinas:S.rotinas, treinos:S.treinos, prs:S.prs, medidas:S.medidas, exNotas:S.exNotas,
      custom:Object.fromEntries(Object.entries(S.custom).map(([k,v])=>{ const c={...v}; delete c.foto; return [k,c]; }))};
    EXPORTA.arquivo('forgex-backup.json', JSON.stringify(dump,null,1), 'application/json');

};

/* ===== RANKING SEMANAL ENTRE AMIGOS ===== */
const RANK={
  met:'n',
  dados(){
    const w0=inicioSemana(agora()); const out=[];
    if(S.auth){
      const meus=Object.values(S.treinos).filter(t=>!t.apagado&&t.inicio>=w0);
      out.push({uid:S.auth.uid, eu:true, nome:(S.perfil&&S.perfil.nome)||'Você', foto:S.perfil&&S.perfil.foto,
        n:meus.length, vol:meus.reduce((a,t)=>a+(t.volume||0),0), rec:meus.reduce((a,t)=>a+(t.recordes||0),0)});
    }
    Object.entries(FEED.amigos||{}).forEach(([d,arr])=>{
      const da=(arr||[]).filter(r=>r&&r.inicio>=w0);
      const p=(FEED.perfis||{})[d]||{};
      const loc=(S.social&&S.social.seguindo&&S.social.seguindo[d])||{};
      const r0=(arr&&arr[0])||{};
      const bom=v=>v && v!=='Atleta';
      const nome = bom(p.nome)? p.nome : bom(r0.nome)? r0.nome : bom(loc.nome)? loc.nome :
        ((p.user||loc.user||r0.user)? '@'+(p.user||loc.user||r0.user) : 'Atleta');
      out.push({uid:d, nome, foto:p.foto||loc.foto,
        n:da.length, vol:da.reduce((a,r)=>a+(r.volume||0),0), rec:da.reduce((a,r)=>a+(r.recordes||0),0)});
    });
    return out;
  },
  ordena(ls, met){ const k=met||'n'; return ls.slice().sort((a,b)=>(b[k]-a[k]) || (b.vol-a.vol) || (b.n-a.n)); }
};
function rankMiniCard(){
  if(!S.auth || !Object.keys(S.social.seguindo||{}).length) return null;
  if(!Object.keys(FEED.amigos||{}).length) return null;
  const ls=RANK.ordena(RANK.dados(),'n').filter(x=>x.n>0);
  if(ls.length<2) return null;
  const med=['🥇','🥈','🥉'];
  const c=h('div',{class:'card',style:'cursor:pointer',onclick:()=>UI.vai('ranking')});
  c.append(h('div',{class:'linha',style:'margin-bottom:8px'},
    h('div',{class:'secao',style:'margin:0'},'🏆 Ranking da semana'), h('div',{class:'esp'}),
    h('span',{class:'f12 mut2'},'ver completo')));
  ls.slice(0,3).forEach((x,i)=>{
    c.append(h('div',{class:'linha',style:'padding:5px 0'},
      h('div',{style:'width:26px;font-size:16px'},med[i]),
      avatarEl(x.foto, x.nome, 30),
      h('div',{class:'esp b700',style:'font-size:14px;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'+(x.eu?';color:var(--brand2)':'')}, x.eu?'Você':x.nome),
      h('div',{class:'f13'}, x.n+(x.n===1?' treino':' treinos'))));
  });
  return c;
}
