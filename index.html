<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Treino Gym</title>
<meta name="description" content="Registre seus treinos de academia: rotinas, séries, cargas, recordes e evolução. Rápido, offline e sem enrolação.">
<meta name="theme-color" content="#0B0D10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Gym">
<style>
:root{
  --bg:#0B0D10; --surf:#14171C; --surf2:#1B2027; --surf3:#232A33; --line:#242B34;
  --tx:#E8ECF1; --tx2:#8B95A3; --tx3:#5B6572;
  --brand:#FF6B2C; --brand2:#FF8B4C; --brand-dim:#3A2114;
  --ok:#2ECC71; --okbg:#12351F; --warn:#F5B70A; --warnbg:#3A2E08; --err:#F05545;
  --azul:#4CC3FF; --roxo:#A78BFA;
  --r:16px; --r2:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px; overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--tx);background:var(--surf2);
  border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--brand)}
input[type=number]{-moz-appearance:textfield;text-align:center;font-weight:700;font-size:17px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
::placeholder{color:var(--tx3)}
h1,h2,h3{margin:0}
.hide{display:none!important}

/* ---------- casca ---------- */
#topo{position:fixed;top:0;left:0;right:0;z-index:40;background:linear-gradient(var(--bg) 75%,transparent);
  padding:calc(var(--sat) + 10px) 16px 14px}
.topo-in{display:flex;align-items:center;gap:10px;min-height:40px}
.topo-tit{font-size:24px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-tit small{font-size:13px;font-weight:600;color:var(--tx2);display:block;margin-top:1px}
main{padding:calc(var(--sat) + 66px) 16px calc(var(--sab) + 92px);max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 10px);z-index:45;
  display:flex;gap:4px;background:rgba(20,23,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 20px;border-radius:20px;color:var(--tx2);font-size:11.5px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--brand);background:var(--brand-dim)}
.fantasma{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.fantasma img{width:96px;height:96px;border-radius:24px}

/* ---------- componentes ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surf2);border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;font-weight:700;font-size:15.5px;width:100%}
.btn:active{transform:scale(.985)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#14100C}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#0A2413}
.btn-err{background:transparent;border-color:#4A2320;color:var(--err)}
.btn-mini{width:auto;padding:8px 14px;font-size:13.5px;border-radius:11px}
.linha{display:flex;gap:10px;align-items:center}
.esp{flex:1}
.mut{color:var(--tx2)} .mut2{color:var(--tx3)}
.f13{font-size:13px}.f12{font-size:12px}.f14{font-size:14px}.f20{font-size:20px}.b800{font-weight:800}.b700{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--brand-dim);border-color:var(--brand);color:var(--brand2)}
.secao{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:20px 2px 10px}
.thumb{width:52px;height:52px;border-radius:50%;background:#fff;flex-shrink:0;object-fit:cover;border:2px solid var(--line)}
.thumb-ini{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;background:var(--surf3);border:2px solid var(--line);color:var(--brand2)}
.item{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--surf2)}
.item:last-child{border-bottom:none}
.stats3{display:flex;gap:0;margin:4px 0 2px}
.stats3>div{flex:1}
.stats3 .k{font-size:12.5px;color:var(--tx2);font-weight:600}
.stats3 .v{font-size:17px;font-weight:800;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.badge.rec{color:var(--warn)}

/* séries */
.gtab{display:grid;grid-template-columns:44px 1fr 74px 74px 46px;gap:6px;align-items:center}
.gtab.cab{color:var(--tx3);font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 0 6px}
.srow{border-radius:11px;padding:5px 4px;margin:2px -4px}
.srow.feita{background:var(--okbg)}
.srow input{padding:9px 4px;background:var(--surf2)}
.srow.feita input{background:rgba(255,255,255,.06);border-color:transparent}
.stipo{font-weight:800;font-size:15px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surf2)}
.stipo.W{color:var(--warn)} .stipo.D{color:var(--azul)} .stipo.F{color:var(--err)} .stipo.N{color:var(--tx)}
.scheck{width:38px;height:38px;border-radius:11px;background:var(--surf2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.srow.feita .scheck{background:var(--ok);border-color:var(--ok);color:#0A2413}
.anterior{font-size:13px;color:var(--tx3);font-weight:600;text-align:center;overflow:hidden;white-space:nowrap}
.anterior.tem{color:var(--tx2)}

/* folha (bottom sheet) */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surf);border-radius:22px 22px 0 0;
  border:1px solid var(--line);border-bottom:none;max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.3,.9,.3,1);padding-bottom:var(--sab)}
.folha.on{transform:translateY(0)}
.folha-cab{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--surf2)}
.folha-corpo{overflow-y:auto;padding:12px 16px;flex:1;-webkit-overflow-scrolling:touch}
.alca{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}

/* picker */
#pk-lista .item{cursor:pointer}
.pk-filtros{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.pk-filtros .chip{white-space:nowrap;flex-shrink:0}

/* timer de descanso */
#timerbar{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 78px);z-index:50;background:var(--surf3);
  border:1px solid var(--brand);border-radius:18px;padding:10px 14px;display:none;align-items:center;gap:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timerbar.on{display:flex}
#tb-tempo{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:86px}
.tb-btn{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-weight:800;font-size:14px}
.tb-pular{background:var(--brand);border-color:var(--brand);color:#14100C}
#tb-barra{position:absolute;left:14px;right:14px;bottom:4px;height:3px;border-radius:3px;background:var(--surf2);overflow:hidden}
#tb-fill{height:100%;background:var(--brand);width:0%}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--sab) + 150px);z-index:80;
  background:var(--surf3);border:1px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:700;font-size:14.5px;
  opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.rec{border-color:var(--warn);color:var(--warn)}

/* gráfico */
canvas.graf{width:100%;height:170px;display:block}
.gtoggle{display:flex;gap:8px;margin:10px 0 2px}

/* cronômetro topo do treino */
.cron{font-variant-numeric:tabular-nums}
#ta-progresso{position:fixed;top:0;left:0;height:3px;background:var(--brand);z-index:46;width:0%;transition:width .3s}

/* detalhe exercício */
.ex-hero{width:100%;max-width:340px;aspect-ratio:1;border-radius:20px;background:#fff;display:block;margin:0 auto 12px;object-fit:cover}

/* utilidades */
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numstep{display:flex;align-items:center;gap:8px}
.numstep button{width:40px;height:40px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);font-size:19px;font-weight:800}
details.pasta{margin-bottom:10px}
details.pasta summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:6px 2px;cursor:pointer;color:var(--tx2)}
details.pasta summary::-webkit-details-marker{display:none}
details.pasta summary .seta{transition:transform .15s}
details.pasta[open] summary .seta{transform:rotate(90deg)}
.menu-op{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--surf2);font-weight:600;width:100%;text-align:left}
.menu-op:last-child{border-bottom:none}
.menu-op.perigo{color:var(--err)}
.vazio{ text-align:center;color:var(--tx3);padding:34px 20px;font-size:14.5px;line-height:1.55}
.vazio .emo{font-size:38px;display:block;margin-bottom:8px}

/* v2: feed */
.feed-cab{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--surf3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand2);flex-shrink:0}
.feed-ex{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--surf2)}
.feed-ex .thumb{width:44px;height:44px}
.vermais{color:var(--tx2);font-size:13.5px;font-weight:700;padding:10px 0 2px;width:100%;text-align:center}

/* v2: mapa muscular */
.musc .m{fill:#2A323D}
.musc .on{fill:var(--brand)}

/* v2: calendário */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem{font-size:11px;font-weight:800;color:var(--tx3);text-align:center;padding:6px 0;text-transform:uppercase}
.cal-dia{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--tx2);position:relative}
.cal-dia.fora{opacity:.28}
.cal-dia.hoje{border:1px solid var(--brand);color:var(--tx)}
.cal-dia.tem{background:var(--brand-dim);color:var(--brand2);font-weight:800}
.cal-dia .pontos{display:flex;gap:2px;position:absolute;bottom:5px}
.cal-dia .pt{width:4px;height:4px;border-radius:50%;background:var(--brand)}

/* v2: medições / estatísticas */
.med-row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--surf2)}
.med-row:last-child{border-bottom:none}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0}
.hbar .rot{width:104px;font-size:13px;font-weight:700;color:var(--tx2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trilho{flex:1;height:14px;border-radius:7px;background:var(--surf2);overflow:hidden}
.hbar .fill{height:100%;background:var(--brand);border-radius:7px}
.hbar .val{width:34px;font-size:12.5px;font-weight:800;color:var(--tx2)}
.periodo{display:flex;gap:8px;margin:0 0 6px}

/* v3: superssérie, rpe, social */
.ss-tag{font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:6px;margin-bottom:6px;display:inline-block}
.stipo{position:relative}
.stipo .rpe{position:absolute;top:-5px;right:-7px;font-size:9px;font-weight:800;color:var(--brand2);background:var(--surf);padding:0 2px;border-radius:4px}
.rpe-tag{font-size:11px;font-weight:800;color:var(--brand2);margin-left:6px}
.heart{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--tx3);font-size:13.5px;font-weight:800;padding:8px 2px 0}
.heart.on{color:var(--brand2)}
.heart svg{width:19px;height:19px}
</style>
</head>
<body>

<div id="fantasma" class="fantasma"><img src="icon-192.png" alt=""><div class="mut f14">Carregando…</div></div>

<div id="ta-progresso"></div>
<header id="topo"><div class="topo-in" id="topo-in"></div></header>

<main id="main"></main>

<div id="timerbar">
  <div id="tb-tempo">01:30</div>
  <div class="esp"></div>
  <button class="tb-btn" id="tb-m15">-15</button>
  <button class="tb-btn" id="tb-p15">+15</button>
  <button class="tb-btn tb-pular" id="tb-pular">Pular</button>
  <div id="tb-barra"><div id="tb-fill"></div></div>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
    Início</button>
  <button class="tab" data-tab="treino">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6.5 6.5v11M4 9v6M17.5 6.5v11M20 9v6M6.5 12h11"/></svg>
    Treino</button>
  <button class="tab" data-tab="perfil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5"/></svg>
    Perfil</button>
</nav>

<div class="veu" id="veu"></div>
<div class="folha" id="folha"><div class="alca"></div><div class="folha-cab" id="folha-cab"></div><div class="folha-corpo" id="folha-corpo"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   TREINO GYM — núcleo
   ============================================================ */
'use strict';

/*CORE-START*/
const CORE = {
  est1RM(kg, reps){ if(!kg||!reps) return 0; if(reps===1) return kg; return Math.round(kg*(1+reps/30)*10)/10; },
  volumeSerie(s){ return (Number(s.kg)||0) * (Number(s.reps)||0); },
  volumeTreino(t){ let v=0; (t.ex||[]).forEach(e=>(e.series||[]).forEach(s=>{ if(s.ok && s.tipo!=='W') v+=CORE.volumeSerie(s); })); return Math.round(v*10)/10; },
  seriesFeitas(t){ let n=0; (t.ex||[]).forEach(e=>(e.series||[]).forEach(s=>{ if(s.ok && s.tipo!=='W') n++; })); return n; },
  melhorSerieKg(series){ let m=null; (series||[]).forEach(s=>{ if(s.ok && s.tipo!=='W' && Number(s.kg)>0){ if(!m || Number(s.kg)>Number(m.kg) || (Number(s.kg)===Number(m.kg)&&Number(s.reps)>Number(m.reps))) m=s; } }); return m; },
  // detecta PRs de uma série concluída contra o placar atual → lista de tipos batidos
  detectaPR(prs, exId, s){
    if(!s.ok || s.tipo==='W') return [];
    const kg=Number(s.kg)||0, reps=Number(s.reps)||0, vol=CORE.volumeSerie(s), rm=CORE.est1RM(kg,reps);
    const p = prs[exId]||{};
    const bate=[];
    if(kg>0 && kg > (p.kg?p.kg.v:0)) bate.push(['kg',kg]);
    if(vol>0 && vol > (p.vol?p.vol.v:0)) bate.push(['vol',vol]);
    if(rm>0 && rm > (p.rm?p.rm.v:0)) bate.push(['rm',rm]);
    if(kg===0 && reps>0 && reps > (p.reps?p.reps.v:0)) bate.push(['reps',reps]);
    return bate;
  },
  aplicaPR(prs, exId, tipos, tid, data){
    const p = prs[exId] = prs[exId]||{};
    tipos.forEach(([t,v])=>{ p[t]={v, tid, data}; });
    return prs;
  },
  fmtDur(seg){ seg=Math.max(0,Math.round(seg)); const h=Math.floor(seg/3600), m=Math.floor(seg%3600/60), s=seg%60;
    if(h>0) return h+'h '+String(m).padStart(2,'0')+'min'; if(m>0) return m+'min '+String(s).padStart(2,'0')+'s'; return s+'s'; },
  fmtRelogio(seg){ seg=Math.max(0,Math.round(seg)); const m=Math.floor(seg/60), s=seg%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); },
  fmtKg(v){ v=Math.round((Number(v)||0)*10)/10; return v.toLocaleString('pt-BR',{maximumFractionDigits:1}); },
  semanaKey(ts){ const d=new Date(ts); const dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); d.setHours(0,0,0,0); return d.getTime(); },
  ultimasSemanas(n, agora){ const base=CORE.semanaKey(agora||Date.now()); const out=[]; for(let i=n-1;i>=0;i--) out.push(base - i*7*864e5); return out; },
  agregaSemanas(treinos, n, agora){
    const semanas=CORE.ultimasSemanas(n, agora);
    const mapa={}; semanas.forEach(w=>mapa[w]={dur:0,vol:0,ser:0,qtd:0});
    Object.values(treinos||{}).forEach(t=>{ const w=CORE.semanaKey(t.inicio); if(mapa[w]){ mapa[w].dur+=(t.fim-t.inicio)/1000; mapa[w].vol+=t.volume||0; mapa[w].ser+=t.series||0; mapa[w].qtd++; } });
    return semanas.map(w=>({w, ...mapa[w]}));
  }
};
CORE.descansaApos = function(exList, ix){
  const ss=exList[ix] && exList[ix].ss;
  if(!ss) return true;
  return !exList.slice(ix+1).some(q=>q.ss===ss);
};
CORE.recomputaPRs = function(lista){
  const prs={};
  lista.slice().sort((a,b)=>a.inicio-b.inicio).forEach(t=>{
    t.recordes=0;
    (t.ex||[]).forEach(e=>(e.series||[]).forEach(s=>{
      delete s.pr;
      const bate=CORE.detectaPR(prs, e.exId, s);
      if(bate.length){ s.pr=bate.map(b=>b[0]); CORE.aplicaPR(prs, e.exId, bate, t.id, t.inicio); t.recordes++; }
    }));
    t.volume=CORE.volumeTreino(t);
    t.series=CORE.seriesFeitas(t);
  });
  return prs;
};
const IMP = {
  parseCSV(texto){
    const linhas=[]; let campo='', linha=[], dentro=false;
    for(let i=0;i<texto.length;i++){
      const c=texto[i];
      if(dentro){
        if(c==='"'){ if(texto[i+1]==='"'){ campo+='"'; i++; } else dentro=false; }
        else campo+=c;
      } else {
        if(c==='"') dentro=true;
        else if(c===','){ linha.push(campo); campo=''; }
        else if(c==='\n'){ linha.push(campo); campo=''; if(linha.some(x=>x!=='')) linhas.push(linha); linha=[]; }
        else if(c!=='\r') campo+=c;
      }
    }
    if(campo!==''||linha.length){ linha.push(campo); if(linha.some(x=>x!=='')) linhas.push(linha); }
    if(!linhas.length) return [];
    const cab=linhas[0];
    return linhas.slice(1).map(l=>{ const o={}; cab.forEach((k,ix)=>o[k]=l[ix]??''); return o; });
  },
  MESES:{jan:0,fev:1,feb:1,mar:2,abr:3,apr:3,mai:4,may:4,jun:5,jul:6,ago:7,aug:7,set:8,sep:8,out:9,oct:9,nov:10,dez:11,dec:11},
  parseData(s){
    const m=/^(\d{1,2})\s+([A-Za-z\u00e7\u00c7]{3,4})\s+(\d{4})(?:,\s*(\d{1,2}):(\d{2}))?/.exec((s||'').trim());
    if(!m) return null;
    const mes=IMP.MESES[m[2].slice(0,3).toLowerCase()];
    if(mes==null) return null;
    return new Date(+m[3], mes, +m[1], +(m[4]||0), +(m[5]||0)).getTime();
  },
  hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); },
  TIPOS:{normal:'N', warmup:'W', dropset:'D', failure:'F'},
  montaTreinos(rows, resolveEx){
    const grupos=new Map();
    rows.forEach(r=>{
      const k=r.title+'\u0001'+r.start_time;
      if(!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(r);
    });
    const treinos=[];
    grupos.forEach((rs, k)=>{
      const r0=rs[0];
      const inicio=IMP.parseData(r0.start_time), fim=IMP.parseData(r0.end_time)||inicio;
      if(!inicio) return;
      const exMap=new Map();
      rs.forEach(r=>{
        const tt=(r.exercise_title||'').trim();
        if(!exMap.has(tt)) exMap.set(tt, {titulo:tt, notas:(r.exercise_notes||'').trim(), series:[]});
        const dur=Number(r.duration_seconds)||0;
        const kg=r.weight_kg===''?'':Number(r.weight_kg);
        const reps=dur>0? dur : (r.reps===''?'':Number(r.reps));
        exMap.get(tt).series.push({ix:Number(r.set_index)||0, tipo:IMP.TIPOS[r.set_type]||'N', kg:kg===''?'':kg, reps:reps===''?'':reps, ok:true});
      });
      const ex=[];
      exMap.forEach(e=>{
        e.series.sort((a,b)=>a.ix-b.ix);
        e.series.forEach(s=>delete s.ix);
        ex.push({exId:resolveEx(e.titulo), notas:e.notas, descanso:90, series:e.series});
      });
      treinos.push({ id:'hv_'+IMP.hash(k), titulo:r0.title, inicio, fim, ex, origem:'hevy' });
    });
    treinos.sort((a,b)=>a.inicio-b.inicio);
    return treinos;
  },
  montaMedidas(rows){
    const CAMPOS={weight_kg:'peso',fat_percent:'gordura',neck_cm:'pescoco',shoulder_cm:'ombros',chest_cm:'peito',
      left_bicep_cm:'bracoE',right_bicep_cm:'bracoD',left_forearm_cm:'antebracoE',right_forearm_cm:'antebracoD',
      abdomen_cm:'abdomen',waist_cm:'cintura',hips_cm:'quadril',left_thigh_cm:'coxaE',right_thigh_cm:'coxaD',
      left_calf_cm:'pantE',right_calf_cm:'pantD'};
    const out=[];
    rows.forEach(r=>{
      const data=IMP.parseData(r.date); if(!data) return;
      const m={id:'hv_'+IMP.hash(r.date), data, origem:'hevy'};
      let tem=false;
      Object.entries(CAMPOS).forEach(([col,campo])=>{ if(r[col]!==''&&r[col]!=null){ m[campo]=Number(r[col]); tem=true; } });
      if(tem) out.push(m);
    });
    return out.sort((a,b)=>a.data-b.data);
  }
};

  const n=dados.length, gap=n>20?2:6, bw=Math.min(34,(W-40-gap*(n-1))/n);
  const x0=(W-(bw*n+gap*(n-1)))/2, base=H-24, alt=base-16;
  c.font='10.5px -apple-system,Segoe UI,Roboto,sans-serif';
  dados.forEach((d,i)=>{
    const x=x0+i*(bw+gap), bh=Math.max(2, alt*d.v/max);
    c.fillStyle = d.v>0 ? '#FF6B2C' : '#242B34';
    c.beginPath(); c.roundRect(x, base-bh, bw, bh, 5); c.fill();
    c.fillStyle='#5B6572'; c.textAlign='center';
    if(d.rot) c.fillText(d.rot, x+bw/2, H-8);
  });
  c.fillStyle='#8B95A3'; c.textAlign='left'; c.font='600 11px -apple-system,Segoe UI,Roboto,sans-serif';
  c.fillText(formata?formata(max):String(max), 4, 14);
}
function grafLinha(canvas, pontos, formata){
  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth||320, H=canvas.clientHeight||170;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const c=canvas.getContext('2d'); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  if(!pontos.length) return;
  const vs=pontos.map(p=>p.v), max=Math.max(...vs), min=Math.min(...vs);
  const pad=18, base=H-26, topo=14, span=(max-min)||1;
  const X=i=>pad+ (W-pad*2)*(pontos.length===1?0.5:i/(pontos.length-1));
  const Y=v=>base-(base-topo)*(v-min)/span;
  c.strokeStyle='#242B34'; c.lineWidth=1;
  [0,.5,1].forEach(f=>{ const y=topo+(base-topo)*f; c.beginPath(); c.moveTo(pad,y); c.lineTo(W-pad,y); c.stroke(); });
  c.strokeStyle='#FF6B2C'; c.lineWidth=2.4; c.lineJoin='round'; c.beginPath();
  pontos.forEach((p,i)=>{ const x=X(i),y=Y(p.v); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  c.fillStyle='#FF8B4C';
  pontos.forEach((p,i)=>{ c.beginPath(); c.arc(X(i),Y(p.v),3.4,0,7); c.fill(); });
  c.fillStyle='#8B95A3'; c.font='600 11px -apple-system,Segoe UI,Roboto,sans-serif'; c.textAlign='left';
  c.fillText(formata?formata(max):String(max), 4, 12);
  c.fillText(formata?formata(min):String(min), 4, base+4);
  c.fillStyle='#5B6572'; c.font='10.5px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign='center';
  if(pontos[0].rot) c.fillText(pontos[0].rot, X(0)+10, H-8);
  const u=pontos.length-1;
  if(u>0 && pontos[u].rot) c.fillText(pontos[u].rot, X(u)-10, H-8);
}

/* ---------- picker de exercícios ---------- */
const PICKER = {
  aberto:false, filtros:{g:null,e:null}, q:'', onEscolha:null, modo:'escolher',
  abre(onEscolha, modo){
    PICKER.onEscolha=onEscolha||null; PICKER.modo=modo||'escolher';
    PICKER.q=''; PICKER.filtros={g:null,e:null};
    const corpo = [
      h('input',{id:'pk-q', placeholder:'Procurar exercício…', oninput:e=>{ PICKER.q=e.target.value; PICKER.lista(); }}),
      h('div',{class:'linha',style:'margin-top:10px;gap:8px'},
        h('button',{class:'chip',id:'pk-f-e',onclick:PICKER.filtroEquip},'Todo equipamento'),
        h('button',{class:'chip',id:'pk-f-g',onclick:PICKER.filtroGrupo},'Todos os músculos')),
      h('div',{id:'pk-lista',style:'margin-top:8px'}),
      h('div',{style:'height:8px'}),
      h('button',{class:'btn',onclick:PICKER.criarCustom},'Criar exercício personalizado')
    ];
    UI.folha(PICKER.modo==='consulta'?'Exercícios':'Adicionar exercício', corpo);
    PICKER.lista();
    setTimeout(()=>{ try{$('#pk-q').focus();}catch(e){} }, 250);
  },
  filtroEquip(){
    const ops=[[null,'Todo equipamento']].concat(Object.entries(EQUIPS));
    PICKER.menuFiltro(ops, 'e', $('#pk-f-e'), 'Todo equipamento');
  },
  filtroGrupo(){
    const ops=[[null,'Todos os músculos']].concat(Object.entries(GRUPOS));
    PICKER.menuFiltro(ops, 'g', $('#pk-f-g'), 'Todos os músculos');
  },
  menuFiltro(ops, campo, botao, padrao){
    const cont=h('div');
    ops.forEach(([v,rot])=>cont.appendChild(h('button',{class:'menu-op',onclick:()=>{
      PICKER.filtros[campo]=v; botao.textContent=v?rot:padrao; botao.classList.toggle('on',!!v);
      FOLHA2.fecha(); PICKER.lista();
    }}, rot)));
    FOLHA2.abre(campo==='e'?'Equipamento':'Músculo', [cont]);
  },
  lista(){
    const alvo=$('#pk-lista'); if(!alvo) return;
    alvo.innerHTML='';
    const res = BIB.busca(PICKER.q, PICKER.filtros);
    // recentes primeiro quando sem busca
    if(!PICKER.q && !PICKER.filtros.g && !PICKER.filtros.e){
      const rec = PICKER.recentes().filter(id=>BIB.porId[id]);
      if(rec.length){
        alvo.appendChild(h('div',{class:'secao',style:'margin-top:4px'},'Recentes'));
        rec.slice(0,6).forEach(id=>alvo.appendChild(PICKER.linha(BIB.porId[id])));
        alvo.appendChild(h('div',{class:'secao'},'Todos ('+res.length+')'));
      }
    } else {
      alvo.appendChild(h('div',{class:'secao',style:'margin-top:4px'}, res.length+' resultado'+(res.length===1?'':'s')));
    }
    const bloco=60; let mostrados=0;
    const mostra=()=>{ res.slice(mostrados, mostrados+bloco).forEach(x=>alvo.insertBefore(PICKER.linha(x), sent)); mostrados+=bloco;
      if(mostrados>=res.length) sent.remove(); };
    const sent=h('button',{class:'btn',style:'margin-top:8px',onclick:()=>mostra()},'Mostrar mais');
    alvo.appendChild(sent); mostra();
    if(!res.length) alvo.appendChild(h('div',{class:'vazio'},'Nada encontrado. Tente outro termo ou crie um exercício personalizado.'));
  },
  linha(x){
    return h('div',{class:'item',onclick:()=>{
      if(PICKER.modo==='consulta'){ UI.fechaFolha(); UI.vai('exercicio',{id:x.id}); }
      else if(PICKER.onEscolha){ const cb=PICKER.onEscolha; UI.fechaFolha(); cb(x.id); }
    }},
      thumbEl(x.id),
      h('div',{class:'esp',style:'min-width:0'},
        h('div',{class:'b700',style:'font-size:15px'}, x.n),
        h('div',{class:'f13 mut'}, GRUPOS[x.g]||x.g, x.e && x.e!=='outro' ? ' · '+(EQUIPS[x.e]||x.e) : '')),
      h('div',{class:'mut2',html:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'}));
  },
  recentes(){
    const ids=[]; const ts=Object.values(S.treinos).sort((a,b)=>b.inicio-a.inicio);
    for(const t of ts){ for(const e of (t.ex||[])){ if(!ids.includes(e.exId)) ids.push(e.exId); } if(ids.length>=10) break; }
    return ids;
  },
  criarCustom(){
    const nome=h('input',{placeholder:'Nome do exercício'});
    const selG=h('select',{}, ...Object.entries(GRUPOS).map(([v,r])=>h('option',{value:v},r)));
    const selE=h('select',{}, ...Object.entries(EQUIPS).map(([v,r])=>h('option',{value:v},r)));
    const selT=h('select',{}, h('option',{value:'peso_reps'},'Peso × repetições'), h('option',{value:'reps'},'Só repetições'), h('option',{value:'tempo'},'Tempo (segundos)'));
    FOLHA2.abre('Novo exercício', [
      h('div',{class:'f13 mut',style:'margin-bottom:6px'},'Nome'), nome,
      h('div',{class:'f13 mut',style:'margin:12px 0 6px'},'Grupo muscular'), selG,
      h('div',{class:'f13 mut',style:'margin:12px 0 6px'},'Equipamento'), selE,
      h('div',{class:'f13 mut',style:'margin:12px 0 6px'},'Tipo de registro'), selT,
      h('div',{style:'height:14px'}),
      h('button',{class:'btn btn-p',onclick:()=>{
        const n=(nome.value||'').trim(); if(!n){ UI.toast('Informe o nome do exercício'); return; }
        const id='custom__'+uid();
        S.custom[id]={id, n, g:selG.value, e:selE.value, t:selT.value, custom:true, atualizado:agora()};
        salva('custom'); NET.agenda('custom/'+id, S.custom[id]);
        BIB.lista.push(S.custom[id]); BIB.indexa();
        FOLHA2.fecha(); PICKER.lista(); UI.toast('Exercício criado ✓');
      }},'Criar exercício')
    ]);
  }
};

TELAS.treino = function(){

  if(S.ativo){
    m.appendChild(h('button',{class:'btn btn-ok',style:'margin-bottom:12px',onclick:()=>UI.vai('ativo')},

  m.appendChild(h('div',{class:'linha',style:'margin:18px 0 10px'},

    h('button',{class:'btn btn-mini',onclick:ROT.novaPasta},'＋ Pasta'),

  const rotinas=Object.values(S.rotinas).filter(r=>!r.apagada);

  const pastas=Object.values(S.pastas).filter(p=>!p.apagada).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const porPasta={}; rotinas.forEach(r=>{ (porPasta[r.pasta||'']=porPasta[r.pasta||'']||[]).push(r); });

  const desenhaRotina=r=>{
    const nomes=(r.ex||[]).map(e=>BIB.ex(e.exId).n);

      h('div',{class:'linha',onclick:()=>UI.vai('rotinaVer',{rid:r.id})},

        nomes.join(', ')||'Sem exercícios'),
      h('button',{class:'btn btn-p',onclick:()=>ATIVO.comeca(r.id)},'Iniciar rotina'));
  };

  (porPasta['']||[]).forEach(r=>m.appendChild(desenhaRotina(r)));
  pastas.forEach(p=>{
    const rs=porPasta[p.id]||[];
    const det=h('details',{class:'pasta',open:true},
      h('summary',{},
        h('span',{class:'seta',html:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'}),
        p.nome+' ('+rs.length+')', h('span',{class:'esp'}),
        h('button',{class:'btn btn-mini',style:'width:34px;padding:5px',onclick:e=>{e.preventDefault();e.stopPropagation();ROT.menuPasta(p);}},'⋯')),
      ...rs.map(desenhaRotina));
    m.appendChild(det);
  });
};

/* ---------- TREINO ATIVO ---------- */
const ATIVO = {
  cronI:null,
  comeca(rid){
    if(S.ativo){ UI.vai('ativo'); return; }
    const r = rid ? S.rotinas[rid] : null;
    S.ativo = {
      id:uid(), rid:rid||null,
      titulo: r ? r.titulo : 'Treino de '+new Date().toLocaleDateString('pt-BR',{weekday:'long'}).replace('-feira',''),
      inicio: agora(),
      ex: r ? r.ex.map(e=>({ exId:e.exId, descanso:e.descanso, notas:e.notas||'', ss:e.ss||null,
        series: e.series.map(s=>({tipo:s.tipo, kg:s.kg, reps:s.reps, ok:false})) })) : []
    };
    salva('ativo'); UI.pilha=[]; UI.vai('ativo',null,false);
  },
  serieAnterior(exId, si){
    const ts=Object.values(S.treinos).sort((a,b)=>b.inicio-a.inicio);
    for(const t of ts){
      const e=(t.ex||[]).find(q=>q.exId===exId);
      if(e){ const feitas=e.series.filter(s=>s.ok); return feitas[si]||null; }
    }
    return null;
  },
  marca(e, s){
    const x=BIB.ex(e.exId);
    if(!s.ok){
      if(x.t==='peso_reps' && (!s.kg||!s.reps)){ UI.toast('Preencha kg e reps antes de concluir'); return; }
      if(x.t!=='peso_reps' && !s.reps){ UI.toast('Preencha o valor antes de concluir'); return; }
      s.ok=true; SOM.check();
      const prs=CORE.detectaPR(S.prs, e.exId, {...s});
      if(prs.length){
        s.pr=prs.map(p=>p[0]);
        CORE.aplicaPR(S.prs, e.exId, prs, S.ativo.id, S.ativo.inicio); salva('prs');
        prs.forEach(([t])=>NET.agenda('prs/'+e.exId+'/'+t, S.prs[e.exId][t]));
        SOM.pr(); UI.toast('Recorde pessoal · '+x.n+' 🏅', true);
      }
      const ixE=S.ativo.ex.indexOf(e);
      if(e.descanso>0 && CORE.descansaApos(S.ativo.ex, ixE)) DESC.inicia(e.descanso, x.n);
      else if(e.ss && !CORE.descansaApos(S.ativo.ex, ixE)) UI.toast('Superssérie: próximo exercício');
    } else { s.ok=false; delete s.pr; }
    salva('ativo'); ATIVO.pinta();
  },
  pinta(){ // atualiza stats + progresso sem redesenhar tudo
    if(!S.ativo) return;
    const vol=CORE.volumeTreino(S.ativo), ser=CORE.seriesFeitas(S.ativo);
    const tot=(S.ativo.ex||[]).reduce((a,e)=>a+e.series.filter(s=>s.tipo!=='W').length,0);
    const el=$('#ta-vol'); if(el){ el.textContent=CORE.fmtKg(vol)+' kg'; $('#ta-ser').textContent=ser+(tot?' / '+tot:''); }
    $('#ta-progresso').style.width = tot? Math.min(100, 100*ser/tot)+'%' : '0%';
    const tm=$('#ta-musc'); if(tm){ tm.innerHTML=''; tm.appendChild(corpoSVG(gruposDoTreino(S.ativo), 92)); }
  },
  descarta(){
    UI.folha('Descartar treino?',[
      h('div',{class:'f14 mut',style:'padding:4px 2px 14px'},'As séries registradas hoje serão perdidas. Essa ação não tem volta.'),
      h('button',{class:'btn btn-err',onclick:()=>{ S.ativo=null; salva('ativo'); DESC.para(); UI.fechaFolha(); UI.pilha=[]; UI.vai('treino',null,false); }},'Descartar treino')]);
  },
  concluir(){
    const t=S.ativo;
    const feitos = t.ex.map(e=>({ ...e, series:e.series.filter(s=>s.ok) })).filter(e=>e.series.length);
    if(!feitos.length){ UI.toast('Nenhuma série concluída ainda'); return; }
    UI.folha('Concluir treino?',[
      h('div',{class:'stats3',style:'padding:6px 2px 16px'},
        h('div',{},h('div',{class:'k'},'Duração'),h('div',{class:'v'},CORE.fmtDur((agora()-t.inicio)/1000))),
        h('div',{},h('div',{class:'k'},'Volume'),h('div',{class:'v'},CORE.fmtKg(CORE.volumeTreino(t))+' kg')),
        h('div',{},h('div',{class:'k'},'Séries'),h('div',{class:'v'},CORE.seriesFeitas(t)))),
      h('button',{class:'btn btn-p',onclick:()=>{
        const fim=agora();
        const salvo={ id:t.id, rid:t.rid, titulo:t.titulo, inicio:t.inicio, fim,
          ex:feitos, volume:CORE.volumeTreino(t), series:CORE.seriesFeitas(t),
          recordes:feitos.reduce((a,e)=>a+e.series.filter(s=>s.pr).length,0), atualizado:fim };
        S.treinos[salvo.id]=salvo; salva('treinos'); NET.agenda('treinos/'+salvo.id, salvo);
        if(S.perfil?.user && S.cfg.feedPub) NET.agenda('/feed/'+S.auth.uid+'/'+salvo.id, resumoTreino(salvo));
        // sugere atualizar rotina com as cargas de hoje
        S.ativo=null; salva('ativo'); DESC.para();
        UI.fechaFolha(); UI.pilha=[]; UI.vai('inicio',null,false);
        UI.toast(salvo.recordes?('Treino salvo com '+salvo.recordes+' recorde'+(salvo.recordes>1?'s':'')+' 🏅'):'Treino salvo ✓', !!salvo.recordes);
      }},'Concluir e salvar')]);
  }
};

    h('button',{class:'btn btn-mini',style:'width:42px;padding:9px',onclick:()=>UI.vai('treino',null,false)},

  t.ex.forEach((e,ix)=>m.appendChild(cartao(e,ix)));
  m.appendChild(h('button',{class:'btn',onclick:()=>PICKER.abre(id=>{
    const x=BIB.ex(id);
    t.ex.push({exId:id, descanso:S.cfg.descanso, notas:'', series:[{tipo:'N',kg:'',reps:x.t==='tempo'?'40':'',ok:false}]});
    salva('ativo'); UI.refaz();
  })},'＋ Adicionar exercício'));

  clearInterval(ATIVO.cronI);
  ATIVO.cronI=setInterval(()=>{ const el=$('#ta-cron'); if(!el||!S.ativo){clearInterval(ATIVO.cronI);return;} el.textContent=CORE.fmtDur((agora()-S.ativo.inicio)/1000); },1000);
  ATIVO.pinta();

  function renomear(){
    const inp=h('input',{value:t.titulo});
    UI.folha('Nome do treino',[inp,h('div',{style:'height:12px'}),
      h('button',{class:'btn btn-p',onclick:()=>{ t.titulo=(inp.value||t.titulo).trim(); salva('ativo'); UI.fechaFolha(); UI.refaz(); }},'Salvar')]);
  }
  function cartao(e,ix){
    const x=BIB.ex(e.exId);
    const rot=TIPO_ROTULO[x.t]||TIPO_ROTULO.peso_reps;
    const card=h('div',{class:'card'});
    const sstag=SS.aplica(card, t.ex, e); if(sstag) card.append(sstag);
    card.append(
      h('div',{class:'linha',style:'margin-bottom:6px'},
        thumbEl(e.exId),
        h('div',{class:'esp',style:'min-width:0'},
          h('div',{class:'b700',style:'color:var(--brand2);font-size:15.5px',onclick:()=>UI.vai('exercicio',{id:e.exId})}, x.n),
          h('div',{class:'f12 mut'}, GRUPOS[x.g]||x.g)),
        h('button',{class:'btn btn-mini',style:'width:38px',onclick:()=>menuEx(e,ix)},'⋯')),
      h('input',{placeholder:'Notas…',value:e.notas||'',oninput:ev=>{e.notas=ev.target.value;salva('ativo');},style:'margin-bottom:8px;font-size:14px'}),
      h('div',{class:'linha f13',style:'color:var(--azul);margin-bottom:6px',onclick:()=>mudaDescanso(e)},'⏱ Descanso: '+(e.descanso>0?CORE.fmtDur(e.descanso):'desligado')),
      h('div',{class:'gtab cab'},h('div',{},'Série'),h('div',{style:'text-align:center'},'Anterior'),h('div',{style:'text-align:center'},rot[0]),h('div',{style:'text-align:center'},rot[1]),h('div',{style:'text-align:center'},'✓')),
      ...e.series.map((s,si)=>linha(e,s,si,x)),
      h('button',{class:'btn btn-mini',style:'width:100%;margin-top:8px',onclick:()=>{
        const ult=e.series.at(-1)||{}; e.series.push({tipo:'N',kg:ult.kg||'',reps:ult.reps||'',ok:false}); salva('ativo'); UI.refaz(); }},'＋ Adicionar série'));
    return card;
  }
  function linha(e,s,si,x){
    const numerada=e.series.filter(q=>q.tipo!=='W').indexOf(s)+1;
    const ant=ATIVO.serieAnterior(e.exId, si);
    const antTxt = ant ? (x.t==='peso_reps' ? CORE.fmtKg(ant.kg)+'kg × '+ant.reps : ant.reps+(x.t==='tempo'?'s':' reps')) : '—';
    const row=h('div',{class:'gtab srow'+(s.ok?' feita':'')},
      h('button',{class:'stipo '+s.tipo,onclick:()=>{ if(!s.ok) tipoRpe(s); }},
        s.tipo==='N'?String(numerada||1):s.tipo, s.rpe? h('sup',{class:'rpe'},String(s.rpe)):null),
      h('div',{class:'anterior'+(ant?' tem':''),onclick:()=>{ if(ant&&!s.ok){ s.kg=ant.kg; s.reps=ant.reps; salva('ativo'); UI.refaz(); } }}, antTxt),
      x.t==='peso_reps'
        ? h('input',{type:'number',inputmode:'decimal',value:s.kg,placeholder:ant?String(ant.kg):'kg',oninput:ev=>{s.kg=ev.target.value;salva('ativo');ATIVO.pinta();},disabled:s.ok})
        : h('div',{class:'anterior'},'—'),
      h('input',{type:'number',inputmode:'numeric',value:s.reps,placeholder:ant?String(ant.reps):(x.t==='tempo'?'seg':'reps'),oninput:ev=>{s.reps=ev.target.value;salva('ativo');ATIVO.pinta();},disabled:s.ok}),
      h('button',{class:'scheck',onclick:()=>ATIVO.marca(e,s)}, s.ok?'✓':(s.pr?'🏅':'○')));
    if(s.pr) row.classList.add('feita');
    return row;
  }
  function mudaDescanso(e){
    const ops=[0,30,45,60,75,90,120,150,180,240,300];
    UI.folha('Descanso entre séries',[h('div',{},...ops.map(v=>h('button',{class:'menu-op',onclick:()=>{e.descanso=v;salva('ativo');UI.fechaFolha();UI.refaz();}}, v===0?'Desligado':CORE.fmtDur(v))))]);
  }
  function tipoRpe(s){
    const chip=(v)=>h('button',{class:'chip'+(s.rpe===v?' on':''),onclick:()=>{ if(s.rpe===v) delete s.rpe; else s.rpe=v; salva('ativo'); UI.fechaFolha(); UI.refaz(); }},String(v));
    UI.folha('Série',[
      h('div',{class:'f13 mut',style:'margin-bottom:6px'},'Tipo'),
      h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px'},
        ...[['N','Normal'],['W','Aquecimento'],['D','Drop set'],['F','Falha']].map(([v,rot])=>
          h('button',{class:'chip'+(s.tipo===v?' on':''),onclick:()=>{ s.tipo=v; salva('ativo'); UI.fechaFolha(); UI.refaz(); }},rot))),
      h('div',{class:'f13 mut',style:'margin-bottom:6px'},'Esforço (RPE)'),
      h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
        ...[6,7,7.5,8,8.5,9,9.5,10].map(chip),
        s.rpe? h('button',{class:'chip',onclick:()=>{ delete s.rpe; salva('ativo'); UI.fechaFolha(); UI.refaz(); }},'Limpar'):null)
    ]);
  }
  function menuEx(e,ix){
    UI.folha(BIB.ex(e.exId).n,[
      ix<t.ex.length-1 ? h('button',{class:'menu-op',onclick:()=>{ SS.liga(t.ex,ix); salva('ativo'); UI.fechaFolha(); UI.refaz(); }},'Superssérie com o próximo') : null,
      e.ss ? h('button',{class:'menu-op',onclick:()=>{ SS.solta(t.ex,ix); salva('ativo'); UI.fechaFolha(); UI.refaz(); }},'Remover da superssérie') : null,
      h('button',{class:'menu-op',onclick:()=>{ UI.fechaFolha(); PICKER.abre(id=>{ e.exId=id; e.series.forEach(s=>{s.ok=false;delete s.pr;}); salva('ativo'); UI.refaz(); }); }},'Substituir exercício'),
      h('button',{class:'menu-op',onclick:()=>{ if(ix>0){[t.ex[ix-1],t.ex[ix]]=[t.ex[ix],t.ex[ix-1]];salva('ativo');UI.fechaFolha();UI.refaz();} }},'Mover para cima'),
      h('button',{class:'menu-op',onclick:()=>{ if(ix<t.ex.length-1){[t.ex[ix+1],t.ex[ix]]=[t.ex[ix],t.ex[ix+1]];salva('ativo');UI.fechaFolha();UI.refaz();} }},'Mover para baixo'),
      h('button',{class:'menu-op perigo',onclick:()=>{ t.ex.splice(ix,1); salva('ativo'); UI.fechaFolha(); UI.refaz(); }},'Remover do treino')
    ]);
  }
};

    const e=(t.ex||[]).find(q=>q.exId===id);

  if(hist.length){
    const pontos=hist.filter(hh=>hh.melhor).map(hh=>({v:Number(hh.melhor.kg), rot:new Date(hh.t.inicio).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}));

    const cardH=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 6px'},'Histórico'));
    hist.slice(-15).reverse().forEach(({t,e})=>{
      cardH.append(h('div',{style:'padding:8px 0;border-bottom:1px solid var(--surf2)'},
        h('div',{class:'linha'},h('div',{class:'f13 b700'},dataCurta(t.inicio)),h('div',{class:'esp'}),h('div',{class:'f12 mut2'},t.titulo)),
        h('div',{class:'f14 mut',style:'margin-top:4px'},
          e.series.map(s=> x.t==='peso_reps'? CORE.fmtKg(s.kg)+'×'+s.reps : s.reps+(x.t==='tempo'?'s':'')).join('  ·  '))));
    });
    m.appendChild(cardH);
  } else {
    m.appendChild(h('div',{class:'vazio'},'Sem registros ainda. Assim que você treinar esse exercício, a evolução aparece aqui.'));
  }
};

/* ---------- superséries ---------- */
const SS = {
  CORES:['#FF6B2C','#00A8E1','#3ECF6E','#B07CFF','#FF5C8A'],
  cor(g){ return SS.CORES[(g-1)%SS.CORES.length]; },
  liga(list, ix){
    if(ix>=list.length-1) return false;
    const a=list[ix], b=list[ix+1];
    const g=a.ss||b.ss||(Math.max(0,...list.map(q=>q.ss||0))+1);
    a.ss=g; b.ss=g; return true;
  },
  solta(list, ix){
    const g=list[ix].ss; if(!g) return;
    delete list[ix].ss;
    const resto=list.filter(q=>q.ss===g);
    if(resto.length===1) delete resto[0].ss;
  },
  rotulo(list, e){
    const gs=[...new Set(list.filter(q=>q.ss).map(q=>q.ss))];
    const i=gs.indexOf(e.ss);
    return i<0?'':String.fromCharCode(65+i);
  },
  aplica(card, list, e){
    if(!e.ss) return null;
    const c=SS.cor(e.ss);
    card.style.borderLeft='3px solid '+c;
    return h('div',{class:'ss-tag',style:'background:'+c+'22;color:'+c},'SUPERSSÉRIE '+SS.rotulo(list,e));
  }
};

/* ---------- data relativa ---------- */
function dataRelativa(ts){
  const d=new Date(ts), hoje=new Date(); d.setHours(0,0,0,0);
  const h0=new Date(); h0.setHours(0,0,0,0);
  const dias=Math.round((h0-d)/864e5);
  if(dias===0) return 'Hoje';
  if(dias===1) return 'Ontem';
  if(dias<7){ const s=new Date(ts).toLocaleDateString('pt-BR',{weekday:'long'}); return s[0].toUpperCase()+s.slice(1); }
  const mes=new Date(ts).toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
  return mes + (new Date(ts).getFullYear()!==hoje.getFullYear() ? ' de '+new Date(ts).getFullYear() : '');
}

function cartaoFeed(i){
  const t=i.meu? i.t : i.r;
  const nome=i.meu? (S.perfil?.nome||'Você') : (t.nome||'Atleta');
  const user=i.meu? S.perfil?.user : t.user;
  const exs=i.meu? (t.ex||[]).map(e=>({n:BIB.ex(e.exId).n, s:e.series.length, id:e.exId})) : (t.ex||[]);
  const card=h('div',{class:'card'});
  const linhaEx=e=>h('div',{class:'feed-ex'}, e.id? thumbEl(e.id) : thumbNome(e.n),
    h('div',{class:'b700',style:'font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},
      e.s+' série'+(e.s===1?'':'s')+' × '+e.n));
  const lista=h('div',{}, ...exs.slice(0,3).map(linhaEx));
  card.append(
    h('div',{class:'feed-cab'},
      h('div',{class:'avatar'},(nome[0]||'?').toUpperCase()),
      h('div',{},h('div',{class:'b700',style:'font-size:14.5px'},nome, user? h('span',{class:'f12 mut2',style:'font-weight:600'},' · @'+user):null),
        h('div',{class:'f12 mut2'},dataRelativa(t.inicio)))),
    h('div',{class:'b800',style:'font-size:17px;margin:2px 0 10px'},t.titulo),
    h('div',{class:'stats3',style:'margin-bottom:8px'},
      h('div',{},h('div',{class:'k'},'Tempo'),h('div',{class:'v',style:'font-size:15px'},CORE.fmtDur((t.fim-t.inicio)/1000))),
      h('div',{},h('div',{class:'k'},'Volume'),h('div',{class:'v',style:'font-size:15px'},CORE.fmtKg(t.volume)+' kg')),
      h('div',{},h('div',{class:'k'},'Recordes'),h('div',{class:'v',style:'font-size:15px'},t.recordes? h('span',{class:'badge rec'},'🏅 '+t.recordes):'—'))),
    lista);
  if(exs.length>3){
    const btn=h('button',{class:'vermais',onclick:e=>{ e.stopPropagation(); exs.slice(3).forEach(x=>lista.appendChild(linhaEx(x))); btn.remove(); }},
      'Ver os '+exs.length+' exercícios');
    card.appendChild(btn);
  }
  // curtir
  const dono=i.dono, tid=i.id;
  const likes=()=>((FEED.curt[dono]||{})[tid])||{};
  const euCurti=()=>!!(S.auth && likes()[S.auth.uid]);
  const heart=h('button',{class:'heart',onclick:async ev=>{
    ev.stopPropagation();
    if(!S.perfil?.user){ UI.toast('Crie sua conta com e-mail para curtir'); return; }
    const on=!euCurti();
    try{
      await NET.putD('/curtidas/'+dono+'/'+tid+'/'+S.auth.uid, on? true : null);
      FEED.curt[dono]=FEED.curt[dono]||{}; FEED.curt[dono][tid]=FEED.curt[dono][tid]||{};
      if(on) FEED.curt[dono][tid][S.auth.uid]=true; else delete FEED.curt[dono][tid][S.auth.uid];
      pintaHeart();
    }catch(e){ UI.toast('Sem conexão agora'); }
  }});
  const pintaHeart=()=>{
    const n=Object.keys(likes()).length;
    heart.className='heart'+(euCurti()?' on':'');
    heart.innerHTML=svgCoracao(euCurti())+'<span>'+(n? n : 'Curtir')+'</span>';
  };
  pintaHeart();
  card.appendChild(heart);
  if(i.meu) card.addEventListener('click',()=>UI.vai('treinoDet',{id:tid}));
  return card;
}

  const prim=new Date(CAL.y,CAL.m,1);
  const off=(prim.getDay()+6)%7;
  const nDias=new Date(CAL.y,CAL.m+1,0).getDate();
  const hj=new Date();
  for(let i=0;i<off;i++) grid.appendChild(h('div',{class:'cal-dia fora'}));
  for(let d=1;d<=nDias;d++){
    const k=CAL.y+'-'+CAL.m+'-'+d;
    const lista=porDia[k]||[];
    const el=h('div',{class:'cal-dia'+(lista.length?' tem':'')+((hj.getDate()===d&&hj.getMonth()===CAL.m&&hj.getFullYear()===CAL.y)?' hoje':'')}, String(d));
    if(lista.length){
      el.appendChild(h('div',{class:'pontos'},...lista.slice(0,3).map(()=>h('div',{class:'pt'}))));
      el.addEventListener('click',()=>{
        if(lista.length===1) UI.vai('treinoDet',{id:lista[0].id});
        else UI.folha(new Date(CAL.y,CAL.m,d).toLocaleDateString('pt-BR',{day:'numeric',month:'long'}),
          lista.map(t=>h('button',{class:'menu-op',onclick:()=>{UI.fechaFolha();UI.vai('treinoDet',{id:t.id});}},t.titulo+' · '+CORE.fmtKg(t.volume)+' kg')));
      });
    }
    grid.appendChild(el);
  }
  m.appendChild(h('div',{class:'card'},grid));
  const noMes=ts.filter(t=>{ const d=new Date(t.inicio); return d.getFullYear()===CAL.y&&d.getMonth()===CAL.m; });
  m.appendChild(h('div',{class:'card'},h('div',{class:'stats3'},
    h('div',{},h('div',{class:'k'},'Treinos no mês'),h('div',{class:'v'},noMes.length)),
    h('div',{},h('div',{class:'k'},'Volume'),h('div',{class:'v'},CORE.fmtKg(noMes.reduce((a,t)=>a+(t.volume||0),0))+' kg')),
    h('div',{},h('div',{class:'k'},'Tempo'),h('div',{class:'v'},CORE.fmtDur(noMes.reduce((a,t)=>a+(t.fim-t.inicio)/1000,0)))))));
};

/* ---------- ESTATÍSTICAS ---------- */
TELAS.stats = function(){
  UI.topo(UI.btVoltar(), h('div',{class:'topo-tit',style:'font-size:20px'},'Estatísticas'));
  const m=$('#main'); m.innerHTML='';
  const ts=Object.values(S.treinos).filter(t=>!t.apagado);
  const tempoTotal=ts.reduce((a,t)=>a+(t.fim-t.inicio)/1000,0);
  m.appendChild(h('div',{class:'card'},
    h('div',{class:'stats3',style:'margin-bottom:12px'},
      h('div',{},h('div',{class:'k'},'Treinamentos'),h('div',{class:'v'},ts.length)),
      h('div',{},h('div',{class:'k'},'Tempo total'),h('div',{class:'v'},Math.round(tempoTotal/3600)+' h')),
      h('div',{},h('div',{class:'k'},'Recordes'),h('div',{class:'v'},ts.reduce((a,t)=>a+(t.recordes||0),0)))),
    h('div',{class:'stats3'},
      h('div',{},h('div',{class:'k'},'Volume total'),h('div',{class:'v'},CORE.fmtKg(ts.reduce((a,t)=>a+(t.volume||0),0))+' kg')),
      h('div',{},h('div',{class:'k'},'Séries'),h('div',{class:'v'},ts.reduce((a,t)=>a+(t.series||0),0))),
      h('div',{},h('div',{class:'k'},'Exercícios'),h('div',{class:'v'},new Set(ts.flatMap(t=>(t.ex||[]).map(e=>e.exId))).size)))));

  const corte=agora()-28*864e5;
  const porGrupo={};
  ts.filter(t=>t.inicio>=corte).forEach(t=>(t.ex||[]).forEach(e=>{
    const feitas=e.series.filter(s=>s.ok&&s.tipo!=='W').length; if(!feitas) return;
    const g=BIB.ex(e.exId).g;
    porGrupo[g]=(porGrupo[g]||0)+feitas;
  }));
  const ordenado=Object.entries(porGrupo).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const card=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 10px'},'Séries por grupo · últimas 4 semanas'));
  if(ordenado.length){
    const max=ordenado[0][1];
    ordenado.forEach(([g,n])=>card.append(h('div',{class:'hbar'},
      h('div',{class:'rot'},GRUPOS[g]||g),
      h('div',{class:'trilho'},h('div',{class:'fill',style:'width:'+Math.round(100*n/max)+'%'})),
      h('div',{class:'val'},n))));
  } else card.append(h('div',{class:'f13 mut'},'Sem séries nas últimas 4 semanas.'));
  m.appendChild(card);

  const card2=h('div',{class:'card'},h('div',{class:'secao',style:'margin:0 0 8px'},'Frequência · 12 semanas'));
  const cv=h('canvas',{class:'graf'}); card2.append(cv); m.appendChild(card2);
  const dados=CORE.agregaSemanas(Object.fromEntries(ts.map(t=>[t.id,t])), 12, agora());
  requestAnimationFrame(()=>grafBarras(cv,dados.map((d,i)=>({v:d.qtd, rot:(i%2===0)?new Date(d.w).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''})),v=>v+'x'));
};

/* ---------- CONTA (e-mail) ---------- */
const CONTA = {
  wipeLocal(){
    ['rotinas','pastas','treinos','prs','custom','medidas'].forEach(k=>{ S[k]={}; salva(k); });
    S.fila=[]; salva('fila'); S.social={seguindo:{}}; salva('social');
    S.perfil=null; salva('perfil');
  },
  folhaCriar(){
    const em=h('input',{type:'email',placeholder:'seu@email.com',autocapitalize:'off',autocomplete:'email'});
    const se=h('input',{type:'password',placeholder:'Mínimo 6 caracteres',autocomplete:'new-password'});
    const us=h('input',{placeholder:'ex.: chris_mello',autocapitalize:'off'});
    UI.folha('Criar conta',[
      h('div',{class:'f13 mut',style:'margin-bottom:12px;line-height:1.6'},'Tudo que já está neste aparelho continua na conta. Com e-mail você entra de qualquer lugar e libera o feed com amigos.'),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'E-mail'), em, h('div',{style:'height:10px'}),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Senha'), se, h('div',{style:'height:10px'}),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Nome de usuário (para amigos te acharem)'), us, h('div',{style:'height:14px'}),
      h('button',{class:'btn btn-p',onclick:async function(){
        const email=em.value.trim(), senha=se.value, u=us.value.trim().toLowerCase().replace('@','');
        if(!/^[a-z0-9_]{3,20}$/.test(u)){ UI.toast('Usuário: 3 a 20 letras minúsculas, números ou _'); return; }
        if(!email.includes('@') || senha.length<6){ UI.toast('Confira e-mail e senha'); return; }
        this.disabled=true; this.textContent='Criando…';
        try{
          const dono=await NET.get('/usernames/'+u);
          if(dono && dono!==S.auth.uid) throw new Error('Esse nome de usuário já está em uso.');
          await NET.criarConta(email, senha);
          await NET.putD('/usernames/'+u, S.auth.uid);
          await NET.putD('/perfis/'+S.auth.uid, {nome:S.perfil?.nome||'Atleta', user:u, atualizado:agora()});
          if(!S.perfil) S.perfil={criado:agora(), nome:'Atleta'};
          S.perfil.email=email; S.perfil.user=u; S.perfil.atualizado=agora();
          salva('perfil'); NET.agenda('app/perfil',S.perfil);
          S.cfg.feedPub=true; S.cfg.atualizado=agora(); salva('cfg'); NET.agenda('app/cfg',S.cfg);
          UI.fechaFolha(); UI.refaz(); UI.toast('Conta criada ✓', true);
        }catch(err){ UI.toast(err.message||'Erro ao criar conta'); this.disabled=false; this.textContent='Criar conta'; }
      }},'Criar conta')]);
  },
  folhaEntrar(){
    const em=h('input',{type:'email',placeholder:'seu@email.com',autocapitalize:'off',autocomplete:'email'});
    const se=h('input',{type:'password',placeholder:'Senha',autocomplete:'current-password'});
    UI.folha('Entrar',[
      h('div',{class:'f13',style:'margin-bottom:12px;line-height:1.6;color:var(--warn)'},'Atenção: entrar em uma conta substitui os dados locais deste aparelho pelos dados da conta.'),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'E-mail'), em, h('div',{style:'height:10px'}),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Senha'), se, h('div',{style:'height:14px'}),
      h('button',{class:'btn btn-p',onclick:async function(){
        const email=em.value.trim(), senha=se.value;
        if(!email.includes('@') || !senha){ UI.toast('Preencha e-mail e senha'); return; }
        this.disabled=true; this.textContent='Entrando…';
        try{
          const auth=await NET.entrar(email, senha);
          CONTA.wipeLocal();
          S.auth=auth; salva('auth');
          await NET.puxa();
          if(!S.perfil) S.perfil={nome:'Atleta', criado:agora()};
          S.perfil.email=email; S.perfil.atualizado=agora(); salva('perfil');
          location.reload();
        }catch(err){ UI.toast(err.message||'Erro ao entrar'); this.disabled=false; this.textContent='Entrar'; }
      }},'Entrar'),
      h('button',{class:'btn',style:'margin-top:8px',onclick:async ()=>{
        const email=em.value.trim();
        if(!email.includes('@')){ UI.toast('Digite o e-mail acima primeiro'); return; }
        try{ await NET.resetSenha(email); UI.toast('Enviei o link de redefinição para '+email, true); }
        catch(err){ UI.toast(err.message); }
      }},'Esqueci a senha')]);
  },
  sair(){
    UI.folha('Sair da conta?',[
      h('div',{class:'f14 mut',style:'padding:4px 2px 14px;line-height:1.6'},'Os dados continuam salvos na conta e voltam quando você entrar de novo. Este aparelho recomeça zerado.'),
      h('button',{class:'btn btn-err',onclick:()=>{
        Object.keys(localStorage).filter(k=>k.startsWith('tg_')).forEach(k=>localStorage.removeItem(k));
        location.reload();
      }},'Sair e limpar este aparelho')]);
  }
};

    ex:(t.ex||[]).map(e=>({n:BIB.ex(e.exId).n, s:e.series.length})), atualizado:agora() };
}
const AMIGOS = {
  folha(){
    if(!S.perfil?.user){
      UI.folha('Amigos',[
        h('div',{class:'f14 mut',style:'padding:4px 2px 14px;line-height:1.6'},'Para seguir amigos e aparecer no feed deles, crie sua conta com e-mail e escolha um nome de usuário.'),
        h('button',{class:'btn btn-p',onclick:()=>{ UI.fechaFolha(); CONTA.folhaCriar(); }},'Criar conta')]);

    }
    const inp=h('input',{placeholder:'nome_de_usuario do amigo',autocapitalize:'off'});

    const lista=h('div',{});

      h('div',{class:'avatar',style:'width:36px;height:36px;font-size:15px'},(p.nome||p.user||'?')[0].toUpperCase()),

    };
    UI.folha('Amigos',[
      h('div',{class:'f13 mut',style:'margin-bottom:8px'},'Seu usuário: ',h('span',{class:'b700',style:'color:var(--tx)'},'@'+S.perfil.user)),
      h('div',{style:'display:flex;gap:8px'}, inp,
        h('button',{class:'btn btn-p',style:'width:auto;padding:0 16px',onclick:async ()=>{
          const u=inp.value.trim().toLowerCase().replace('@','');

          res.innerHTML=''; res.append(row(uid,{user:u,nome:p.nome||''}, !!S.social.seguindo[uid]));

  },
  async deixar(uid){
    await NET.putD('/seguindo/'+S.auth.uid+'/'+uid,null);
    await NET.putD('/seguidores/'+uid+'/'+S.auth.uid,null);
    delete S.social.seguindo[uid]; salva('social');

const FEED = {
  amigos:{}, curt:{},
  async carrega(){
    if(!S.auth) return;
    const donos=[S.auth.uid].concat(Object.keys(S.social.seguindo||{}));
    await Promise.all(donos.map(async d=>{
      FEED.curt[d]=await NET.get('/curtidas/'+d)||{};
      if(d!==S.auth.uid) FEED.amigos[d]=Object.values(await NET.get('/feed/'+d+'?orderBy=%22inicio%22&limitToLast=40')||{});
    }));
  },
  itens(){
    const meus=Object.values(S.treinos).filter(t=>!t.apagado).map(t=>({meu:true,dono:S.auth?.uid,t,id:t.id,inicio:t.inicio}));
    const dos=Object.entries(FEED.amigos).flatMap(([d,arr])=>(arr||[]).map(r=>({meu:false,dono:d,r,id:r.id,inicio:r.inicio})));
    return meus.concat(dos).sort((a,b)=>b.inicio-a.inicio).slice(0,80);
  }
};

/* ---------- IMPORTADOR HEVY ---------- */
const HEVYIMP = {
  pede(tipo){
    const inp=h('input',{type:'file', accept:'.csv,text/csv', style:'display:none'});
    inp.addEventListener('change',()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ try{ tipo==='treinos'? HEVYIMP.previewTreinos(r.result) : HEVYIMP.previewMedidas(r.result); }
        catch(e){ UI.toast('Não consegui ler esse arquivo'); } };
      r.readAsText(f,'utf-8');
    });
    document.body.appendChild(inp); inp.click(); setTimeout(()=>inp.remove(),60000);
  },
  resolve(titulo, criados){
    const tt=(titulo||'').trim();
    if(HEVY_MAPA[tt]) return HEVY_MAPA[tt];
    const jaCustom=Object.values(S.custom).find(c=>c.hevy===tt);
    if(jaCustom) return jaCustom.id;
    const nv=HEVY_NOVOS[tt]||{n:tt,g:'corpo-inteiro',e:'outro',t:'peso_reps'};
    const id='custom__hv-'+BIB.norm(nv.n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    if(!S.custom[id]) criados.push(nv.n);
    S.custom[id]=Object.assign({id, custom:true, hevy:tt, atualizado:agora()}, nv);
    return id;
  },
  previewTreinos(texto){
    const rows=IMP.parseCSV(texto);
    if(!rows.length || !('exercise_title' in rows[0])){ UI.toast('Esse não parece ser o workout_data.csv do Hevy'); return; }
    const criados=[];
    const treinos=IMP.montaTreinos(rows, t=>HEVYIMP.resolve(t, criados));
    const novosT=treinos.filter(t=>!S.treinos[t.id]);
    UI.folha('Importar do Hevy',[
      h('div',{class:'f14',style:'line-height:1.8;padding:2px 2px 12px'},
        h('div',{},h('span',{class:'b800'},String(treinos.length)),' treinos no arquivo'),
        h('div',{},h('span',{class:'b800',style:'color:var(--ok)'},String(novosT.length)),' novos serão importados'),
        treinos.length-novosT.length>0? h('div',{class:'mut'},(treinos.length-novosT.length)+' já existiam (ignorados)'):null,
        criados.length? h('div',{},h('span',{class:'b800'},String(criados.length)),' exercícios novos serão criados: ',h('span',{class:'f13 mut'},criados.join(', '))):null,
        h('div',{class:'f13 mut',style:'margin-top:8px'},'Os recordes pessoais serão recalculados considerando todo o histórico.')),
      h('button',{class:'btn btn-p',onclick:()=>{
        novosT.forEach(t=>{ t.atualizado=t.fim; S.treinos[t.id]=t; });
        const prs=CORE.recomputaPRs(Object.values(S.treinos).filter(t=>!t.apagado));
        S.prs=prs;
        salva('custom'); salva('treinos'); salva('prs');
        BIB.lista=BIB.lista.filter(x=>!x.custom).concat(Object.values(S.custom)); BIB.indexa();
        Object.values(S.custom).forEach(c=>NET.agenda('custom/'+c.id,c));
        novosT.forEach(t=>NET.agenda('treinos/'+t.id,t));
        NET.agenda('prs',S.prs);
        UI.fechaFolha(); UI.pilha=[]; UI.vai('inicio',null,false);
        UI.toast(novosT.length+' treinos importados');
      }}, novosT.length? 'Importar '+novosT.length+' treinos':'Nada novo para importar')
    ]);
  },
  previewMedidas(texto){
    const rows=IMP.parseCSV(texto);
    if(!rows.length || !('date' in rows[0])){ UI.toast('Esse não parece ser o measurement_data.csv do Hevy'); return; }
    const meds=IMP.montaMedidas(rows);
    const novas=meds.filter(x=>!S.medidas[x.id]);
    UI.folha('Importar medidas',[
      h('div',{class:'f14',style:'line-height:1.8;padding:2px 2px 12px'},
        h('div',{},h('span',{class:'b800'},String(meds.length)),' registros no arquivo · ',
          h('span',{class:'b800',style:'color:var(--ok)'},String(novas.length)),' novos')),
      h('button',{class:'btn btn-p',onclick:()=>{
        novas.forEach(x=>{ x.atualizado=agora(); S.medidas[x.id]=x; NET.agenda('medidas/'+x.id,x); });
        salva('medidas'); UI.fechaFolha(); UI.refaz(); UI.toast(novas.length+' registros importados');
      }}, novas.length? 'Importar '+novas.length+' registros':'Nada novo para importar')
    ]);
  }
};

/* ---------- inicialização ---------- */
(async function boot(){
  try{ await BIB.carrega(); }catch(e){}
  $('#fantasma').remove();
  if(!S.perfil || !S.perfil.nome){ UI.vai('boasVindas',null,false); }
  else if(S.ativo){ UI.vai('ativo',null,false); }
  else UI.vai('inicio',null,false);
  // rede em segundo plano
  (async()=>{ try{ if(!S.auth && S.perfil) await NET.signup(); await NET.puxa(); NET.despacha(); }catch(e){} })();
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
