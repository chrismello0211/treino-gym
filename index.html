function corrigeTiposCustoms(){
  const LOAD=['anilha','halter','barra','maquina','cabo','kettlebell','smith','polia','barra-w'];
  const CARDIO_KW=['esteira','corrida','correr','bike','bicicleta','elíptico','eliptico','escada rolante','stairmaster','remo ergom','spinning','airbike'];
  let n=0;
  Object.values(S.custom||{}).forEach(c=>{
    if(!c) return;
    const e=(c.e||'').toLowerCase();
    const nome=(c.n||'').toLowerCase();
    // carga preso em "só reps" -> peso_reps
    if(c.t==='reps' && LOAD.includes(e)){ c.t='peso_reps'; c.atualizado=agora(); NET.agenda('custom/'+c.id, c); n++; return; }
    // cardio do grupo cardio (ou nome clássico) preso em reps/peso_reps -> tempo
    if(c.t!=='tempo' && (c.g==='cardio' || CARDIO_KW.some(k=>nome.includes(k)))){
      c.t='tempo'; c.atualizado=agora(); NET.agenda('custom/'+c.id, c); n++;
    }
  });
  if(n){ salva('custom'); BIB.indexa(); }
}
function vinculaRidPorTitulo(){
  if(S.cfg.ridLink) return;
  const mapa={};
  Object.values(S.rotinas||{}).forEach(r=>{ if(!r.apagada && r.titulo) mapa[r.titulo.trim().toLowerCase()]=r.id; });
  let n=0;
  Object.values(S.treinos||{}).forEach(t=>{
    if(t.apagado || t.rid || !t.titulo) return;
    const rid=mapa[t.titulo.trim().toLowerCase()];
    if(rid){ t.rid=rid; NET.agenda('treinos/'+t.id, t); n++; }
  });
  if(n) salva('treinos');
  S.cfg.ridLink=1; salva('cfg'); NET.agenda('app/cfg', S.cfg);
}
function limpaCustomsDuplicados(){
  if(S.cfg.customLimpa) return;
  if(!BIB.pronta){ setTimeout(limpaCustomsDuplicados, 1200); return; }
  let n=0;
  Object.values(S.custom).forEach(c=>{
    if(!c || c.oc) return;
    const nn = BIB.norm(c.n||'');
    const eq = BIB.lista.find(q=>!q.custom && !q.oc && (q._nn===nn || (q._nn && q._nn.indexOf(nn+' (')===0)));
    if(eq){ c.oc=1; c.atualizado=agora(); NET.agenda('custom/'+c.id, c); n++; }
  });
  if(n){ salva('custom'); BIB.indexa(); if(['inicio','treino'].includes(UI.telaAtual)) UI.refaz(); }
  S.cfg.customLimpa=1; salva('cfg'); NET.agenda('app/cfg', S.cfg);
}
async function hidrataSocial(){
  if(!S.auth) return;
  try{
    const v = await NET.get('/seguindo/'+S.auth.uid) || {};
    let mudou=false;
    Object.keys(v).forEach(u=>{ if(!S.social.seguindo[u]){ S.social.seguindo[u]={}; mudou=true; } });
    const incompleto = Object.values(S.social.seguindo).some(p=>!p || !p.user);
    if(mudou || incompleto){
      const ps = FEED.perfis || await NET.get('/perfis') || {};
      FEED.perfis = FEED.perfis || ps;
      Object.keys(S.social.seguindo).forEach(u=>{
        const p=ps[u]||{}; const s=S.social.seguindo[u]||(S.social.seguindo[u]={});
        if(p.user && s.user!==p.user){ s.user=p.user; mudou=true; }
        if(p.nome!=null && s.nome!==p.nome){ s.nome=p.nome; mudou=true; }
        if(s.foto!==(p.foto||null)){ s.foto=p.foto||null; mudou=true; }
      });
    }
    if(mudou){ salva('social'); if(['inicio','perfil','perfilAmigo'].includes(UI.telaAtual)) UI.refaz(); }
  }catch(e){}
}

const ASSIST_CARDIO = {"academia":["cardio__esteira-ergometrica","cardio__bike","cardio__eliptico-transport"],"basica":["cardio__esteira-ergometrica","cardio__bike","cardio__eliptico-transport"],"casa":["funcional__corrida-com-joelhos-altos","cardio__polichinelo-jumping-jack","funcional__caminhada-rapida"],"corpo":["funcional__corrida-com-joelhos-altos","cardio__polichinelo-jumping-jack","crossfit__burpees"]};

/* modelos de dia (7 slots; grupo repetido = exercícios diferentes do mesmo grupo).
   Limites respeitados p/ pools finos: posteriores máx 1/dia, ombros máx 2, peito/costas máx 3, quad máx 2. */
const ASSIST_DIAS = {
  fullbody:[
    {n:'Treino A', g:['quadriceps','peito','costas','ombros','abdomen','biceps','triceps']},
    {n:'Treino B', g:['posteriores','costas','peito','ombros','abdomen','quadriceps','biceps']},
    {n:'Treino C', g:['gluteos','quadriceps','costas','ombros','panturrilha','peito','abdomen']}],
  upperlower:[
    {n:'Upper A · Superior', g:['peito','costas','ombros','triceps','biceps','peito','costas']},
    {n:'Lower A · Inferior', g:['quadriceps','posteriores','gluteos','panturrilha','abdomen','quadriceps','gluteos']},
    {n:'Upper B · Superior', g:['costas','peito','ombros','biceps','triceps','costas','peito']},
    {n:'Lower B · Inferior', g:['quadriceps','posteriores','gluteos','panturrilha','abdomen','gluteos','quadriceps']}],
  abc:[
    {n:'A · Peito e tríceps', g:['peito','peito','ombros','triceps','triceps','peito','ombros']},
    {n:'B · Costas e bíceps', g:['costas','costas','biceps','biceps','trapezio','costas','biceps']},
    {n:'C · Pernas e ombros', g:['quadriceps','posteriores','gluteos','panturrilha','quadriceps','gluteos','ombros']}],
  ppl:[
    {n:'Push · Empurrar', g:['peito','peito','ombros','ombros','triceps','peito','triceps']},
    {n:'Pull · Puxar', g:['costas','costas','biceps','biceps','trapezio','costas','biceps']},
    {n:'Legs · Pernas', g:['quadriceps','posteriores','gluteos','panturrilha','quadriceps','gluteos','abdomen']}]
};
const ASSIST_ESQUEMA = {
  manter:      {comp:[3,12], iso:[3,12], desc:60},
  hipertrofia: {comp:[4,9],  iso:[3,12], desc:90},
  gordura:     {comp:[3,15], iso:[3,15], desc:45},
  forca:       {comp:[5,5],  iso:[3,8],  desc:120}
};
const ASSIST_OBJ = {
  manter:      {t:'Começar / me manter ativo', sub:'Frequência sem complicar a cabeça', ic:'🌱'},
  hipertrofia: {t:'Ganhar músculo', sub:'Hipertrofia com volume progressivo', ic:'💪'},
  gordura:     {t:'Perder gordura / trincar', sub:'Mais volume e cardio no fim', ic:'🔥'},
  forca:       {t:'Ganhar força', sub:'Cargas altas, menos repetição', ic:'🏋️'}
};
const ASSIST_LOCAL = {
  academia: {t:'Academia completa', sub:'Máquinas, cabos, barras e halteres', ic:'🏢'},
  basica:   {t:'Academia básica', sub:'Barras, halteres e algumas máquinas', ic:'🏬'},
  casa:     {t:'Em casa (com halteres)', sub:'Halteres, banco e elásticos', ic:'🏠'},
  corpo:    {t:'Só peso do corpo', sub:'Sem equipamento, calistenia', ic:'🤸'}
};
const SPLIT_NOME = {fullbody:'Full Body', upperlower:'Upper / Lower', abc:'ABC', ppl:'Push Pull Legs'};
const NIVEL_NOME = {iniciante:'Iniciante', intermediario:'Intermediário', avancado:'Avançado'};
const FOCO_NOME  = {equilibrado:'Equilibrado', peito:'Peito', costas:'Costas', ombros:'Ombros', biceps:'Braços', quadriceps:'Pernas', gluteos:'Glúteos'};
const GRUPO_NOME = {peito:'Peito', costas:'Costas', ombros:'Ombros', triceps:'Tríceps', biceps:'Bíceps', quadriceps:'Quadríceps', posteriores:'Posteriores', gluteos:'Glúteos', panturrilha:'Panturrilha', abdomen:'Abdômen', trapezio:'Trapézio', cardio:'Cardio'};

const ASSIST = {
  premium:false, passo:0, resp:null, ficha:null, gerando:false, _genTimers:[],
  passos:['intro','objetivo','frequencia','foco','cardio','local','duracao','nivel','resultado'],

  _limpaTimers(){ (ASSIST._genTimers||[]).forEach(clearTimeout); ASSIST._genTimers=[]; },
  reset(){ ASSIST._limpaTimers(); ASSIST.passo=0; ASSIST.ficha=null; ASSIST.gerando=false;
    ASSIST.resp={objetivo:null, dias:null, foco:'equilibrado', cardio:null, local:null, duracao:null, nivel:'iniciante'}; },
  abre(){ ASSIST.reset(); UI.vai('assistente'); },
  prox(){ const at=ASSIST.passos[ASSIST.passo];
    if(at==='nivel'){ ASSIST.iniciarGeracao(); return; }
    if(ASSIST.passo<ASSIST.passos.length-1){ ASSIST.passo++; UI.refaz(); window.scrollTo(0,0); } },
  iniciarGeracao(){ ASSIST.gera(); ASSIST.passo=ASSIST.passos.indexOf('resultado'); ASSIST.gerando=true; UI.refaz(); window.scrollTo(0,0); },
  volta(){ ASSIST._limpaTimers();
    if(ASSIST.gerando){ ASSIST.gerando=false; ASSIST.passo=ASSIST.passos.indexOf('nivel'); UI.refaz(); window.scrollTo(0,0); return; }
    if(ASSIST.passo>0){ ASSIST.passo--; UI.refaz(); window.scrollTo(0,0); } else UI.volta(); },

  split(){ const r=ASSIST.resp;
    if(r.dias<=3) return 'fullbody';
    if(r.dias===4) return 'upperlower';
    return r.objetivo==='manter' ? 'abc' : 'ppl'; },

  _reps(grupo, comp, tipo, obj){
    const esq=ASSIST_ESQUEMA[obj]||ASSIST_ESQUEMA.hipertrofia;
    let ser=(comp?esq.comp:esq.iso)[0], val=(comp?esq.comp:esq.iso)[1];
    if(grupo==='panturrilha'||grupo==='abdomen'){ ser=3; if(tipo!=='tempo') val=15; }
    if(tipo==='tempo') val=(obj==='forca'?30:40);
    return {ser, val, desc:esq.desc};
  },

  gera(){
    const r=ASSIST.resp;
    const pool=ASSIST_POOLS[r.local]||ASSIST_POOLS.academia;
    const split=ASSIST.split();
    const nDur={30:4, 45:5, 60:6}[r.duracao] || ({iniciante:5, intermediario:6, avancado:7}[r.nivel]||5);
    const nBase=nDur + (r.nivel==='avancado'?1:0);
    const modelos=ASSIST_DIAS[split].map(m=>({n:m.n, g:m.g.slice()}));
    const usarModelos = split==='fullbody' ? modelos : modelos;
    const cardioFim=(r.cardio==='fim')||r.objetivo==='gordura';
    const rnd=a=>a[Math.floor(Math.random()*a.length)];
    const escolhe=(g,usados)=>{
      let c=(pool[g]||[]).filter(id=>!usados.has(id));
      if(!c.length) c=(pool[g]||[]).slice();
      if(!c.length) c=[].concat.apply([],Object.values(pool)).filter(id=>!usados.has(id));
      const vies = r.nivel==='iniciante'?2.6 : r.nivel==='intermediario'?1.8 : 1.3; // favorece exercícios clássicos (frente do pool)
      return c[Math.floor(Math.pow(Math.random(), vies)*c.length)] || c[0];
    };
    const rotinas=usarModelos.map(mod=>{
      let grupos=mod.g.slice(0,nBase);
      if(r.foco!=='equilibrado' && grupos.includes(r.foco)) grupos.push(r.foco); // reforço = +1 exercício, sem derrubar grupo
      const usados=new Set();
      const ex=grupos.map((g,idx)=>{
        const id=escolhe(g,usados); usados.add(id);
        const x=BIB.ex(id);
        const rr=ASSIST._reps(g, idx<2, x.t, r.objetivo);
        return {exId:id, grupo:g, descanso:rr.desc, notas:'',
          series:Array.from({length:rr.ser},()=>({tipo:'N', kg:'', reps:String(rr.val)}))};
      });
      if(cardioFim){
        const cid=rnd(ASSIST_CARDIO[r.local]||ASSIST_CARDIO.academia); const cx=BIB.ex(cid);
        ex.push({exId:cid, grupo:'cardio', descanso:0, notas:'Finalizador',
          series:[{tipo:'N', kg:'', reps: cx.t==='tempo'? String(r.objetivo==='gordura'?900:600) : '15'}]});
      }
      return {titulo:mod.n, ex};
    });
    ASSIST.ficha={split, rotinas, resumo:{objetivo:r.objetivo, dias:r.dias, nivel:r.nivel, foco:r.foco, cardio:cardioFim, local:r.local}};
    try{ S.cfg.assistResp={objetivo:r.objetivo,dias:r.dias,foco:r.foco,cardio:r.cardio,local:r.local,duracao:r.duracao,nivel:r.nivel}; S.cfg.atualizado=agora(); salva('cfg'); }catch(e){}
  },

  trocaExercicio(ri, ei){
    const f=ASSIST.ficha; if(!f) return; const rot=f.rotinas[ri]; if(!rot) return; const e=rot.ex[ei]; if(!e) return;
    const r=ASSIST.resp; let cand;
    if(e.notas==='Finalizador'){ cand=(ASSIST_CARDIO[r.local]||[]).filter(id=>id!==e.exId); }
    else { const pool=(ASSIST_POOLS[r.local]||{})[e.grupo]||[]; const usados=new Set(rot.ex.map(x=>x.exId));
      cand=pool.filter(id=>!usados.has(id)); if(!cand.length) cand=pool.filter(id=>id!==e.exId); }
    if(!cand.length){ UI.toast('Sem outra opção pra esse grupo'); return; }
    const nid=cand[Math.floor(Math.random()*cand.length)]; const nx=BIB.ex(nid); e.exId=nid;
    if(e.notas!=='Finalizador'){ const rr=ASSIST._reps(e.grupo, ei<2, nx.t, r.objetivo);
      e.series=Array.from({length:rr.ser},()=>({tipo:'N', kg:'', reps:String(rr.val)})); }
    UI.refaz();
  },

  salvar(){
    if(ASSIST.premium && !(S.cfg&&S.cfg.assinante)){ UI.toast('Recurso do plano premium (em breve)'); return; }
    const f=ASSIST.ficha; if(!f) return;
    const nomePasta='Minha ficha · '+(SPLIT_NOME[f.split]||'');
    const pasta={id:uid(), nome:nomePasta, ordem:Object.keys(S.pastas).length+1, criado:agora(), atualizado:agora()};
    S.pastas[pasta.id]=pasta; NET.agenda('pastas/'+pasta.id, pasta);
    f.rotinas.forEach(mod=>{
      const rot={id:uid(), titulo:mod.titulo, pasta:pasta.id, criado:agora(), atualizado:agora(),
        ex:mod.ex.map(e=>({exId:e.exId, descanso:e.descanso, notas:e.notas||'',
          series:e.series.map(s=>({tipo:s.tipo, kg:s.kg, reps:s.reps}))}))};
      S.rotinas[rot.id]=rot; NET.agenda('rotinas/'+rot.id, rot); if(typeof ROTPUB!=='undefined') ROTPUB.envia(rot);
    });
    salva('pastas'); salva('rotinas');
    UI.toast(f.rotinas.length+' rotinas criadas em "'+nomePasta+'" ✓', true);
    UI.pilha=[]; UI.vai('treino',null,false);
    ASSIST._folhaProgresso(f);
  },

  _tempoMin(rot){ let s=0; rot.ex.forEach(e=>{ const x=BIB.ex(e.exId);
    e.series.forEach(se=>{ const trab=x.t==='tempo'?(Number(se.reps)||40):40; s+=trab+(e.descanso||60); }); }); return Math.max(1,Math.round(s/60)); },
  _racional(f){ const r=f.resumo, sp=f.split;
    const div={fullbody:'treina o corpo inteiro em cada sessão, que é o ideal pra quem vai '+r.dias+(r.dias>1?' a 3 dias':' dia'),
      upperlower:'separa superior e inferior, um bom equilíbrio pra 4 dias',
      abc:'divide em três grupos e roda 3 ou 6 vezes na semana',
      ppl:'empurrar, puxar e pernas, o clássico pra 5 ou 6 dias'}[sp];
    const obj={manter:'As séries e repetições ficam moderadas pra você criar o hábito sem se detonar.',
      hipertrofia:'O volume fica na faixa de hipertrofia, com os compostos puxando mais carga.',
      gordura:'Mais repetições e um cardio no fim pra aumentar o gasto calórico.',
      forca:'Cargas altas e poucas repetições nos compostos pra priorizar força.'}[r.objetivo];
    return 'Montei um '+SPLIT_NOME[sp]+' porque '+div+'. '+obj; }
};

TELAS.assistente = function(){
  const passo=ASSIST.passos[ASSIST.passo]; const r=ASSIST.resp;
  UI.topo(assistVoltar(), h('div',{class:'topo-tit',style:'font-size:18px'},'Assistente de ficha'));
  const m=$('#main'); m.innerHTML='';
  const qi=ASSIST.passos.indexOf(passo)-1, qtot=7;

  if(passo==='resultado'){ if(ASSIST.gerando) ASSIST._telaGerando(m); else ASSIST._resultado(m); return; }

  if(passo==='intro'){
    m.append(
      h('div',{style:'text-align:center;padding:16px 0 6px'},
        h('div',{style:'font-size:44px'},'🧭'),
        h('div',{class:'b800',style:'font-size:24px;margin-top:8px'},'Monte sua ficha ideal'),
        h('div',{class:'f13 mut',style:'margin:10px auto 0;max-width:310px;line-height:1.6'},'Responda umas perguntas rápidas e o ForgeX monta uma ficha completa, com os exercícios já escolhidos e prontos pra treinar.')));
    const bl=h('div',{class:'card',style:'margin-top:18px'});
    [['🎯','Feita pro seu objetivo','Músculo, gordura, força ou só começar'],
     ['🏋️','Exercícios de verdade','Escolhidos da biblioteca conforme seu equipamento'],
     ['🔁','Do seu jeito','Gere de novo, troque exercícios e edite tudo depois']].forEach((it,i)=>{
      bl.append(h('div',{class:'linha',style:'padding:10px 0'+(i?';border-top:1px solid var(--surf2)':'')},
        h('div',{style:'font-size:21px;width:32px;text-align:center'},it[0]),
        h('div',{class:'esp'}, h('div',{class:'b700',style:'font-size:14.5px'},it[1]), h('div',{class:'f13 mut',style:'margin-top:1px'},it[2]))));
    });
    m.append(bl, assistBtn('Começar', true, ()=>ASSIST.prox()));
    const ar=S.cfg.assistResp;
    if(ar && ar.objetivo && ar.dias && ar.local){
      m.append(h('button',{class:'btn',style:'margin-top:10px',onclick:()=>{ Object.assign(ASSIST.resp, ar); ASSIST.iniciarGeracao(); }},
        '⚡ Gerar de novo com minhas respostas ('+(ASSIST_OBJ[ar.objetivo]?ASSIST_OBJ[ar.objetivo].t.split(' / ')[0]:'')+' · '+ar.dias+' dias)'));
    }
    return;
  }

  m.append(assistProg(qi, qtot));

  if(passo==='objetivo'){
    m.append(h('div',{class:'b800',style:'font-size:21px;margin-bottom:4px'},'Qual é o seu objetivo?'),

ASSIST._telaGerando = function(m){
  const r=ASSIST.resp; const split=ASSIST.split(); const cardioFim=(r.cardio==='fim')||r.objetivo==='gordura';
  const msgs=[
    'Analisando seu objetivo: '+ASSIST_OBJ[r.objetivo].t.split(' / ')[0].toLowerCase(),
    'Escolhendo a divisão ideal: '+SPLIT_NOME[split],
    'Selecionando exercícios pra '+ASSIST_LOCAL[r.local].t.toLowerCase(),
    'Ajustando o volume pro nível '+NIVEL_NOME[r.nivel].toLowerCase(),
    (r.duracao? 'Encaixando no seu tempo de '+r.duracao+' min' : 'Definindo o tempo de cada treino'),
    (r.foco!=='equilibrado'? 'Reforçando '+(FOCO_NOME[r.foco]||'').toLowerCase() : 'Equilibrando os grupos musculares'),
    (cardioFim? 'Encaixando o cardio no fim' : 'Definindo séries e repetições'),
    'Finalizando sua ficha'];
  const ring=h('div',{style:'position:relative;width:84px;height:84px;margin:26px auto 0'},
    h('div',{class:'fx-ring'}),
    h('div',{style:'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px'},'🧭'));
  m.append(ring,
    h('div',{class:'b800',style:'font-size:22px;text-align:center;margin-top:20px'},'Montando sua ficha'),
    h('div',{class:'f13 mut',style:'text-align:center;margin-top:4px'},'Personalizando cada treino pra você'));
  const lista=h('div',{style:'margin:26px auto 0;max-width:330px'});
  msgs.forEach((t,i)=>{
    lista.append(h('div',{'data-row':String(i),style:'display:flex;align-items:center;gap:11px;padding:7px 0;opacity:.3;transition:opacity .35s'},
      h('span',{style:'width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0'},
        h('span',{'data-spin':String(i),class:'fx-mini-spin'}),
        h('span',{'data-chk':String(i),style:'display:none;color:var(--brand2);font-weight:800;font-size:15px'},'✓')),
      h('div',{style:'font-size:13.5px'}, t)));
  });
  m.append(lista);
  const barOut=h('div',{style:'height:5px;background:var(--surf3);border-radius:3px;margin:26px auto 0;max-width:330px;overflow:hidden'});
  const barIn=h('div',{style:'height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:3px'});
  barOut.append(barIn); m.append(barOut);

  ASSIST._limpaTimers();
  const dt=380, total=msgs.length*dt+460;
  try{ requestAnimationFrame(()=>{ barIn.style.transition='width '+total+'ms linear'; barIn.style.width='100%'; }); }catch(e){ barIn.style.width='100%'; }
  const done=(i)=>{ const s=m.querySelector('[data-spin="'+i+'"]'), c=m.querySelector('[data-chk="'+i+'"]'); if(s)s.style.display='none'; if(c)c.style.display='inline-flex'; };
  const acende=(i)=>{ const row=m.querySelector('[data-row="'+i+'"]'); if(row)row.style.opacity='1'; };
  acende(0);
  msgs.forEach((t,i)=>{
    if(i>0) ASSIST._genTimers.push(setTimeout(()=>{ acende(i); done(i-1); }, i*dt));
  });
  ASSIST._genTimers.push(setTimeout(()=>done(msgs.length-1), (msgs.length-1)*dt+320));
  ASSIST._genTimers.push(setTimeout(()=>{ ASSIST.gerando=false; if(UI.telaAtual==='assistente'){ UI.refaz(); window.scrollTo(0,0); } }, total));
};

    h('div',{class:'f12 b700',style:'width:20px;text-align:right'}, String(n)))); });

    rot.ex.forEach((e,ei)=>{

    });

const CONTA = {
  wipeLocal(){
    ['rotinas','pastas','treinos','prs','custom','medidas'].forEach(k=>{ S[k]={}; salva(k); });
    S.fila=[]; salva('fila'); S.social={seguindo:{}}; salva('social');
    S.perfil=null; salva('perfil');
  },
  folhaCriar(){
    const em=h('input',{type:'email',placeholder:'seu@email.com',autocapitalize:'off',autocomplete:'email'});
    const se=h('input',{type:'password',placeholder:'Mínimo 6 caracteres',autocomplete:'new-password'});
    const us=h('input',{placeholder:'ex.: chris_mello',autocapitalize:'off'});
    UI.folha('Criar conta',[
      h('div',{class:'f13 mut',style:'margin-bottom:12px;line-height:1.6'},'Tudo que já está neste aparelho continua na conta. Com e-mail você entra de qualquer lugar e libera o feed com amigos.'),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'E-mail'), em, h('div',{style:'height:10px'}),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Senha'), se, h('div',{style:'height:10px'}),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Nome de usuário (para amigos te acharem)'), us, h('div',{style:'height:14px'}),
      h('button',{class:'btn btn-p',onclick:async function(){
        const email=em.value.trim(), senha=se.value, u=us.value.trim().toLowerCase().replace('@','');
        if(!/^[a-z0-9_]{3,20}$/.test(u)){ UI.toast('Usuário: 3 a 20 letras minúsculas, números ou _'); return; }
        if(!email.includes('@') || senha.length<6){ UI.toast('Confira e-mail e senha'); return; }
        this.disabled=true; this.textContent='Criando…';
        try{
          const dono=await NET.get('/usernames/'+u);
          if(dono && dono!==S.auth.uid) throw new Error('Esse nome de usuário já está em uso.');
          await NET.criarConta(email, senha);
          await NET.putD('/usernames/'+u, S.auth.uid);
          await NET.putD('/perfis/'+S.auth.uid, {nome:S.perfil?.nome||'Atleta', user:u, foto:S.perfil?.foto||null, bio:(S.perfil?.bio||'')||null, link:S.perfil?.link||null, atualizado:agora()});
          if(!S.perfil) S.perfil={criado:agora(), nome:'Atleta'};
          S.perfil.email=email; S.perfil.user=u; S.perfil.atualizado=agora();
          salva('perfil'); NET.agenda('app/perfil',S.perfil);
          S.cfg.feedPub=true; S.cfg.atualizado=agora(); salva('cfg'); NET.agenda('app/cfg',S.cfg);
          UI.fechaFolha();
          if(UI.telaAtual==='boasVindas'){ UI.pilha=[]; UI.vai('inicio',null,false); } else UI.refaz();
          UI.toast('Conta criada ✓', true);
        }catch(err){ UI.toast(err.message||'Erro ao criar conta'); this.disabled=false; this.textContent='Criar conta'; }
      }},'Criar conta')]);
  },
  folhaEntrar(){
    const em=h('input',{type:'email',placeholder:'seu@email.com',autocapitalize:'off',autocomplete:'email'});
    const se=h('input',{type:'password',placeholder:'Senha',autocomplete:'current-password'});
    UI.folha('Entrar',[
      h('div',{class:'f13',style:'margin-bottom:12px;line-height:1.6;color:var(--warn)'},'Atenção: entrar em uma conta substitui os dados locais deste aparelho pelos dados da conta.'),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'E-mail'), em, h('div',{style:'height:10px'}),
      h('div',{class:'f13 mut',style:'margin-bottom:4px'},'Senha'), se, h('div',{style:'height:14px'}),
      h('button',{class:'btn btn-p',onclick:async function(){
        const email=em.value.trim(), senha=se.value;
        if(!email.includes('@') || !senha){ UI.toast('Preencha e-mail e senha'); return; }
        this.disabled=true; this.textContent='Entrando…';
        try{
          const auth=await NET.entrar(email, senha);
          CONTA.wipeLocal();
          S.auth=auth; salva('auth');
          await NET.puxa();
          if(!S.perfil) S.perfil={nome:'Atleta', criado:agora()};
          S.perfil.email=email; S.perfil.atualizado=agora(); salva('perfil');
          location.reload();

const FEED = {
  amigos:{}, curt:{}, com:{}, perfis:null, _hidratado:false,
  hidrata(){
    if(FEED._hidratado) return;
    try{ const c=JSON.parse(localStorage.getItem('tg_feedcache')||'null');
      if(c && c.amigos){ FEED.amigos=c.amigos; FEED.curt=c.curt||{}; FEED.com=c.com||{}; FEED.perfis=c.perfis||FEED.perfis; }
    }catch(e){}
    FEED._hidratado=true;
  },
  salvaCache(){
    try{ const donos=Object.keys(FEED.amigos); const amigos={};
      donos.forEach(d=>{ amigos[d]=(FEED.amigos[d]||[]).slice(0,25); });
      localStorage.setItem('tg_feedcache', JSON.stringify({amigos, curt:FEED.curt, com:FEED.com, perfis:FEED.perfis, ts:Date.now()}));
    }catch(e){}
  },
  async carrega(){
    if(!S.auth) return;
    FEED.hidrata();
    const donos=[S.auth.uid].concat(Object.keys(S.social.seguindo||{}).filter(u=>!MOD.bloqueado(u)));
    const pPerfis = NET.get('/perfis').then(v=>{ FEED.perfis=v||{}; });
    await Promise.all(donos.map(async d=>{
      FEED.curt[d]=await NET.get('/curtidas/'+d)||{};
      FEED.com[d]=await NET.get('/comentarios/'+d)||{};
      if(d!==S.auth.uid){
        let v=await NET.get('/feed/'+d+'?orderBy=%22inicio%22&limitToLast=40');
        if(v==null) v=await NET.get('/feed/'+d);
        FEED.amigos[d]=Object.values(v||{}).sort((a,b)=>b.inicio-a.inicio).slice(0,40);
      }
    }).concat([pPerfis]));
    FEED.salvaCache();
  },
  itens(){
    const meus=Object.values(S.treinos).filter(t=>!t.apagado).map(t=>({meu:true,dono:S.auth?.uid,t,id:t.id,inicio:t.inicio}));
    const dos=Object.entries(FEED.amigos).filter(([d])=>!MOD.bloqueado(d))
      .flatMap(([d,arr])=>(arr||[]).map(r=>({meu:false,dono:d,r,id:r.id,inicio:r.inicio})));
    return meus.concat(dos).sort((a,b)=>b.inicio-a.inicio).slice(0,80);
  }
};

  const x=BIB.lista.find(q=>q._nn===nn);
  if(x) return thumbEl(x.id);
  return h('div',{class:'thumb-ini',style:'width:44px;height:44px;font-size:16px'},(n||'?')[0].toUpperCase());
}
function svgCoracao(cheio){
  // joinha (curtir)
  return '<svg viewBox="0 0 24 24" fill="'+(cheio?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>';
}

/* ---------- IMPORTADOR HEVY ---------- */
const HEVYIMP = {
  pede(tipo){
    const inp=h('input',{type:'file', accept:'.csv,text/csv', style:'display:none'});
    inp.addEventListener('change',()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ try{ tipo==='treinos'? HEVYIMP.previewTreinos(r.result) : HEVYIMP.previewMedidas(r.result); }
        catch(e){ UI.toast('Não consegui ler esse arquivo'); } };
      r.readAsText(f,'utf-8');
    });
    document.body.appendChild(inp); inp.click(); setTimeout(()=>inp.remove(),60000);
  },
  resolve(titulo, criados){
    const tt=(titulo||'').trim();
    if(HEVY_MAPA[tt]) return HEVY_MAPA[tt];
    const jaCustom=Object.values(S.custom).find(c=>c.hevy===tt);
    if(jaCustom) return jaCustom.id;
    const nv=HEVY_NOVOS[tt]||{n:tt,g:'corpo-inteiro',e:'outro',t:'peso_reps'};
    const id='custom__hv-'+BIB.norm(nv.n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    if(!S.custom[id]) criados.push(nv.n);
    S.custom[id]=Object.assign({id, custom:true, hevy:tt, atualizado:agora()}, nv);
    return id;
  },
  previewTreinos(texto){
    const rows=IMP.parseCSV(texto);
    if(!rows.length || !('exercise_title' in rows[0])){ UI.toast('Esse não parece ser o workout_data.csv exportado'); return; }
    const criados=[];
    const treinos=IMP.montaTreinos(rows, t=>HEVYIMP.resolve(t, criados));
    const novosT=treinos.filter(t=>!S.treinos[t.id]);
    UI.folha('Importar treinos',[
      h('div',{class:'f14',style:'line-height:1.8;padding:2px 2px 12px'},
        h('div',{},h('span',{class:'b800'},String(treinos.length)),' treinos no arquivo'),
        h('div',{},h('span',{class:'b800',style:'color:var(--ok)'},String(novosT.length)),' novos serão importados'),
        treinos.length-novosT.length>0? h('div',{class:'mut'},(treinos.length-novosT.length)+' já existiam (ignorados)'):null,
        criados.length? h('div',{},h('span',{class:'b800'},String(criados.length)),' exercícios novos serão criados: ',h('span',{class:'f13 mut'},criados.join(', '))):null,
        h('div',{class:'f13 mut',style:'margin-top:8px'},'Os recordes pessoais serão recalculados considerando todo o histórico.')),
      h('button',{class:'btn btn-p',onclick:()=>{
        novosT.forEach(t=>{ t.atualizado=t.fim; S.treinos[t.id]=t; });
        const resets={}; Object.entries(S.prs).forEach(([ex,p])=>{ if(p && p.resetEm) resets[ex]=p.resetEm; });
        const prs=CORE.recomputaPRs(Object.values(S.treinos).filter(t=>!t.apagado), resets);
        S.prs=prs;
        salva('custom'); salva('treinos'); salva('prs');
        BIB.lista=BIB.lista.filter(x=>!x.custom).concat(Object.values(S.custom)); BIB.indexa();
        Object.values(S.custom).forEach(c=>NET.agenda('custom/'+c.id,c));
        novosT.forEach(t=>NET.agenda('treinos/'+t.id,t));
        NET.agenda('prs',S.prs);
        UI.fechaFolha(); UI.pilha=[]; UI.vai('inicio',null,false);
        UI.toast(novosT.length+' treinos importados');
      }}, novosT.length? 'Importar '+novosT.length+' treinos':'Nada novo para importar')
    ]);
  },
  previewMedidas(texto){
    const rows=IMP.parseCSV(texto);
    if(!rows.length || !('date' in rows[0])){ UI.toast('Esse não parece ser o measurement_data.csv exportado'); return; }
    const meds=IMP.montaMedidas(rows);
    const novas=meds.filter(x=>!S.medidas[x.id]);
    UI.folha('Importar medidas',[
      h('div',{class:'f14',style:'line-height:1.8;padding:2px 2px 12px'},
        h('div',{},h('span',{class:'b800'},String(meds.length)),' registros no arquivo · ',
          h('span',{class:'b800',style:'color:var(--ok)'},String(novas.length)),' novos')),
      h('button',{class:'btn btn-p',onclick:()=>{
        novas.forEach(x=>{ x.atualizado=agora(); S.medidas[x.id]=x; NET.agenda('medidas/'+x.id,x); });
        salva('medidas'); UI.fechaFolha(); UI.refaz(); UI.toast(novas.length+' registros importados');
      }}, novas.length? 'Importar '+novas.length+' registros':'Nada novo para importar')
    ]);
  }
};

(async function boot(){
  try{ await BIB.carrega(); }catch(e){}
  $('#fantasma').remove();
  if(!S.perfil || !S.perfil.nome){ UI.vai('boasVindas',null,false); }
  else if(!TERMOS.aceitou()){ setTimeout(()=>{ try{ TERMOS.folhaObrigatoria(); }catch(e){} }, 700); }
  else if(S.ativo){ UI.vai('ativo',null,false); }
  else UI.vai('inicio',null,false);
  // rede em segundo plano
  (async()=>{ try{ if(!S.auth && S.perfil) await NET.signup(); await NET.puxa(); NET.despacha(); ROTPUB.syncTudo(); hidrataSocial(); limpaCustomsDuplicados(); corrigeTiposCustoms(); vinculaRidPorTitulo(); publicaCustomsIniciais(); corrigePastasOrfas(); recuperaExsOrfaos(); reconciliaRecordes(); reparaPRsFantasma(); setTimeout(()=>PUSH.renova(), 2500); setTimeout(()=>autocuraNuvem(), 4000); }catch(e){} })();
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
